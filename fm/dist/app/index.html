/** Uma partida já concluída em rodadas anteriores. */
                              
                                                    
                     
                     
                    
                    
 

                               
                        
                                           
                                                                                                      
                               
                                                                                                     
                                    
                                                    
                                                                                      
                                                                                                
                                           
                                                                                        
                                 
                                                        
                                  
 

// ---------- Visões ----------

                             
             
               
              
                      
                     
                   
                      
                        
                          
 

                                                      
                 
            
            
 

                             
                                                                                                                           
                          
                       
                         
               
                     
                                                                           
                   
                               
                      
                                 
                        
                        
                            
 

                                
                  
                      
                                                                                                       
                 
              
                
                     
                       
                                          
                     
 

                             
                
                     
                       
                
                   
                       
                           
 

                                
                
                
                     
                       
                                  
 

                                                    
                                                                                                  

                                                   
                   
                   
                        
 

                           
             
               
                    
                       
                         
                  
               
                                                               
                        
                     
                                                                                                 
                          
                      
                                                                                  
                            
                             
                     
                                                                                 
                                  
                                                                   
                                                                                          
 

                              
             
               
                    
                     
                       
                        
                          
                        
 

// ---------- Auxiliares (todos puros) ----------

const POSITION_ORDER                           = { GK: 0, DEF: 1, MID: 2, ATT: 3 };

function playerOf(ctx              , id        )         {
  const p = ctx.world.players[id];
  if (!p) throw new QueryError('UNKNOWN_PLAYER', `jogador inexistente no mundo: ${id}`);
  return p;
}

function clubOf(ctx              , id        )       {
  const c = ctx.world.clubs[id];
  if (!c) throw new QueryError('UNKNOWN_CLUB', `clube inexistente: ${id}`);
  return c;
}

function playerView(p        )             {
  return {
    id: p.id,
    name: p.name,
    age: p.age,
    nationality: p.nationality,
    position: p.position,
    strength: p.strength,
    marketValue: p.marketValue,
    injuredRounds: p.condition.injuryRounds,
    suspendedRounds: p.condition.suspensionRounds,
  };
}

function byPositionThenStrength(a            , b            )         {
  return (
    POSITION_ORDER[a.position] - POSITION_ORDER[b.position] || b.strength - a.strength || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)
  );
}

function slotView(ctx              , slot            )                   {
  return { ...playerView(playerOf(ctx, slot.playerId)), sector: slot.sector, x: slot.x, y: slot.y };
}

/** Força geral do melhor time disponível, ou null se não há 11 disponíveis. */
function bestStrength(ctx              , club      )                {
  try {
    const lineup = autoLineup(club, ctx.world.players, {}, DEFAULT_CONFIG);
    return overallStrength(lineup.starters, ctx.world.players, DEFAULT_CONFIG);
  } catch {
    return null;
  }
}

function liveMatchOf(ctx              , clubId        )                    {
  if (!ctx.round) return null;
  return ctx.round.matches.find((m) => m.home.clubId === clubId || m.away.clubId === clubId) ?? null;
}

/**
 * Minuto a mostrar. No fim do jogo (ou com uma decisão pendente depois do último minuto de acréscimo) o relógio interno
 * fica um minuto além do último jogado; a consulta mostra o último minuto realmente jogado.
 */
function shownClock(m            )        {
  const pastEnd =
    m.status === 'FINISHED' ||
    (m.clock.half === 2 && m.clock.minute === 90 && m.stoppage.second !== null && m.clock.added > m.stoppage.second && m.pendingPenalty === null);
  return pastEnd ? m.events[m.events.length - 1].clock : m.clock;
}

function roundInProgress(ctx              )          {
  return ctx.round !== null && ctx.round.matches.some((m) => m.status !== 'FINISHED');
}

function liveLineup(ctx              , team           )             {
  const starters = team.onField.map((slot) => slotView(ctx, slot));
  const view = (ids                   ) => ids.map((id) => playerView(playerOf(ctx, id))).sort(byPositionThenStrength);
  const formation = formationOf(team.onField);
  const rated = Object.fromEntries(team.onField.map((s) => [s.playerId, team.players[s.playerId]]));
  return {
    source: 'LIVE',
    formation,
    formationLabel: formationLabel(formation),
    style: team.style,
    behavior: team.behavior,
    strength: overallStrength(team.onField, rated, DEFAULT_CONFIG),
    starters,
    bench: view(team.bench),
    sentOff: view(team.sentOff),
    injured: view(team.injured),
    substitutionsUsed: team.subsUsed,
  };
}

function autoLineupView(ctx              , club      )                    {
  try {
    const lineup = autoLineup(club, ctx.world.players, {}, DEFAULT_CONFIG);
    const formation = formationOf(lineup.starters);
    return {
      source: 'AUTO',
      formation,
      formationLabel: formationLabel(formation),
      style: lineup.style,
      behavior: lineup.behavior,
      strength: overallStrength(lineup.starters, ctx.world.players, DEFAULT_CONFIG),
      starters: lineup.starters.map((slot) => slotView(ctx, slot)),
      bench: lineup.bench.map((id) => playerView(playerOf(ctx, id))).sort(byPositionThenStrength),
      sentOff: [],
      injured: [],
      substitutionsUsed: 0,
    };
  } catch {
    return null;
  }
}

function divisionResults(ctx              , clubIds                   )                {
  const ids = new Set(clubIds);
  return ctx.results.filter((r) => ids.has(r.homeClubId) && ids.has(r.awayClubId));
}

function tableFor(ctx              , divisionId        )                {
  const division = ctx.world.divisions.find((d) => d.id === divisionId);
  if (!division) throw new QueryError('UNKNOWN_DIVISION', `divisão inexistente: ${divisionId}`);
  const results = divisionResults(ctx, division.clubIds).map((r) => ({
    homeClubId: r.homeClubId,
    awayClubId: r.awayClubId,
    homeGoals: r.homeGoals,
    awayGoals: r.awayGoals,
  }));
  return computeStandings(division.clubIds, results, ctx.tiebreakSeed ?? `classificacao:${divisionId}`);
}

function balanceOf(ctx              , club      )              {
  if (club.id === ctx.controlledClubId) return { kind: 'EXACT', amount: club.money };
  const all = Object.values(ctx.world.clubs);
  const below = all.filter((c) => c.money < club.money).length;
  const band              = below * 3 < all.length ? 'LOW' : below * 3 < 2 * all.length ? 'MEDIUM' : 'HIGH';
  return { kind: 'BAND', band };
}

function recentResultsOf(ctx              , clubId        )               {
  const limit = ctx.recentResults ?? 5;
  return ctx.results
    .filter((r) => r.homeClubId === clubId || r.awayClubId === clubId)
    .sort((a, b) => b.round - a.round)
    .slice(0, limit)
    .map((r) => {
      const home = r.homeClubId === clubId;
      const goalsFor = home ? r.homeGoals : r.awayGoals;
      const goalsAgainst = home ? r.awayGoals : r.homeGoals;
      const opponentId = home ? r.awayClubId : r.homeClubId;
      return {
        round: r.round,
        opponentId,
        opponentName: clubOf(ctx, opponentId).name,
        home,
        goalsFor,
        goalsAgainst,
        outcome: goalsFor > goalsAgainst ? 'W' : goalsFor < goalsAgainst ? 'L' : 'D',
      };
    });
}

function nextMatchOf(ctx              , club      )                       {
  const rounds = ctx.schedule[club.divisionId];
  if (!rounds) return null;
  // Com uma rodada em andamento, o próximo jogo é o da rodada seguinte; sem ela, o da rodada indicada.
  const first = roundInProgress(ctx) ? ctx.roundNumber : ctx.roundNumber - 1;
  for (let i = Math.max(0, first); i < rounds.length; i++) {
    const m = rounds[i].find((x) => x.home === club.id || x.away === club.id);
    if (!m) continue;
    const home = m.home === club.id;
    const opponent = clubOf(ctx, home ? m.away : m.home);
    return { round: i + 1, home, opponentId: opponent.id, opponentName: opponent.name, opponentStrength: bestStrength(ctx, opponent) };
  }
  return null;
}

// ---------- API pública ----------

/** Visão pública de um clube. Igual para o clube controlado e para qualquer adversário. */
function getClubView(ctx              , clubId        )           {
  const club = clubOf(ctx, clubId);
  const division = ctx.world.divisions.find((d) => d.id === club.divisionId) ?? null;

  const match = liveMatchOf(ctx, clubId);
  const team = match ? (match.home.clubId === clubId ? match.home : match.away) : null;
  let live                       = null;
  if (match && team) {
    const home = match.home.clubId === clubId;
    const opponent = home ? match.away : match.home;
    const shown = shownClock(match);
    live = {
      matchId: match.matchId,
      status: match.status,
      minute: clockLabel(shown),
      half: shown.half,
      home,
      opponentId: opponent.clubId,
      opponentName: opponent.name,
      score: { for: home ? match.score.home : match.score.away, against: home ? match.score.away : match.score.home },
      attendance: match.attendance,
    };
  }

  let standing                       = null;
  if (division) {
    const table = tableFor(ctx, division.id);
    const idx = table.findIndex((r) => r.clubId === clubId);
    if (idx !== -1) standing = { ...table[idx], position: idx + 1, clubsInDivision: table.length };
  }

  return {
    id: club.id,
    name: club.name,
    shortName: club.shortName,
    primaryColor: club.primaryColor,
    secondaryColor: club.secondaryColor,
    country: club.country,
    city: club.city,
    division: division ? { id: division.id, name: division.name, level: division.level } : null,
    isControlled: club.id === ctx.controlledClubId,
    reputation: club.reputation,
    strength: bestStrength(ctx, club),
    squad: club.squad.map((id) => playerView(playerOf(ctx, id))).sort(byPositionThenStrength),
    lineup: team ? liveLineup(ctx, team) : autoLineupView(ctx, club),
    live,
    form: recentResultsOf(ctx, clubId),
    standing,
    nextMatch: nextMatchOf(ctx, club),
    stadium: { name: club.stadium.name, capacity: club.stadium.capacity, maxCapacity: club.stadium.maxCapacity },
    finance: {
      payrollPerRound: payroll(club, ctx.world.players),
      estimatedAttendance: computeAttendance(club),
      balance: balanceOf(ctx, club),
    },
  };
}

/** Classificação de uma divisão (rodadas concluídas). */
function getStandings(ctx              , divisionId        )                 {
  return tableFor(ctx, divisionId).map((row, i) => {
    const club = clubOf(ctx, row.clubId);
    return { ...row, position: i + 1, clubName: club.name, isControlled: club.id === ctx.controlledClubId };
  });
}

/** Lista de todos os clubes, para o menu da área CLUBES: por divisão (do topo para baixo) e por nome. */
function listClubs(ctx              )                {
  const out                = [];
  for (const d of ctx.world.divisions) {
    for (const id of d.clubIds) {
      const club = clubOf(ctx, id);
      out.push({
        id: club.id,
        name: club.name,
        shortName: club.shortName,
        divisionId: d.id,
        divisionName: d.name,
        divisionLevel: d.level,
        strength: bestStrength(ctx, club),
        isControlled: club.id === ctx.controlledClubId,
      });
    }
  }
  return out.sort((a, b) => a.divisionLevel - b.divisionLevel || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
}

__exports["getClubView"] = getClubView;
__exports["getStandings"] = getStandings;
__exports["listClubs"] = listClubs;
};

__defs["game/lineup-edit.ts"] = function (__exports, __req) {
const { DEFAULT_CONFIG, autoLineup, formationOf,                                                                                } = __req("engine/index.ts");

// Edição da escalação no MEU TIME. Funções puras: devolvem uma escalação nova; a validação final (exatamente 1 goleiro,
// 11 titulares, disponíveis...) é do engine (validateLineup), aplicada por withUserLineup na carreira.

class LineupEditError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'LineupEditError';
    this.code = code;
  }
}

const isStarter = (l        , id        ) => l.starters.some((s) => s.playerId === id);

/**
 * Troca dois jogadores. Titular ↔ titular: trocam de posição. Titular ↔ reserva (ou jogador fora da lista): o de fora
 * assume a posição do titular e o titular vai para o banco. O banco respeita o limite da configuração (o mais fraco que não é
 * goleiro sai da lista se estourar).
 */
function swapPlayers(lineup        , players                        , aId        , bId        )         {
  if (aId === bId) return lineup;
  if (isStarter(lineup, aId) && isStarter(lineup, bId)) {
    return { ...lineup, starters: lineup.starters.map((s) => (s.playerId === aId ? { ...s, playerId: bId } : s.playerId === bId ? { ...s, playerId: aId } : s)) };
  }
  let [starterId, otherId] = [aId, bId];
  if (!isStarter(lineup, starterId)) [starterId, otherId] = [bId, aId];
  if (!isStarter(lineup, starterId)) throw new LineupEditError('NO_STARTER', 'um dos dois jogadores precisa ser titular');
  const starters = lineup.starters.map((s) => (s.playerId === starterId ? { ...s, playerId: otherId } : s));
  let bench = lineup.bench.includes(otherId) ? lineup.bench.map((id) => (id === otherId ? starterId : id)) : [...lineup.bench, starterId];
  while (bench.length > DEFAULT_CONFIG.maxBench) {
    const droppable = bench.filter((id) => id !== starterId && players[id]?.position !== 'GK');
    const weakest = droppable.sort((x, y) => players[x].strength - players[y].strength)[0];
    if (!weakest) break;
    bench = bench.filter((id) => id !== weakest);
  }
  const penaltyTakerId = lineup.penaltyTakerId === starterId ? null : lineup.penaltyTakerId;
  return { ...lineup, starters, bench, penaltyTakerId };
}

function setTactics(lineup        , tactics                                        )         {
  return { ...lineup, style: tactics.style ?? lineup.style, behavior: tactics.behavior ?? lineup.behavior };
}

function setPenaltyTaker(lineup        , playerId               )         {
  if (playerId !== null && !isStarter(lineup, playerId)) throw new LineupEditError('NOT_STARTER', 'o batedor de pênalti precisa ser titular');
  return { ...lineup, penaltyTakerId: playerId };
}

/** Nova formação: o jogo remonta o melhor time disponível nela, mantendo estilo, comportamento e batedor (se ainda titular). */
function applyFormation(club      , players                        , lineup        , formation           )         {
  const auto = autoLineup(club, players, { formation, style: lineup.style, behavior: lineup.behavior });
  const keep = lineup.penaltyTakerId !== null && auto.starters.some((s) => s.playerId === lineup.penaltyTakerId);
  return { ...auto, penaltyTakerId: keep ? lineup.penaltyTakerId : null };
}

/** O melhor time disponível na formação atual (botão MELHOR TIME). */
function bestLineup(club      , players                        , lineup        )         {
  return applyFormation(club, players, lineup, formationOf(lineup.starters));
}

__exports["LineupEditError"] = LineupEditError;
__exports["swapPlayers"] = swapPlayers;
__exports["setTactics"] = setTactics;
__exports["setPenaltyTaker"] = setPenaltyTaker;
__exports["applyFormation"] = applyFormation;
__exports["bestLineup"] = bestLineup;
};

const {

  awaitingMatch,
  createRound,
  isRoundFinished,

// Sessão de jogo (seções 23 e 26). Fica ENTRE o engine e a interface:
//   ENGINE  →  GAME (esta camada)  →  INTERFACE (futura)
//
// A sessão decide QUANDO chamar stepRound. É só isso que a velocidade faz.
// O engine não conhece velocidade, relógio real, pausa de interface nem telas.
//
// Determinismo: mesma seed + mesmos dados + mesmas decisões do jogador = mesmo resultado,
// em qualquer velocidade, com qualquer número de pausas.

// ---------- Velocidades ----------

/** Identificadores em inglês no código; o rótulo em português é o que a interface mostra. */
                                                                           

                            
                
                                                                                                            
                     
 

const SPEEDS                             = {
  SLOW: { label: 'LENTA', intervalMs: 1000 },
  NORMAL: { label: 'NORMAL', intervalMs: 500 },
  FAST: { label: 'RÁPIDA', intervalMs: 250 },
  VERY_FAST: { label: 'MUITO RÁPIDA', intervalMs: 100 },
  INSTANT: { label: 'INSTANTÂNEA', intervalMs: 0 },
};

const SPEED_ORDER            = ['SLOW', 'NORMAL', 'FAST', 'VERY_FAST', 'INSTANT'];

// ---------- Temporizador injetável ----------

                            
                                                        
                                      
 

/** Temporizador real. Nos testes, injete um temporizador falso que avança o tempo à mão. */
const systemScheduler            = {
  setTimeout: (callback, ms) => globalThis.setTimeout(callback, ms),
  clearTimeout: (handle) => globalThis.clearTimeout(handle                                            ),
};

// ---------- Estado ----------

                           
                        
                                                
             
                                                     
                                                                 
                     

/** Por que a rodada está parada, do ponto de vista da interface. Decisões obrigatórias não entram aqui: vêm do engine. */
                                           

                                  
                  
                     
 

                                  
                        
                           
                                  
                 
                        
                                  
 

                                  
                  
               
                               
                                   
 

                              
                                 
                           
                
                      
 

class SessionError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'SessionError';
    this.code = code;
  }
}

                          
                              
                                                                       
                                           
               
                
                 
                    
                     
                                 
                                                                               
                                                                   
                                                                                     
                                                                                  
                                                                                  
                                                                                                
                                            
                           
                  
 

                                 
                        
                  
 

// Nunca chega perto disso: 90 minutos + acréscimos (máx. 8 + 8) + extensões de pênalti.
const MAX_STEPS = 1000;

function createSession(options                 = {})          {
  const scheduler = options.scheduler ?? systemScheduler;
  let speed          = options.speed ?? 'NORMAL';
  let round                    = null;
  let controlledClubId                = null;
  let playing = false;
  const pauses = new Set             ();
  let timer          = null;
  let commandSeq = 0;
  let disposed = false;
  const listeners = new Set                                     ();

  // ----- leitura -----

  function pendingDecision()                         {
    if (!round) return null;
    const match = awaitingMatch(round);
    return match && match.decision ? { matchId: match.matchId, decision: match.decision } : null;
  }

  function statusOf()                {
    if (!round) return 'IDLE';
    if (isRoundFinished(round)) return 'ROUND_FINISHED';
    if (awaitingMatch(round)) return 'AWAITING_DECISION';
    if (pauses.size > 0) return 'PAUSED';
    return playing ? 'PLAYING' : 'READY';
  }

  function snapshot()                  {
    return { status: statusOf(), round, controlledClubId, speed, pauses: [...pauses], pending: pendingDecision() };
  }

  function emit()       {
    if (disposed) return;
    const snap = snapshot();
    for (const listener of [...listeners]) listener(snap);
  }

  // ----- o laço de avanço: a única coisa que a velocidade controla -----

  function canAdvance()          {
    return !disposed && round !== null && playing && pauses.size === 0 && !isRoundFinished(round) && !awaitingMatch(round);
  }

  function cancelTimer()       {
    if (timer !== null) {
      scheduler.clearTimeout(timer);
      timer = null;
    }
  }

  function tick()       {
    timer = null;
    if (!canAdvance()) return;
    round = stepRound(round              );
    emit();
    scheduleNext();
  }

  /** INSTANTÂNEA: sem espera. Avança até a próxima decisão, pausa ou o fim, e avisa uma única vez. */
  function runWithoutWaiting()       {
    let stepped = 0;
    while (canAdvance()) {
      if (++stepped > MAX_STEPS) throw new SessionError('RUNAWAY', 'a rodada não terminou');
      round = stepRound(round              );
    }
    if (stepped > 0) emit();
  }

  function scheduleNext()       {
    cancelTimer();
    if (!canAdvance()) return;
    if (SPEEDS[speed].intervalMs === 0) runWithoutWaiting();

  // ----- comandos -----

  function nextCommandId(matchId        , override         )         {

  }

  function requireRound()             {
    if (!round) throw new SessionError('NO_ROUND', 'não há rodada em andamento');
    return round;
  }

  function controlledMatchId()         {
    const r = requireRound();
    if (!controlledClubId) throw new SessionError('NO_CONTROLLED_CLUB', 'não há clube controlado nesta rodada');
    const match = r.matches.find((m) => m.home.clubId === controlledClubId || m.away.clubId === controlledClubId);
    if (!match) throw new SessionError('UNKNOWN_CLUB', `o clube controlado não joga esta rodada: ${controlledClubId}`);
    return match.matchId;

  function dispatch(command         )                {
    const r = requireRound();
    const match = r.matches.find((m) => m.home.clubId === command.clubId || m.away.clubId === command.clubId);
    if (!match) throw new SessionError('UNKNOWN_CLUB', `o clube ${command.clubId} não joga esta rodada`);
    const applied = applyRoundCommand(r, match.matchId, command);
    round = applied.round;
    emit();
    scheduleNext(); // se a decisão foi resolvida e a rodada estava em andamento, volta a andar
    return applied.result;
  }

  function pendingOfType(...types                    )                  {
    const pending = pendingDecision();
    if (!pending) throw new SessionError('NO_DECISION', 'não há decisão pendente');
    if (!types.includes(pending.decision.type)) {
      throw new SessionError('WRONG_DECISION', `a decisão pendente é ${pending.decision.type}`);
    }
    return pending;
  }

  return {
    getState: snapshot,

    subscribe(listener) {
      listeners.add(listener);
      return () => {
        listeners.delete(listener);
      };
    },

    startRound(input) {
      if (round && !isRoundFinished(round)) throw new SessionError('ROUND_IN_PROGRESS', 'a rodada anterior ainda não terminou');
      cancelTimer();
      controlledClubId = input.controlledClubId ?? null;
      round = createRound(input.roundId, input.seed, input.fixtures, controlledClubId);
      playing = false;
      pauses.clear();
      commandSeq = 0;
      emit();
    },

    play() {
      requireRound();
      playing = true;
      emit();
      scheduleNext();
    },

    pause() {
      pauses.add('USER');
      cancelTimer();
      emit();
    },

    resume() {
      pauses.delete('USER');
      emit();
      scheduleNext();
    },

    openClubs() {
      pauses.add('CLUBS');
      cancelTimer();
      emit();
    },

    closeClubs() {
      pauses.delete('CLUBS');
      emit();
      scheduleNext();
    },

    setSpeed(next) {
      if (!(next in SPEEDS)) throw new SessionError('INVALID_SPEED', `velocidade desconhecida: ${String(next)}`);
      speed = next;
      emit();
      scheduleNext(); // reprograma com o novo intervalo; nada do jogo muda
    },

    openTeamAdjustment(opts) {
      const matchId = controlledMatchId();
      return dispatch({ type: 'OPEN_TEAM_ADJUSTMENT', commandId: nextCommandId(matchId, opts?.commandId), clubId: controlledClubId           });
    },

    choosePenaltyTaker(playerId, opts) {
      const { matchId, decision } = pendingOfType('PENALTY_TAKER');

        type: 'CHOOSE_PENALTY_TAKER',
        commandId: nextCommandId(matchId, opts?.commandId),
        clubId: decision.clubId,
        decisionId: decision.id,
        playerId,
      });

// Utilitários mínimos de DOM (sem framework: o ambiente de build não tem npm). Nenhuma regra de futebol mora aqui.

                                                                                
                                                   

/** Cria um elemento. Propriedades: class, on<Evento>, data-*, aria-*, disabled/checked/value e demais atributos. */
function h(tag        , props        , ...children         )              {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') el.className = String(value);
    else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2).toLowerCase(), value                 );
    else if (key === 'value') (el                    ).value = String(value);
    else if (value === true) el.setAttribute(key, '');
    else el.setAttribute(key, String(value));
  }
  append(el, children);
  return el;
}

function append(parent      , children         )       {
  for (const c of children) {
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) append(parent, c);
    else parent.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
}

/** Troca o conteúdo de root, preservando a rolagem dos elementos marcados com data-keep="nome". */
function render(root             , ...children         )       {
  const kept = new Map                ();
  root.querySelectorAll             ('[data-keep]').forEach((e) => kept.set(e.dataset.keep          , e.scrollTop));
  root.replaceChildren();
  append(root, children);
  root.querySelectorAll             ('[data-keep]').forEach((e) => {
    const top = kept.get(e.dataset.keep          );
    if (top !== undefined) e.scrollTop = top;
  });
}

__exports["h"] = h;
__exports["render"] = render;
};

// Textos e formatos em português do Brasil. Os identificadores do código ficam em inglês; a interface mostra estes rótulos.

function money(n        )         {
  const sign = n < 0 ? '−' : '';

  if (v >= 1_000_000) return `${sign}R$ ${(v / 1_000_000).toFixed(v >= 10_000_000 ? 1 : 2).replace('.', ',')} mi`;
  if (v >= 10_000) return `${sign}R$ ${Math.round(v / 1000)} mil`;

/** Opções da decisão de goleiro, ou null se a decisão não é de goleiro (ou é lesão com goleiro reserva no banco). */
function goalkeeperOptions(team           , decision          , maxSubs = DEFAULT_CONFIG.maxSubs)                           {
  if (decision.type !== 'INJURY_SUBSTITUTION' && decision.type !== 'RED_CARD_ADJUSTMENT') return null;
  const vacated = decision.playerId ? team.vacated[decision.playerId] : undefined;
  if (!vacated || vacated.sector !== 'GK' || team.onField.some((s) => s.sector === 'GK')) return null;
  const canSub = team.subsUsed < maxSubs && team.bench.length > 0;
  const reserveGks = canSub ? team.bench.filter((id) => team.players[id].position === 'GK') : [];

  const base = { vacated, reserveGks, bench: canSub ? [...team.bench] : [], outfield };
  if (decision.type === 'RED_CARD_ADJUSTMENT') return { ...base, mode: reserveGks.length > 0 ? 'RESERVE_GK' : 'OUTFIELD_TO_GOAL' };

/** Escolha pré-preenchida = a sugestão do jogo (mesma política da CPU). */

  const choice                   = { reserveIn: null, out: null, toGoal: null };

    const { reserveIn, out } = choice;
