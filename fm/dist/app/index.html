__defs["engine/season/promotion.ts"] = function (__exports, __req) {
                                                            
                                                  

// Promoção e rebaixamento (seção 17). Função pura: recebe as classificações finais e as regras,
// devolve as divisões da próxima temporada. Nada aqui conhece um campeonato específico:
// quantidade e destino de cada movimento vêm das regras.

class PromotionError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'PromotionError';
    this.code = code;
  }
}

                           
                
                                                               
 

                                
                                                                           
                      
                                                       
                       
 

/** Uma regra por divisão, indexada pelo id da divisão. */
                                                           

                                 
             
               
                            
                                                                                 
 

                                
                                       
 

                           
                 
                         
                       
                                 
                                                    
                    
 

                                  
                                                              
                                                                           
                        
 

/**
 * Regras usuais em escada: cada divisão promove `count` para a de cima e rebaixa `count` para a de baixo.
 * A primeira divisão não promove e a última não rebaixa.
 */
function standardRules(divisions                                          , count = 4)                 {
  const ordered = [...divisions].sort((a, b) => a.level - b.level);
  const rules                 = {};
  ordered.forEach((d, i) => {
    const above = ordered[i - 1];
    const below = ordered[i + 1];
    rules[d.id] = {
      promotion: above ? { count, destinationId: above.id } : { count: 0, destinationId: null },
      relegation: below ? { count, destinationId: below.id } : { count: 0, destinationId: null },
    };
  });
  return rules;
}

function validate(season               , rules                )       {
  const ids = new Set(season.divisions.map((d) => d.id));
  if (ids.size !== season.divisions.length) throw new PromotionError('DUPLICATE_DIVISION', 'há divisões com o mesmo id');
  for (const id of Object.keys(rules)) {
    if (!ids.has(id)) throw new PromotionError('UNKNOWN_DIVISION', `regra para uma divisão inexistente: ${id}`);
  }
  const seen = new Set        ();
  for (const d of season.divisions) {
    const rule = rules[d.id];
    if (!rule) throw new PromotionError('MISSING_RULE', `falta a regra da divisão ${d.id}`);
    for (const [name, move] of [['promoção', rule.promotion], ['rebaixamento', rule.relegation]]         ) {
      if (!Number.isInteger(move.count) || move.count < 0) throw new PromotionError('INVALID_COUNT', `${name} em ${d.id}: quantidade inválida`);
      if (move.count > 0) {
        if (move.destinationId === null || !ids.has(move.destinationId)) {
          throw new PromotionError('INVALID_DESTINATION', `${name} em ${d.id}: destino inexistente`);
        }
        if (move.destinationId === d.id) throw new PromotionError('INVALID_DESTINATION', `${name} em ${d.id}: o destino é a própria divisão`);
      }
    }
    if (rule.promotion.count + rule.relegation.count > d.standings.length) {
      throw new PromotionError('TOO_MANY_MOVES', `${d.id}: promoção + rebaixamento excede o número de clubes`);
    }
    for (const row of d.standings) {
      if (seen.has(row.clubId)) throw new PromotionError('DUPLICATE_CLUB', `clube repetido: ${row.clubId}`);
      seen.add(row.clubId);
    }
  }
}

/**
 * Produz as divisões da próxima temporada. Em cada divisão, primeiro ficam os clubes que permaneceram
 * (na ordem da tabela) e depois os que chegaram (vindos de cima e de baixo, na ordem dos movimentos).
 * O tamanho de cada divisão se mantém: o que sai de uma precisa entrar em outra, senão as regras são recusadas.
 */
function applyPromotionRelegation(season               , rules                )                  {
  validate(season, rules);

  const movements             = [];
  const champions                         = {};
  const moved = new Set        ();

  for (const d of season.divisions) {
    const rule = rules[d.id];
    const total = d.standings.length;
    if (total > 0) champions[d.id] = d.standings[0].clubId;
    if (rule.promotion.count > 0) {
      d.standings.slice(0, rule.promotion.count).forEach((row, i) => {
        movements.push({
          clubId: row.clubId,
          fromDivisionId: d.id,
          toDivisionId: rule.promotion.destinationId          ,
          kind: 'PROMOTED',
          position: i + 1,
          champion: i === 0,
        });
        moved.add(row.clubId);
      });
    }
    if (rule.relegation.count > 0) {
      const first = total - rule.relegation.count;
      d.standings.slice(first).forEach((row, i) => {
        movements.push({
          clubId: row.clubId,
          fromDivisionId: d.id,
          toDivisionId: rule.relegation.destinationId          ,
          kind: 'RELEGATED',
          position: first + i + 1,
          champion: false,
        });
        moved.add(row.clubId);
      });
    }
  }

  for (const d of season.divisions) {
    const out = movements.filter((m) => m.fromDivisionId === d.id).length;
    const incoming = movements.filter((m) => m.toDivisionId === d.id).length;
    if (out !== incoming) {
      throw new PromotionError('UNBALANCED', `${d.id}: saem ${out} clubes e entram ${incoming}; as regras alterariam o tamanho da divisão`);
    }
  }

  const divisions             = season.divisions.map((d) => ({
    id: d.id,
    name: d.name,
    level: d.level,
    clubIds: [
      ...d.standings.filter((row) => !moved.has(row.clubId)).map((row) => row.clubId),
      ...movements.filter((m) => m.toDivisionId === d.id).map((m) => m.clubId),
    ],
  }));

  return { divisions, champions, movements };
}

  const clubs = { ...world.clubs };
  for (const d of divisions) {
    for (const id of d.clubIds) {
      const club = clubs[id];
      if (!club) throw new PromotionError('UNKNOWN_CLUB', `clube inexistente no mundo: ${id}`);
      clubs[id] = { ...club, divisionId: d.id };
    }
  }
  return { ...world, divisions: divisions.map((d) => ({ ...d, clubIds: [...d.clubIds] })), clubs };
}

__exports["standardRules"] = standardRules;
__exports["applyPromotionRelegation"] = applyPromotionRelegation;
__exports["withDivisions"] = withDivisions;
};

// Universo fictício (seção 4 da especificação original): 4 divisões × 20 clubes, sem nenhum dado real.
// Tudo sai de uma seed: a mesma seed gera exatamente o mesmo mundo.

                           
             
               
                
                    
 

                        
               
                        
                              
                                  
 

                           
                                                                          
                             
                               
                          
                         
 

const PROFILES                    = [
  { strength: [30, 45], capacity: [30000, 60000], reputation: [60, 90], money: [8_000_000, 20_000_000], salaryPerPoint: 900 },
  { strength: [22, 38], capacity: [15000, 35000], reputation: [40, 70], money: [3_000_000, 8_000_000], salaryPerPoint: 400 },
  { strength: [15, 30], capacity: [8000, 20000], reputation: [25, 50], money: [1_000_000, 3_000_000], salaryPerPoint: 150 },
  { strength: [8, 24], capacity: [3000, 10000], reputation: [10, 35], money: [300_000, 1_000_000], salaryPerPoint: 60 },
];

// Nomes inventados: prefixo + palavra, evitando combinações que coincidam com clubes reais conhecidos.
const PLACE_PREFIX = ['Vila', 'Porto', 'Campo', 'Serra', 'Barra', 'Lagoa', 'Monte', 'Ponte', 'Passo', 'Vale'];
const PLACE_WORD = [
  'Aurora', 'Anil', 'Brava', 'Cerejeira', 'Esmeralda', 'Figueira', 'Garça', 'Jacarandá', 'Lírio', 'Marola',
  'Neblina', 'Orvalho', 'Quaresma', 'Ribeira', 'Seriema', 'Taboca', 'Urutau', 'Ventania', 'Maresia', 'Pitanga',
  'Juriti', 'Sabiá', 'Araçá', 'Ipê', 'Carnaúba', 'Buriti',
];
const CLUB_TYPE = ['Esporte Clube', 'Futebol Clube', 'Atlético', 'Sport Club', 'Recreativo', 'União', 'Associação', 'Clube'];
const FIRST_NAMES = [
  'Adriano', 'Bruno', 'Caio', 'Diego', 'Everton', 'Fábio', 'Gustavo', 'Heitor', 'Igor', 'João', 'Kaio', 'Leandro',
  'Marcos', 'Nícolas', 'Otávio', 'Paulo', 'Rafael', 'Samuel', 'Thiago', 'Ulisses', 'Vinícius', 'Wesley', 'Yuri',
  'André', 'Breno', 'Cauã', 'Davi', 'Elias', 'Felipe', 'Gabriel', 'Henrique', 'Luan', 'Mateus', 'Renan', 'Wallace',
];
const LAST_NAMES = [
  'Almeida', 'Barbosa', 'Cardoso', 'Duarte', 'Esteves', 'Farias', 'Gomes', 'Honório', 'Ientes', 'Jardim', 'Lacerda',
  'Macedo', 'Nogueira', 'Oliveira', 'Prates', 'Queiroz', 'Rezende', 'Siqueira', 'Teixeira', 'Uchoa', 'Valadares',
  'Xavier', 'Zanetti', 'Bragança', 'Coutinho', 'Freitas', 'Guedes', 'Lopes', 'Moraes', 'Pacheco', 'Rocha', 'Toledo',
];
const COLORS = ['#1B5E20', '#B71C1C', '#0D47A1', '#F9A825', '#212121', '#FAFAFA', '#4A148C', '#E65100', '#006064', '#880E4F'];
const FORMATIONS              = [
  { DEF: 4, MID: 4, ATT: 2 },
  { DEF: 4, MID: 3, ATT: 3 },
  { DEF: 3, MID: 5, ATT: 2 },
  { DEF: 4, MID: 5, ATT: 1 },
  { DEF: 5, MID: 3, ATT: 2 },
];
const SQUAD_SHAPE                           = { GK: 3, DEF: 8, MID: 8, ATT: 5 };
const TEMPERAMENTS                = ['CALM', 'NORMAL', 'NORMAL', 'NORMAL', 'EXPLOSIVE'];

function between(rng     , [min, max]                  )         {
  return rng.int(min, max);
}

function clampStrength(n        )         {
  return Math.max(1, Math.min(50, Math.round(n)));
}

function generateWorld(seed        , clubsPerDivision = 20)        {
  const rng = createRng(deriveSeed(seed, 'world'));
  const clubs                       = {};
  const players                         = {};
  const divisions             = [];

  // Cidades únicas para todos os clubes.
  const places           = [];
  for (const p of PLACE_PREFIX) for (const w of PLACE_WORD) places.push(`${p} ${w}`);
  for (let i = places.length - 1; i > 0; i--) {
    const j = rng.int(0, i);
    [places[i], places[j]] = [places[j], places[i]];
  }

  let clubSeq = 0;
  let playerSeq = 0;
  const usedNames = new Set        ();

  PROFILES.forEach((profile, level) => {
    const division           = { id: `D${level + 1}`, name: `${level + 1}ª Divisão`, level: level + 1, clubIds: [] };
    for (let c = 0; c < clubsPerDivision; c++) {
      clubSeq++;
      const id = `clb-${String(clubSeq).padStart(3, '0')}`;
      const city = places[clubSeq - 1];
      const type = rng.pick(CLUB_TYPE);
      const name = rng.next() < 0.5 ? `${type} ${city}` : `${city} ${type}`;
      const quality = between(rng, profile.strength);
      const capacity = Math.round(between(rng, profile.capacity) / 500) * 500;
      const primary = rng.pick(COLORS);
      const secondary = rng.pick(COLORS.filter((c2) => c2 !== primary));

      const squad           = [];
      for (const position of ['GK', 'DEF', 'MID', 'ATT']              ) {
        for (let k = 0; k < SQUAD_SHAPE[position]; k++) {
          playerSeq++;
          const pid = `ply-${String(playerSeq).padStart(4, '0')}`;
          // Nome + sobrenome; se repetir, ganha um segundo sobrenome. Tentativas limitadas: nunca trava.
          let pname = `${rng.pick(FIRST_NAMES)} ${rng.pick(LAST_NAMES)}`;
          for (let tries = 0; usedNames.has(pname) && tries < 50; tries++) {
            pname = `${rng.pick(FIRST_NAMES)} ${rng.pick(LAST_NAMES)} ${rng.pick(LAST_NAMES)}`;
          }
          if (usedNames.has(pname)) pname = `${pname} ${playerSeq}`;
          usedNames.add(pname);
          // Força em torno da qualidade do clube: soma de dois sorteios dá uma curva mais "normal".
          const strength = clampStrength(quality + (rng.next() + rng.next() - 1) * 8);

            id: pid,
            name: pname,
            age: rng.int(17, 35),
            nationality: rng.next() < 0.9 ? 'Brasil' : rng.pick(['Argentina', 'Uruguai', 'Paraguai', 'Colômbia']),
            position,
            strength,
            temperament: rng.pick(TEMPERAMENTS),
            salary: Math.round((strength * profile.salaryPerPoint) / 100) * 100,
            marketValue: Math.round((strength * strength * profile.salaryPerPoint * 4) / 1000) * 1000,
            contract: { endSeason: 2026 + rng.int(0, 3) },
            clubId: id,
            condition: { injuryRounds: 0, suspensionRounds: 0, yellowCardsAccumulated: 0 },
          };
          squad.push(pid);
        }
      }

      const style        = 'BALANCED';
      const behavior           = rng.next() < 0.8 ? 'NORMAL' : rng.pick(['AGGRESSIVE', 'REACTIVE']              );
      clubs[id] = {
        id,
        name,
        // Sigla: 1ª letra do prefixo + 2 primeiras da palavra (ex.: Vila Aurora → VAU).
        shortName: (city.split(' ')[0].slice(0, 1) + city.split(' ')[1].slice(0, 2))
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toUpperCase(),
        primaryColor: primary,
        secondaryColor: secondary,
        country: 'Brasil',
        city,
        divisionId: division.id,
        stadium: { name: `Estádio ${city}`, capacity, maxCapacity: Math.round((capacity * 1.5) / 500) * 500 },
        money: Math.round(between(rng, profile.money) / 1000) * 1000,
        reputation: between(rng, profile.reputation),
        squad,
        defaultTactics: { formation: rng.pick(FORMATIONS), style, behavior },
        penaltyTakerId: null,
      };

    }
    divisions.push(division);
  });

}

// Carreira (camada game/): junta os módulos que já existem (calendário, classificação, promoção, finanças, mundo, escalação)
// e faz o que faltava entre uma rodada e outra: aplicar lesões e suspensões, fechar as finanças UMA vez, virar a temporada.
// Funções puras: cada uma devolve uma carreira nova e nunca altera a recebida. Nada aqui conhece telas.

const CAREER_VERSION = 1;
const ROUNDS_PER_SEASON = 38;
const FIRST_SEASON = 2026;

const YELLOW_LIMIT = 3;

  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'CareerError';
    this.code = code;
  }

// ---------- Criação ----------

/** Divisão em que toda carreira nova começa (especificação: "começar carreira na 4ª divisão por padrão"). */

/**

  const rng = createRng(deriveSeed(seed, 'ofertas'));

  }
  return picks;

  for (const d of world.divisions) schedule[d.id] = doubleRoundRobin(d.clubIds, deriveSeed(seed, `S${season}:${d.id}`));
  return schedule;

function createCareer(input                                                                             )              {

  if (name.length === 0) throw new CareerError('COACH_NAME', 'o treinador precisa de um nome');
  const world = generateWorld(input.seed);
  if (input.clubId !== null && !world.clubs[input.clubId]) throw new CareerError('UNKNOWN_CLUB', `clube inexistente: ${input.clubId}`);

    version: CAREER_VERSION,
    seed: input.seed,
    season,
    coach: { name },
    userClubId: input.clubId,
    world,
    schedule: buildSchedule(world, input.seed, season),
    roundNumber: 1,
    results: [],
    userLineup: null,
    userLedger: [],
    pendingPromotion: null,
    history: [],
  };

function isSeasonOver(c             )          {
  return c.roundNumber > ROUNDS_PER_SEASON;

function hasClub(c             )                                            {
  return c.userClubId !== null;
}

function userClub(c             )       {

  return c.world.clubs[c.userClubId];
}

/** Contexto das consultas (CLUBES, classificação): a mesma estrutura que game/queries.ts já espera. */

  return {
    world: c.world,
    controlledClubId: c.userClubId,
    roundNumber: Math.min(c.roundNumber, ROUNDS_PER_SEASON),
    round,
    schedule: c.schedule,
    results: c.results,
    tiebreakSeed: undefined,
  };
}

/** Classificação atual da divisão (a mesma regra da tabela final, que decide acesso e rebaixamento). */

  return getStandings(clubsContext(c), divisionId);
}

// ---------- Escalação do jogador ----------

                                 
                 
                                                                                                   
                    
                   
 

/** A escalação que vai a campo: a do jogador, se ainda for válida; senão o melhor time disponível, mantendo formação e tática. */
function resolveUserLineup(c             )                 {
  const club = userClub(c);
  const chosen = c.userLineup;
  if (chosen) {
    const errors = validateLineup(chosen, club, c.world.players);
    if (errors.length === 0) return { lineup: chosen, adjusted: false, errors: [] };
    const auto = autoLineup(club, c.world.players, { formation: formationOf(chosen.starters), style: chosen.style, behavior: chosen.behavior });

  return { lineup: autoLineup(club, c.world.players, club.defaultTactics), adjusted: false, errors: [] };
}

/** Grava a escalação escolhida. Recusa escalação inválida (o motor nunca recebe uma). */
function withUserLineup(c             , lineup        )              {
  const errors = validateLineup(lineup, userClub(c), c.world.players);
  if (errors.length > 0) throw new CareerError('INVALID_LINEUP', errors.join('; '));
  return { ...c, userLineup: lineup };

const pad = (n        ) => String(n).padStart(2, '0');

/** Id estável de partida (seção 16): "T2026-D2-R05-P07". Mudar o formato muda as seeds. */
function matchIdFor(season        , level        , round        , pos        )         {

function scheduledFor(c             , round        ) {

    roundNumber: c.roundNumber,
    roundId,
    seed: deriveSeed(c.seed, roundId),
    fixtures,
    controlledClubId: c.userClubId,

function applyConditions(players                        , results                        )                         {
  const next                         = { ...players };
  const patch = (id        , fn                                                 ) => {
    const p = next[id];
    if (p) next[id] = { ...p, condition: fn(p.condition) };
  };
  for (const id of Object.keys(next)) {
    const c = next[id].condition;
    if (c.injuryRounds > 0 || c.suspensionRounds > 0) {
      patch(id, (x) => ({ ...x, injuryRounds: Math.max(0, x.injuryRounds - 1), suspensionRounds: Math.max(0, x.suspensionRounds - 1) }));
    }
  }
  for (const r of results) {
    for (const i of r.injuries) patch(i.playerId, (x) => ({ ...x, injuryRounds: Math.max(x.injuryRounds, i.rounds) }));
    for (const y of r.yellowCards) {
      patch(y.playerId, (x) => {
        const total = x.yellowCardsAccumulated + 1;
        return total >= YELLOW_LIMIT ? { ...x, yellowCardsAccumulated: 0, suspensionRounds: Math.max(x.suspensionRounds, 1) } : { ...x, yellowCardsAccumulated: total };
      });
    }
    for (const red of r.redCards) patch(red.playerId, (x) => ({ ...x, suspensionRounds: Math.max(x.suspensionRounds, 1) }));
  }
  return next;
}

                               
                      
                                                                             
                                  
                       
 

/** Fase de aplicação (seção 16): só depois que as 40 partidas terminam. Aplique UMA vez por rodada. */
function finishRound(c             , results                        )               {
  if (isSeasonOver(c)) throw new CareerError('SEASON_OVER', 'a temporada já terminou');
  const expected = scheduledFor(c, c.roundNumber).map((m) => m.matchId).sort();
  const got = results.map((r) => r.matchId).sort();
  if (expected.length !== got.length || expected.some((id, i) => id !== got[i])) {
    throw new CareerError('ROUND_MISMATCH', `os resultados não são os da rodada ${c.roundNumber}`);

    ...c,
    world: { ...c.world, clubs: settled.clubs, players },
    results: [...c.results, ...played],
    userLedger: mine ? [...c.userLedger, mine] : c.userLedger,
    roundNumber: c.roundNumber + 1,
  };
  const seasonEnded = isSeasonOver(career);
  if (seasonEnded) career = closeSeason(career);
  return { career, ledger: mine, seasonEnded };
}

function closeSeason(c             )              {
  const ctx = clubsContext(c);
  const promotion = applyPromotionRelegation(
    { divisions: c.world.divisions.map((d) => ({ id: d.id, name: d.name, level: d.level, standings: getStandings(ctx, d.id) })) },
    standardRules(c.world.divisions),
  );
  const userDiv = c.userClubId === null ? null : userClub(c).divisionId;
  const table = userDiv === null ? [] : getStandings(ctx, userDiv);
  const report               = {
    season: c.season,
    userClubId: c.userClubId,
    userDivisionId: userDiv,
    userPosition: table.findIndex((row) => row.clubId === c.userClubId) + 1,
    champions: promotion.champions,
    movements: promotion.movements,
    userMovement: c.userClubId === null ? null : promotion.movements.find((m) => m.clubId === c.userClubId) ?? null,

/** Nova temporada: aplica acesso e rebaixamento, gera o calendário e zera resultados, extrato e cartões acumulados. */
function startNextSeason(c             )              {

  return JSON.stringify(c);
}

function deserializeCareer(json        )              {
  let data         ;
  try {
    data = JSON.parse(json);

}

  code        ;
  constructor(code        , message        ) {

const POSITION_ORDER                           = { GK: 0, DEF: 1, MID: 2, ATT: 3 };

function playerOf(ctx              , id        )         {
  const p = ctx.world.players[id];
  if (!p) throw new QueryError('UNKNOWN_PLAYER', `jogador inexistente no mundo: ${id}`);
  return p;
}

function clubOf(ctx              , id        )       {
  const c = ctx.world.clubs[id];
  if (!c) throw new QueryError('UNKNOWN_CLUB', `clube inexistente: ${id}`);
  return c;
}

function playerView(p        )             {
  return {
    id: p.id,
    name: p.name,
    age: p.age,
    nationality: p.nationality,
    position: p.position,
    strength: p.strength,
    marketValue: p.marketValue,
    injuredRounds: p.condition.injuryRounds,
    suspendedRounds: p.condition.suspensionRounds,
  };
}

function byPositionThenStrength(a            , b            )         {
  return (
    POSITION_ORDER[a.position] - POSITION_ORDER[b.position] || b.strength - a.strength || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)
  );
}

function slotView(ctx              , slot            )                   {
  return { ...playerView(playerOf(ctx, slot.playerId)), sector: slot.sector, x: slot.x, y: slot.y };
}

/** Força geral do melhor time disponível, ou null se não há 11 disponíveis. */
function bestStrength(ctx              , club      )                {
  try {
    const lineup = autoLineup(club, ctx.world.players, {}, DEFAULT_CONFIG);
    return overallStrength(lineup.starters, ctx.world.players, DEFAULT_CONFIG);
  } catch {
    return null;
  }
}

function liveMatchOf(ctx              , clubId        )                    {
  if (!ctx.round) return null;
  return ctx.round.matches.find((m) => m.home.clubId === clubId || m.away.clubId === clubId) ?? null;
}

/**
 * Minuto a mostrar. No fim do jogo (ou com uma decisão pendente depois do último minuto de acréscimo) o relógio interno
 * fica um minuto além do último jogado; a consulta mostra o último minuto realmente jogado.
 */
function shownClock(m            )        {
  const pastEnd =
    m.status === 'FINISHED' ||
    (m.clock.half === 2 && m.clock.minute === 90 && m.stoppage.second !== null && m.clock.added > m.stoppage.second && m.pendingPenalty === null);
  return pastEnd ? m.events[m.events.length - 1].clock : m.clock;
}

function roundInProgress(ctx              )          {
  return ctx.round !== null && ctx.round.matches.some((m) => m.status !== 'FINISHED');
}

function liveLineup(ctx              , team           )             {
  const starters = team.onField.map((slot) => slotView(ctx, slot));
  const view = (ids                   ) => ids.map((id) => playerView(playerOf(ctx, id))).sort(byPositionThenStrength);
  const formation = formationOf(team.onField);
  const rated = Object.fromEntries(team.onField.map((s) => [s.playerId, team.players[s.playerId]]));
  return {
    source: 'LIVE',
    formation,
    formationLabel: formationLabel(formation),
    style: team.style,
    behavior: team.behavior,
    strength: overallStrength(team.onField, rated, DEFAULT_CONFIG),
    starters,
    bench: view(team.bench),
    sentOff: view(team.sentOff),
    injured: view(team.injured),
    substitutionsUsed: team.subsUsed,
  };
}

function autoLineupView(ctx              , club      )                    {
  try {
    const lineup = autoLineup(club, ctx.world.players, {}, DEFAULT_CONFIG);
    const formation = formationOf(lineup.starters);
    return {
      source: 'AUTO',
      formation,
      formationLabel: formationLabel(formation),
      style: lineup.style,
      behavior: lineup.behavior,
      strength: overallStrength(lineup.starters, ctx.world.players, DEFAULT_CONFIG),
      starters: lineup.starters.map((slot) => slotView(ctx, slot)),
      bench: lineup.bench.map((id) => playerView(playerOf(ctx, id))).sort(byPositionThenStrength),
      sentOff: [],
      injured: [],
      substitutionsUsed: 0,
    };
  } catch {
    return null;
  }
}

function divisionResults(ctx              , clubIds                   )                {
  const ids = new Set(clubIds);
  return ctx.results.filter((r) => ids.has(r.homeClubId) && ids.has(r.awayClubId));
}

function tableFor(ctx              , divisionId        )                {
  const division = ctx.world.divisions.find((d) => d.id === divisionId);
  if (!division) throw new QueryError('UNKNOWN_DIVISION', `divisão inexistente: ${divisionId}`);
  const results = divisionResults(ctx, division.clubIds).map((r) => ({
    homeClubId: r.homeClubId,
    awayClubId: r.awayClubId,
    homeGoals: r.homeGoals,
    awayGoals: r.awayGoals,
  }));
  return computeStandings(division.clubIds, results, ctx.tiebreakSeed ?? `classificacao:${divisionId}`);
}

function balanceOf(ctx              , club      )              {
  if (club.id === ctx.controlledClubId) return { kind: 'EXACT', amount: club.money };
  const all = Object.values(ctx.world.clubs);
  const below = all.filter((c) => c.money < club.money).length;
  const band              = below * 3 < all.length ? 'LOW' : below * 3 < 2 * all.length ? 'MEDIUM' : 'HIGH';
  return { kind: 'BAND', band };
}

function recentResultsOf(ctx              , clubId        )               {
  const limit = ctx.recentResults ?? 5;
  return ctx.results
    .filter((r) => r.homeClubId === clubId || r.awayClubId === clubId)
    .sort((a, b) => b.round - a.round)
    .slice(0, limit)
    .map((r) => {
      const home = r.homeClubId === clubId;
      const goalsFor = home ? r.homeGoals : r.awayGoals;
      const goalsAgainst = home ? r.awayGoals : r.homeGoals;
      const opponentId = home ? r.awayClubId : r.homeClubId;
      return {
        round: r.round,
        opponentId,
        opponentName: clubOf(ctx, opponentId).name,
        home,
        goalsFor,
        goalsAgainst,
        outcome: goalsFor > goalsAgainst ? 'W' : goalsFor < goalsAgainst ? 'L' : 'D',
      };
    });
}

function nextMatchOf(ctx              , club      )                       {
  const rounds = ctx.schedule[club.divisionId];
  if (!rounds) return null;
  // Com uma rodada em andamento, o próximo jogo é o da rodada seguinte; sem ela, o da rodada indicada.
  const first = roundInProgress(ctx) ? ctx.roundNumber : ctx.roundNumber - 1;
  for (let i = Math.max(0, first); i < rounds.length; i++) {
    const m = rounds[i].find((x) => x.home === club.id || x.away === club.id);
    if (!m) continue;
    const home = m.home === club.id;
    const opponent = clubOf(ctx, home ? m.away : m.home);
    return { round: i + 1, home, opponentId: opponent.id, opponentName: opponent.name, opponentStrength: bestStrength(ctx, opponent) };
  }
  return null;
}

// ---------- API pública ----------

/** Visão pública de um clube. Igual para o clube controlado e para qualquer adversário. */
function getClubView(ctx              , clubId        )           {
  const club = clubOf(ctx, clubId);
  const division = ctx.world.divisions.find((d) => d.id === club.divisionId) ?? null;

  const match = liveMatchOf(ctx, clubId);
  const team = match ? (match.home.clubId === clubId ? match.home : match.away) : null;
  let live                       = null;
  if (match && team) {
    const home = match.home.clubId === clubId;
    const opponent = home ? match.away : match.home;
    const shown = shownClock(match);
    live = {
      matchId: match.matchId,
      status: match.status,
      minute: clockLabel(shown),
      half: shown.half,
      home,
      opponentId: opponent.clubId,
      opponentName: opponent.name,
      score: { for: home ? match.score.home : match.score.away, against: home ? match.score.away : match.score.home },
      attendance: match.attendance,
    };
  }

  let standing                       = null;
  if (division) {
    const table = tableFor(ctx, division.id);
    const idx = table.findIndex((r) => r.clubId === clubId);
    if (idx !== -1) standing = { ...table[idx], position: idx + 1, clubsInDivision: table.length };
  }

  return {
    id: club.id,
    name: club.name,
    shortName: club.shortName,
    primaryColor: club.primaryColor,
    secondaryColor: club.secondaryColor,
    country: club.country,
    city: club.city,
    division: division ? { id: division.id, name: division.name, level: division.level } : null,
    isControlled: club.id === ctx.controlledClubId,
    reputation: club.reputation,
    strength: bestStrength(ctx, club),
    squad: club.squad.map((id) => playerView(playerOf(ctx, id))).sort(byPositionThenStrength),
    lineup: team ? liveLineup(ctx, team) : autoLineupView(ctx, club),
    live,
    form: recentResultsOf(ctx, clubId),
    standing,
    nextMatch: nextMatchOf(ctx, club),
    stadium: { name: club.stadium.name, capacity: club.stadium.capacity, maxCapacity: club.stadium.maxCapacity },
    finance: {
      payrollPerRound: payroll(club, ctx.world.players),
      estimatedAttendance: computeAttendance(club),
      balance: balanceOf(ctx, club),
    },
  };
}

/** Classificação de uma divisão (rodadas concluídas). */
function getStandings(ctx              , divisionId        )                 {
  return tableFor(ctx, divisionId).map((row, i) => {
    const club = clubOf(ctx, row.clubId);
    return { ...row, position: i + 1, clubName: club.name, isControlled: club.id === ctx.controlledClubId };
  });
}

/** Lista de todos os clubes, para o menu da área CLUBES: por divisão (do topo para baixo) e por nome. */
function listClubs(ctx              )                {
  const out                = [];
  for (const d of ctx.world.divisions) {
    for (const id of d.clubIds) {
      const club = clubOf(ctx, id);
      out.push({
        id: club.id,
        name: club.name,
        shortName: club.shortName,
        divisionId: d.id,
        divisionName: d.name,
        divisionLevel: d.level,
        strength: bestStrength(ctx, club),
        isControlled: club.id === ctx.controlledClubId,
      });
    }
  }
  return out.sort((a, b) => a.divisionLevel - b.divisionLevel || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
}

}

/** Elenco do treinador sem os jogadores já em leilão aberto (as regras de elenco mínimo valem para o pior caso). */
function withoutAuctioned(c         , m              ) {
  const club = c.world.clubs[c.userClubId];
  const out = new Set(m.market.auctions.filter((a) => a.status === 'OPEN').map((a) => a.playerId));
  return { ...club, squad: club.squad.filter((id) => !out.has(id)) };
}

// ---------- venda por leilão ----------

function openAuction(career             , playerId        , startPrice        )               {
  const c = managed(career);
  requireWindow(c);
  const p = c.world.players[playerId];
  if (!p || p.clubId !== c.userClubId) fail('Jogador não é do seu elenco.');
  const m = c.manager;
  if (m.market.loans.some((l) => l.playerId === playerId)) fail('Jogador emprestado não pode ir a leilão.');
  if (m.market.auctions.some((a) => a.playerId === playerId && a.status === 'OPEN')) fail('Esse jogador já está em leilão.');
  const outErr = squadCheckOut(c.world, withoutAuctioned(c, m), playerId);
  if (outErr) fail(outErr);
  const min = minAuctionPrice(p);
  const price = Math.round(startPrice);
  if (!(price >= min)) fail(`O lance mínimo precisa ser de pelo menos R$ ${min.toLocaleString('pt-BR')}.`);
  const seq = m.market.seq + 1;
  const abs = absRound(c.season, isSeasonOver(c) ? 39 : c.roundNumber);
  const auction = { id: `lei${seq}`, playerId, startPrice: price, bids: [], openedRound: abs, closesRound: abs, status: 'OPEN'         , winner: null };
  const mm = { ...m, market: { ...m.market, seq, auctions: [...m.market.auctions, auction] } };
  const drafts = [draft('RUMOR', `${p.name} está à venda: clubes avaliam lances`, { clubId: c.userClubId, playerId, mine: true })];
  return { career: commit(c, mm, drafts), message: `${p.name} foi a leilão. O resultado sai ${isSeasonOver(c) ? 'na virada da temporada' : 'depois da próxima rodada'}.`, kind: 'good' };
}

function withdrawAuction(career             , auctionId        )               {
  const c = ensureManager(career);
  const m = c.manager;
  const auctions = m.market.auctions.map((a) => (a.id === auctionId && a.status === 'OPEN' ? { ...a, status: 'WITHDRAWN'          } : a));
  return { career: { ...c, manager: { ...m, market: { ...m.market, auctions } } }, message: 'Leilão cancelado.', kind: 'info' };
}

// ---------- contratos ----------

function startRenewal(career             , playerId        )               {
  const c = managed(career);
  const p = c.world.players[playerId];
  if (!p || p.clubId !== c.userClubId) fail('Jogador não é do seu elenco.');
  if (c.manager.market.loans.some((l) => l.playerId === playerId)) fail('Jogador emprestado: o contrato é com o clube dono.');
  const existing = c.manager.contracts[playerId];
  if (existing && existing.status !== 'AGREED') return { career: c, message: existing.message, kind: 'info' };
  const talk = openTalk(c.seed, p);
  const m = c.manager;
  return { career: { ...c, manager: { ...m, contracts: { ...m.contracts, [playerId]: talk } } }, message: talk.message, kind: 'info' };
}

function proposeRenewal(career             , playerId        , salary        , years        )               {
  const c = managed(career);
  const p = c.world.players[playerId];
  const talk = c.manager.contracts[playerId];
  if (!p || p.clubId !== c.userClubId || !talk) fail('Abra a negociação primeiro.');
  if (!(years >= 1 && years <= 5)) fail('O contrato vai de 1 a 5 temporadas.');
  const res = talkPropose(c.seed, p, talk, Math.round(salary), Math.round(years));
  const m = c.manager;
  let world = c.world;
  const drafts          = [];
  if (res.agreed) {
    // N temporadas a partir de agora: na temporada S (ou na intertemporada depois dela), o contrato vai até S + N
    const endSeason = Math.max(p.contract.endSeason, c.season + res.agreed.years);
    world = { ...world, players: { ...world.players, [playerId]: { ...p, salary: res.agreed.salary, contract: { endSeason } } } };
    drafts.push(draft('NOTICIA', `${p.name} renova contrato`, { body: `Até ${world.players[playerId].contract.endSeason}, com salário de R$ ${res.agreed.salary.toLocaleString('pt-BR')} por rodada.`, clubId: c.userClubId, playerId, mine: true }));
  } else if (res.talk.status === 'BROKEN') {
    drafts.push(draft('RUMOR', `${p.name} não renova e deve deixar o clube`, { clubId: c.userClubId, playerId, mine: true }));
  }
  const mm = { ...m, contracts: { ...m.contracts, [playerId]: res.talk } };
  return { career: commit({ ...c, world }, mm, drafts), message: res.talk.message, kind: res.agreed ? 'good' : res.talk.status === 'BROKEN' ? 'error' : 'info' };
}

// ---------- estádio ----------

function startWork(career             , id           )               {
  const c = managed(career);
  const m = c.manager;
  const check = canStartWork(m.stadium.levels, m.stadium.works, id, c.world.clubs[c.userClubId].money);
  if (!check.ok) fail(check.reason);
  const ok = check                                       ;
  const base = isSeasonOver(c) ? absRound(c.season + 1, 0) : absRound(c.season, c.roundNumber - 1);
  const work = { upgrade: id, level: ok.level, cost: ok.cost, doneAtRound: base + ok.rounds };
  const mm = { ...m, stadium: { ...m.stadium, works: [...m.stadium.works, work] } };
  const u = upgradeInfo(id);
  const drafts = [draft('NOTICIA', `Começa a obra: ${u.label} (nível ${ok.level})`, { body: `Prazo: ${ok.rounds} rodadas. Custo: R$ ${ok.cost.toLocaleString('pt-BR')}.`, clubId: c.userClubId, mine: true })];
  return { career: commit(c, mm, drafts, [line(c.season, nowRound(c), `Obra: ${u.label} (nível ${ok.level})`, -ok.cost)], -ok.cost), message: `Obra iniciada: fica pronta em ${ok.rounds} rodadas.`, kind: 'good' };
}

// ---------- finanças ----------

function financeView(career             ) {
  const c = managed(career);
  const club = c.world.clubs[c.userClubId];
  const debt = debtOf(c.manager.finance.loans);
  const pay = payroll(club, c.world.players);
  const status = financeStatus(club.money, pay, debt);
  const level = c.world.divisions.find((d) => d.id === club.divisionId)?.level ?? 4;
  return { money: club.money, payroll: pay, debt, status, limit: creditLimit(level, club.reputation, debt, club.money) };
}

function takeBankLoan(career             , amount        , rounds        )               {
  const c = managed(career);
  const v = financeView(c);
  const q = quoteLoan(Math.round(amount), rounds, v.limit, v.status);
  if (!q.ok) fail(q.reason);
  const ok = q                                   ;
  const m = c.manager;
  const seq = m.finance.seq + 1;
  const loan = { ...ok.loan, id: `emp${seq}`, takenSeason: c.season, takenRound: nowRound(c) };
  const mm = { ...m, finance: { ...m.finance, seq, loans: [...m.finance.loans, loan] } };
  const drafts = [draft('ANALISE', `Clube toma empréstimo bancário de R$ ${loan.principal.toLocaleString('pt-BR')}`, { body: `${loan.rounds} parcelas de R$ ${loan.installment.toLocaleString('pt-BR')}.`, clubId: c.userClubId, mine: true })];
  return { career: commit(c, mm, drafts, [line(c.season, nowRound(c), 'Empréstimo bancário recebido', loan.principal)], loan.principal), message: 'Empréstimo aprovado.', kind: 'good' };
}

function payOffBankLoan(career             , loanId        )               {
  const c = managed(career);
  const m = c.manager;
  const loan = m.finance.loans.find((l) => l.id === loanId);
  if (!loan) fail('Empréstimo não encontrado.');
  const l = loan                            ;
  if (c.world.clubs[c.userClubId].money < l.remaining) fail('Caixa insuficiente para quitar.');
  const mm = { ...m, finance: { ...m.finance, loans: m.finance.loans.filter((x) => x.id !== loanId) } };
  return { career: commit(c, mm, [], [line(c.season, nowRound(c), 'Quitação de empréstimo bancário', -l.remaining)], -l.remaining), message: 'Empréstimo quitado.', kind: 'good' };
}

function chooseSponsor(career             , offerId        )               {
  const c = managed(career);
  const m = c.manager;
  if (m.finance.sponsor && m.finance.sponsor.season >= c.season && !isSeasonOver(c)) fail('O clube já tem patrocinador nesta temporada.');
  const offer = m.finance.sponsorOffers.find((o) => o.id === offerId);
  if (!offer) fail('Proposta de patrocínio não encontrada.');
  const o = offer                             ;
  const season = isSeasonOver(c) ? c.season + 1 : c.season;
  const mm = { ...m, finance: { ...m.finance, sponsor: { ...o, season, paid: 0 }, sponsorOffers: [] } };
  const drafts = [draft('NOTICIA', `${o.name} é o novo patrocinador do ${c.world.clubs[c.userClubId].name}`, { clubId: c.userClubId, mine: true })];
  return { career: commit(c, mm, drafts), message: `Contrato com ${o.name} assinado.`, kind: 'good' };
}

// ---------- emprego ----------

/** Aceita uma proposta de trabalho: o treinador troca de clube (só fora da rodada). */
function acceptJob(career             , offerId        )               {
  const c = ensureManager(career);
  const m = c.manager;
  const offer = m.jobs.offers.find((o) => o.id === offerId && o.status === 'OPEN');
  if (!offer) fail('Proposta não está mais disponível.');
  const o = offer                             ;
  const coaches = { ...m.coaches };
  const prev = c.userClubId;
  if (prev) coaches[prev] = { name: coachName(c.seed, `${prev}:${c.season}:${c.roundNumber}:saida`), since: absRound(c.season, c.roundNumber) };
  delete coaches[o.clubId];
  const next              = { ...c, userClubId: o.clubId, userLineup: null, userLedger: [] };
  const club = c.world.clubs[o.clubId];
  const level = c.world.divisions.find((d) => d.id === club.divisionId)?.level ?? 4;
  const season = isSeasonOver(c) ? c.season + 1 : c.season;
  const mm               = {
    ...m,
    coaches,
    morale: 65,
    objective: objectiveFor(next, o.clubId),
    jobs: { ...m.jobs, offers: m.jobs.offers.map((x) => (x.id === offerId ? { ...x, status: 'ACCEPTED'          } : x.status === 'OPEN' ? { ...x, status: 'REFUSED'          } : x)) },
    finance: { sponsor: null, sponsorOffers: sponsorOffers(c.seed, season, o.clubId, level, club.reputation), loans: [], ledger: m.finance.ledger, seq: m.finance.seq },
    stadium: { levels: {}, works: [] },
    market: { ...m.market, negotiations: [], auctions: m.market.auctions.map((a) => (a.status === 'OPEN' ? { ...a, status: 'WITHDRAWN'          } : a)) },
    contracts: {},
    clubsCoached: [...m.clubsCoached, [o.clubId, c.season]],
  };
  const drafts = [draft('URGENTE', `${c.coach.name} é o novo técnico do ${club.name}`, { body: mm.objective ? `Objetivo: ${mm.objective.label}.` : null, clubId: o.clubId, mine: true })];
  return { career: { ...next, manager: publish(mm, c.season, nowRound(c), drafts) }, message: `Bem-vindo ao ${club.name}!`, kind: 'good' };
}

function refuseJob(career             , offerId        )               {
  const c = ensureManager(career);
  const m = c.manager;
  const offers = m.jobs.offers.map((o) => (o.id === offerId && o.status === 'OPEN' ? { ...o, status: 'REFUSED'          } : o));
  return { career: { ...c, manager: { ...m, jobs: { ...m.jobs, offers } } }, message: 'Proposta recusada.', kind: 'info' };
}

function answerNational(career             , accept         )               {
  const c = ensureManager(career);
  const m = c.manager;
  if (m.jobs.national !== 'INVITED') fail('Não há convite da seleção.');
  const mm = { ...m, jobs: { ...m.jobs, national: accept ? ('COACH'         ) : ('DECLINED'         ) }, reputation: accept ? Math.min(100, m.reputation + 3) : m.reputation };
  const drafts = accept ? [draft('URGENTE', `${c.coach.name} aceita comandar a seleção`, { mine: true })] : [];
  return { career: { ...c, manager: publish(mm, c.season, nowRound(c), drafts) }, message: accept ? 'Você agora também é o técnico da seleção.' : 'Convite recusado.', kind: accept ? 'good' : 'info' };
}

/** Carreira nova a partir das propostas iniciais: com clube (aceitou) ou sem (AGUARDAR PROPOSTAS). */
function newManagedCareer(seed        , coachName_        , clubId               )              {
  return ensureManager(createCareer({ seed, coachName: coachName_, clubId }));
}

function isLoanedIn(c             , playerId        )          {
  return !!c.manager?.market.loans.some((l) => l.playerId === playerId && l.toClubId === c.userClubId);
}

__defs["game/manager/board.ts"] = function (__exports, __req) {

// Diretoria: objetivo da temporada, moral (confiança) do treinador e forma recente.
// O objetivo sai da força do elenco comparada com a da divisão (o mesmo número que o jogo mostra nas listas).

                            
                                                                
                 
                
                                                              
 

function strengthRank(c             , clubId        )                                  {
  const club = c.world.clubs[clubId];
  const div = c.world.divisions.find((d) => d.id === club.divisionId);
  const ids = div ? div.clubIds : [clubId];
  const ranked = ids.map((id) => ({ id, s: clubStrength(c.world.players, c.world.clubs[id]) })).sort((a, b) => b.s - a.s || a.id.localeCompare(b.id));
  return { rank: ranked.findIndex((r) => r.id === clubId) + 1, total: ids.length };
}

function objectiveFor(c             , clubId        )            {
  const { rank } = strengthRank(c, clubId);
  const level = c.world.divisions.find((d) => d.id === c.world.clubs[clubId].divisionId)?.level ?? 4;
  if (level === 1) {
    if (rank <= 3) return { target: 1, label: 'Brigar pelo título', kind: 'TITULO' };
    if (rank <= 8) return { target: 6, label: 'Terminar entre os 6 primeiros', kind: 'TOPO' };
    if (rank <= 14) return { target: 12, label: 'Fazer uma campanha segura (até o 12º)', kind: 'MEIO' };
    return { target: 16, label: 'Evitar o rebaixamento', kind: 'PERMANENCIA' };
  }
  if (rank <= 4) return { target: 4, label: 'Conquistar o acesso', kind: 'ACESSO' };
  if (rank <= 8) return { target: 8, label: 'Brigar pelas primeiras posições (até o 8º)', kind: 'TOPO' };
  if (rank <= 14) return { target: 12, label: 'Fazer uma campanha segura (até o 12º)', kind: 'MEIO' };
  return { target: level === 4 ? 20 : 16, label: level === 4 ? 'Reconstruir o time sem sustos' : 'Evitar o rebaixamento', kind: 'PERMANENCIA' };
}

                                           

function moodOf(morale        )       {
  return morale >= 60 ? 'GOOD' : morale >= 35 ? 'WARN' : 'BAD';
}

const MOOD_ICON                       = { GOOD: '🟢', WARN: '🟡', BAD: '🔴' };
const MOOD_LABEL                       = { GOOD: 'Diretoria confiante', WARN: 'Diretoria atenta', BAD: 'Cargo ameaçado' };

                                         

/** Últimos n resultados de um clube (mais antigo primeiro). */
function recentForm(results                        , clubId        , n = 5)               {
  const mine = results.filter((r) => r.homeClubId === clubId || r.awayClubId === clubId);
  return mine.slice(-n).map((r) => {
    const gf = r.homeClubId === clubId ? r.homeGoals : r.awayGoals;
    const ga = r.homeClubId === clubId ? r.awayGoals : r.homeGoals;
    return gf > ga ? 'V' : gf === ga ? 'E' : 'D';
  });
}

function positionOf(c             , clubId        )         {
  const table = divisionStandings(c, c.world.clubs[clubId].divisionId);
  return table.findIndex((r) => r.clubId === clubId) + 1;
}

/**
 * Moral depois de uma rodada: vitória +3, empate 0, derrota −3; a partir da 6ª rodada a posição na tabela
 * comparada com o objetivo também pesa (+1 dentro da meta, −2 bem abaixo dela).
 */
function moraleAfterRound(morale        , letter            , round        , position        , target        )         {
  let m = morale + (letter === 'V' ? 3 : letter === 'D' ? -3 : 0);
  if (round >= 6) m += position <= target ? 1 : position > target + 4 ? -2 : 0;
  return clamp(m);
}

/** Fim de temporada: meta cumprida sobe a moral; acesso e título mais ainda; rebaixamento derruba. */
function moraleAfterSeason(morale        , position        , target        , movement                                 , champion         )         {
  let m = morale + (position <= target ? 15 : position > target + 4 ? -20 : -5);
  if (movement === 'PROMOTED') m += 15;
  if (movement === 'RELEGATED') m -= 25;
  if (champion) m += 10;
  return clamp(m);
}

/** Demissão: moral muito baixa depois da 10ª rodada (ou ao fim da temporada abaixo de 20). */
const FIRING_MORALE = 15;

const clamp = (v        , lo = 0, hi = 100) => Math.max(lo, Math.min(hi, Math.round(v)));

__exports["objectiveFor"] = objectiveFor;
__exports["moodOf"] = moodOf;
__exports["recentForm"] = recentForm;
__exports["positionOf"] = positionOf;
__exports["moraleAfterRound"] = moraleAfterRound;
__exports["moraleAfterSeason"] = moraleAfterSeason;
__exports["MOOD_ICON"] = MOOD_ICON;
__exports["MOOD_LABEL"] = MOOD_LABEL;
__exports["FIRING_MORALE"] = FIRING_MORALE;
__exports["clamp"] = clamp;
};

__defs["game/manager/core.ts"] = function (__exports, __req) {
                                                
const { objectiveFor } = __req("game/manager/board.ts");
const { initialCoaches, initialReferees } = __req("game/manager/people.ts");
const { sponsorOffers } = __req("game/manager/finance.ts");
                                               

// Criação e migração do estado de gestão. Um save antigo (sem CareerState.manager) recebe os padrões aqui:
// é a única "migração" desta versão, e ela é compatível (a chave e a versão do save não mudam).

const levelOf = (c             , id        ) => c.world.divisions.find((d) => d.id === c.world.clubs[id].divisionId)?.level ?? 4;

function createManager(c             )               {
  return {
    v: 1,
    stats: { season: {}, career: {} },
    coaches: initialCoaches(c.seed, c.world, c.userClubId, c.season),
    referees: initialReferees(c.seed),
    refereeStats: {},
    morale: 65,
    reputation: 10,
    news: [],
    newsSeq: 0,
    market: { wishlist: [], negotiations: [], auctions: [], loans: [], freeAgents: [], seq: 0 },
    contracts: {},
    finance: { sponsor: null, sponsorOffers: c.userClubId ? sponsorOffers(c.seed, c.season, c.userClubId, levelOf(c, c.userClubId), c.world.clubs[c.userClubId].reputation) : [], loans: [], ledger: [], seq: 0 },
    stadium: { levels: {}, works: [] },
    jobs: { offers: [], seq: 0, national: 'NONE' },
    objective: c.userClubId ? objectiveFor(c, c.userClubId) : null,
    clubsCoached: c.userClubId ? [[c.userClubId, c.season]] : [],
  };
}

/** Garante o estado de gestão (carreira nova ou save antigo). Não altera o resto da carreira. */
function ensureManager(c             )                                          {
  if (c.manager && c.manager.v === 1) return c                                           ;
  return { ...c, manager: createManager(c) };
}

function mgr(c             )               {
  if (!c.manager) throw new Error('estado de gestão ausente: chame ensureManager');
  return c.manager;
}

/** Atualiza o estado de gestão de forma imutável. */
function withManager(c             , fn                                   )              {
  return { ...c, manager: fn(mgr(c)) };
}

__exports["mgr"] = mgr;

// jogador continua sendo a única coisa que o engine usa.

const COACH_FIRST = ['Adilson', 'Celso', 'Dorival', 'Evandro', 'Fernando', 'Gilmar', 'Hélio', 'Ivo', 'Jair', 'Lauro', 'Milton', 'Nelson', 'Osmar', 'Paulo', 'Renato', 'Sérgio', 'Túlio', 'Válter', 'Wagner', 'Zé Carlos'];
const COACH_LAST = ['Arantes', 'Bastos', 'Caldeira', 'Dantas', 'Espíndola', 'Ferraz', 'Galvão', 'Horta', 'Leme', 'Mattos', 'Neves', 'Pimentel', 'Quintela', 'Rangel', 'Salles', 'Tavares', 'Vidal', 'Werneck'];
const REF_FIRST = ['Anderson', 'Bráulio', 'Cláudio', 'Daniel', 'Edson', 'Flávio', 'Glauco', 'Heber', 'Igor', 'Jonas', 'Leandro', 'Marcelo', 'Nílton', 'Otávio', 'Rafael', 'Sávio', 'Thiago', 'Wilton'];
const REF_LAST = ['Abreu', 'Brito', 'Cunha', 'Diniz', 'Fontes', 'Guerra', 'Lima', 'Mendes', 'Nunes', 'Paiva', 'Ramos', 'Seixas', 'Teles', 'Vaz'];

/** Hash estável (FNV-1a) para escolhas determinísticas que não consomem a sequência de um RNG. */
function stableHash(text        )         {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h;
}

/** Personalidade: idade decide "jovem" e "veterano"; os demais vêm de um hash do id (estável entre temporadas). */
function personalityOf(seed        , p                            )              {
  const h = stableHash(`${seed}|personalidade|${p.id}`);
  if (p.age <= 21 && h % 3 === 0) return 'JOVEM';
  if (p.age >= 32 && h % 3 === 0) return 'VETERANO';
  return (['LEAL', 'AMBICIOSO', 'FINANCEIRO', 'COMPETITIVO']         )[h % 4];
}

const PERSONALITY_LABEL                              = {
  LEAL: 'Leal',
  AMBICIOSO: 'Ambicioso',
  FINANCEIRO: 'Financeiro',
  COMPETITIVO: 'Competitivo',
  JOVEM: 'Jovem buscando minutos',

function luminance(hex        )         {

  const candidates = [club.primaryColor, club.secondaryColor].filter((c) => /^#[0-9a-fA-F]{6}$/.test(c));
  const best = candidates.sort((a, b) => contrastOnNavy(b) - contrastOnNavy(a))[0];

 * Data de uma rodada: a temporada começa no 2º domingo de abril e tem uma rodada por semana (domingo),
 * com rodadas no meio da semana (quarta) quando o calendário aperta (a cada 5ª rodada).

  if (debt > money || cushion < 8) return 'ATENCAO';

function payInstallment(l          )                                   {

const SPONSOR_BASE                         = { 1: 6_000_000, 2: 2_000_000, 3: 600_000, 4: 180_000 };

 * Três propostas de patrocínio para a temporada: uma segura (sem meta), uma com meta de posição e uma arriscada

  const safeGoal              = { kind: 'NONE' };

    { id: `sp-${season}-1`, name: pick(), amount: roundTo(base, 10_000), goal: safeGoal, bonus: 0 },

    { id: `sp-${season}-3`, name: pick(), amount: roundTo(base * 0.7, 10_000), goal: bigGoal, bonus: roundTo(base * 1.2, 10_000) },

function goalLabel(g             )         {

  if (g.kind === 'PROMOTION') return 'Conquistar o acesso';

  const top = PRIZE_TOP[level] ?? 150_000;
  const share = 1 - ((position - 1) / Math.max(1, total - 1)) * 0.95;
  return roundTo(top * share, 1_000);
}

  return { season, round, label, amount: Math.round(amount) };

function roundTo(v        , step        )         {
  return Math.round(v / step) * step;

__defs["game/manager/contracts.ts"] = function (__exports, __req) {
                                                    
const { personalityOf } = __req("game/manager/people.ts");
                                                            
const { roundTo } = __req("game/manager/finance.ts");

// Renovação de contrato: regra fixa e determinística, guiada pela personalidade do jogador.
// O jogador pede um salário e um prazo; abaixo do mínimo dele, recusa; entre o mínimo e o pedido, faz contraproposta.
// Três recusas e a conversa acaba (o jogador sai livre quando o contrato terminar). Nenhuma IA decide nada.

const ASK                              = { LEAL: 1.05, AMBICIOSO: 1.3, FINANCEIRO: 1.4, COMPETITIVO: 1.15, JOVEM: 1.1, VETERANO: 1.0 };
const FLOOR                              = { LEAL: 0.85, AMBICIOSO: 0.92, FINANCEIRO: 0.97, COMPETITIVO: 0.9, JOVEM: 0.9, VETERANO: 0.9 };
const YEARS                              = { LEAL: 3, AMBICIOSO: 2, FINANCEIRO: 2, COMPETITIVO: 2, JOVEM: 3, VETERANO: 2 };

const MAX_TALKS = 3;

/** Contrato termina ao fim desta temporada (ou já terminou). */
function expiring(p        , season        )          {
  return p.contract.endSeason <= season;
}

function openTalk(seed        , p        )               {
  const pers = personalityOf(seed, p);
  const askSalary = roundTo(Math.max(p.salary, 100) * ASK[pers], 100);
  const askYears = p.age >= 33 ? 1 : YEARS[pers];
  return { playerId: p.id, askSalary, askYears, minSalary: roundTo(askSalary * FLOOR[pers], 100), attempts: 0, status: 'OPEN', message: messageFor(pers) };
}

function messageFor(p             )         {
  switch (p) {
    case 'LEAL': return 'Quero continuar aqui. Um reajuste pequeno resolve.';
    case 'AMBICIOSO': return 'Só fico se o clube mostrar que quer crescer.';
    case 'FINANCEIRO': return 'Meu empresário quer o melhor salário possível.';
    case 'COMPETITIVO': return 'Quero ganhar coisas. O salário tem que acompanhar.';
    case 'JOVEM': return 'Quero minutos em campo e um contrato longo.';
    case 'VETERANO': return 'Quero estabilidade para encerrar bem a carreira.';
  }
}

                                                                                                   

/**
 * Proposta do treinador (salário por rodada e anos). Anos fora do que o jogador quer custam 5% de salário por ano de
 * diferença (o JOVEM e o VETERANO fazem questão do prazo).
 */
function proposeRenewal(seed        , p        , talk              , salary        , years        )              {
  if (talk.status !== 'OPEN') return { talk, agreed: null };
  const pers = personalityOf(seed, p);
  const gap = Math.abs(years - talk.askYears);
  const penalty = 1 + gap * ((pers === 'JOVEM' || pers === 'VETERANO') ? 0.1 : 0.05);
  const need = roundTo(talk.askSalary * penalty, 100);
  const floor = roundTo(talk.minSalary * penalty, 100);
  const attempts = talk.attempts + 1;
  if (salary >= need || (salary >= floor && attempts >= 2)) {
    return { talk: { ...talk, attempts, status: 'AGREED', message: 'Acordo fechado. Contrato renovado.' }, agreed: { salary, years } };
  }
  if (attempts >= MAX_TALKS) return { talk: { ...talk, attempts, status: 'BROKEN', message: 'Sem acordo. O jogador vai sair quando o contrato acabar.' }, agreed: null };
  if (salary >= floor) {
    const askSalary = roundTo((talk.askSalary + salary) / 2, 100);
    return { talk: { ...talk, attempts, askSalary: Math.max(askSalary, talk.minSalary), message: `Contraproposta: R$ ${askSalary.toLocaleString('pt-BR')} por rodada.` }, agreed: null };
  }
  return { talk: { ...talk, attempts, message: 'Muito abaixo do que ele espera.' }, agreed: null };
}

/** Ordem de importância no elenco (1 = o mais forte). */
function squadRank(world       , club      , playerId        )         {

function askingPrice(world       , seed        , playerId        , buyer             )         {

  const seller = p.clubId ? world.clubs[p.clubId] : null;
  if (!seller) return 0;

  if (pers === 'AMBICIOSO' && buyer && levelOf(world, buyer) < levelOf(world, seller)) f *= 0.95;
  if (seller.money < 0) f *= 0.85;

const fold = (s        ) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/** Busca no mercado (jogadores de outros clubes e livres). Ordena por força e depois por preço. */
function searchPlayers(world       , seed        , userClubId               , wishlist                   , f               , limit = 60)              {
  const buyer = userClubId ? world.clubs[userClubId] : null;
  const text = f.text ? fold(f.text.trim()) : '';
  const out              = [];
  for (const p of Object.values(world.players)) {
    if (p.clubId !== null && p.clubId === userClubId) continue;

/** Move um jogador entre clubes (ou para "sem clube"). Não mexe em dinheiro. */
function movePlayer(world       , playerId        , toClubId               , patch                                               = {})        {

function addMoney(world       , clubId        , amount        )        {
  const c = world.clubs[clubId];
  return { ...world, clubs: { ...world.clubs, [clubId]: { ...c, money: c.money + Math.round(amount) } } };
}

// ---------- proposta de compra ----------

                          
                                                        
                                                         
                                                         

/**
 * Resposta do clube vendedor a uma oferta. Regra fixa:
 *  oferta ≥ preço pedido → aceita; ≥ 75% → contraproposta (2/3 do caminho até o preço); abaixo → recusa.
 *  Na 3ª tentativa sem acordo o clube encerra a conversa.
 */
function evaluateOffer(asking        , offer        , attempts        )               {
  if (offer >= asking) return { kind: 'ACCEPTED', price: offer, message: 'Proposta aceita pelo clube.' };
  const last = attempts + 1 >= MAX_ATTEMPTS;
  if (offer >= asking * 0.75 && !last) {
    const counter = Math.max(offer + 5_000, roundTo((asking * 2 + offer) / 3, 5_000));
    return { kind: 'COUNTER', counter: Math.min(counter, asking), message: 'O clube fez uma contraproposta.' };
  }
  if (last) return { kind: 'REFUSED', final: true, message: 'O clube encerrou a negociação depois de três tentativas.' };
  return { kind: 'REFUSED', final: false, message: offer < asking * 0.5 ? 'Proposta muito abaixo do valor: o clube nem respondeu.' : 'Proposta recusada: o clube espera bem mais.' };
}

function newNegotiation(id        , kind                     , p        , offer        , season        , round        )              {
  return { id, kind, playerId: p.id, sellerClubId: p.clubId          , offer, counter: null, status: 'OPEN', attempts: 0, message: '', season, round };
}

// ---------- empréstimo ----------

/** Pode emprestar? O clube dono só libera quem não está entre os 16 mais fortes e se o elenco seguir com 18+. */
function loanable(world       , playerId        )                                  {
  const p = world.players[playerId];
  const club = p.clubId ? world.clubs[p.clubId] : null;
  if (!club) return { ok: false, reason: 'Jogador sem clube: contrate como livre.' };
  if (squadRank(world, club, playerId) <= 16) return { ok: false, reason: `${club.name} não empresta um jogador que usa.` };
  if (club.squad.length - 1 < 18) return { ok: false, reason: `${club.name} tem o elenco curto e não empresta.` };
  return { ok: true, reason: '' };
}

function loanFee(p        )         {
  return Math.max(5_000, roundTo(p.marketValue * 0.1, 1_000));
}

/** Para onde vai um jogador emprestado pelo treinador: o clube da mesma divisão (ou da de baixo) com o elenco mais curto. */
function loanDestination(world       , seed        , from      , playerId        )              {
  const level = levelOf(world, from);
  const pool = Object.values(world.clubs).filter((c) => c.id !== from.id && c.squad.length < MAX_SQUAD - 2 && [level, level + 1].includes(levelOf(world, c)));
  if (pool.length === 0) return null;
  const rng = createRng(deriveSeed(seed, `emprestimo:${playerId}`));
  const shortest = Math.min(...pool.map((c) => c.squad.length));
  const best = pool.filter((c) => c.squad.length <= shortest + 1).sort((a, b) => a.id.localeCompare(b.id));
  return best[rng.int(0, best.length - 1)];
}

// ---------- leilão ----------

/**
 * Lances da CPU num leilão, decididos quando ele fecha: clubes com caixa e para quem o jogador seria titular dão lance,
 * cada um com um teto próprio (seed do leilão). Vence o maior lance.
 */
function auctionBids(world       , seed        , a         , round        )        {
  const p = world.players[a.playerId];
  const rng = createRng(deriveSeed(seed, `leilao:${a.id}`));
  const bids        = [];
  const clubs = Object.values(world.clubs).sort((x, y) => x.id.localeCompare(y.id));
  for (const club of clubs) {
    if (club.id === p.clubId || club.squad.length >= MAX_SQUAD) continue;
    if (club.money * 0.4 < a.startPrice) continue;
    const eleventh = club.squad.map((id) => world.players[id]?.strength ?? 0).sort((x, y) => y - x)[10] ?? 0;
    if (p.strength < eleventh) continue;
    const roll = rng.next();
    if (roll < 0.55) continue;
    const ceiling = Math.min(club.money * 0.4, p.marketValue * 1.6);
    const amount = roundTo(a.startPrice * (1 + roll * 0.5), 5_000);
    if (amount < a.startPrice || amount > ceiling) continue;
    bids.push({ clubId: club.id, amount, round });
    if (bids.length >= 6) break;
  }
  return bids.sort((x, y) => y.amount - x.amount || x.clubId.localeCompare(y.clubId));
}

function minAuctionPrice(p        )         {
  return Math.max(5_000, roundTo(p.marketValue * 0.5, 5_000));
}

__defs["game/manager/news.ts"] = function (__exports, __req) {
                                                               
                                                                   

// Notícias: SEMPRE derivadas de algo que aconteceu no jogo (resultado, cartão, lesão, transferência, obra, demissão...).
// Nada é inventado: cada gerador recebe o fato e só o descreve. Rumor também nasce de um fato (um leilão aberto,
// uma proposta feita, um técnico pressionado).

const NEWS_LIMIT = 300;

const KIND_LABEL                           = { NOTICIA: 'Notícia', RUMOR: 'Rumor', OPINIAO: 'Opinião', URGENTE: 'Urgente', ANALISE: 'Análise' };

                                                              

function draft(kind          , title        , opts                                                                                             = {})        {
  return { kind, title, body: opts.body ?? null, clubId: opts.clubId ?? null, playerId: opts.playerId ?? null, mine: opts.mine ?? false };
}

/** Publica as notícias com ids sequenciais (determinísticos) e mantém só as mais recentes. */
function publish(m              , season        , round        , drafts                  )               {
  if (drafts.length === 0) return m;
  let seq = m.newsSeq;
  const items = drafts.map((d) => ({ ...d, id: `n${++seq}`, season, round }));
  const news = [...m.news, ...items];
  return { ...m, newsSeq: seq, news: news.length > NEWS_LIMIT ? news.slice(news.length - NEWS_LIMIT) : news };
}

const scoreText = (m            ) => `${m.home.name} ${m.score.home} × ${m.score.away} ${m.away.name}`;

/** Notícias de uma rodada, lidas das partidas reais (o placar e os eventos de cada uma). */
function roundNews(world       , matches                       , userClubId               , topDivisionId               )          {
  const out          = [];
  const name = (id               ) => (id ? (world.players[id]?.name ?? 'Jogador') : 'Jogador');
  for (const m of matches) {
    const isMine = userClubId !== null && (m.home.clubId === userClubId || m.away.clubId === userClubId);
    const diff = Math.abs(m.score.home - m.score.away);
    const homeClub = world.clubs[m.home.clubId];
    if (isMine) {
      const side = m.home.clubId === userClubId ? 'home' : 'away';
      const gf = m.score[side];
      const ga = m.score[side === 'home' ? 'away' : 'home'];
      const verdict = gf > ga ? 'Vitória' : gf === ga ? 'Empate' : 'Derrota';
      const scorers = m.events.filter((e) => (e.type === 'GOAL' || e.type === 'PENALTY_GOAL') && e.side === side).map((e) => name(e.playerId));
      out.push(draft('NOTICIA', `${verdict}: ${scoreText(m)}`, { body: scorers.length ? `Gols: ${scorers.join(', ')}. Público: ${m.attendance.toLocaleString('pt-BR')}.` : `Público: ${m.attendance.toLocaleString('pt-BR')}.`, clubId: userClubId, mine: true }));
      for (const e of m.events) {
        if (e.side !== side) continue;
        if (e.type === 'RED_CARD') out.push(draft('URGENTE', `${name(e.playerId)} expulso e suspenso para a próxima rodada`, { clubId: userClubId, playerId: e.playerId, mine: true }));
        if (e.type === 'INJURY') {
          const rounds = Number(e.detail) || 1;
          out.push(draft(rounds >= 3 ? 'URGENTE' : 'NOTICIA', `${name(e.playerId)} se machucou e fica ${rounds} rodada${rounds > 1 ? 's' : ''} fora`, { clubId: userClubId, playerId: e.playerId, mine: true }));
        }
      }
      const hat = countBy(scorers).find(([, n]) => n >= 3);
      if (hat) out.push(draft('ANALISE', `${hat[0]} marca ${hat[1]} gols no mesmo jogo`, { clubId: userClubId, mine: true }));
    } else if (homeClub && homeClub.divisionId === topDivisionId && diff >= 4) {
      out.push(draft('NOTICIA', `Goleada na 1ª divisão: ${scoreText(m)}`, { clubId: m.score.home > m.score.away ? m.home.clubId : m.away.clubId }));
    }
  }
  return out;
}

function countBy(list                   )                     {
  const map = new Map                ();
  for (const x of list) map.set(x, (map.get(x) ?? 0) + 1);
  return [...map.entries()];
}

/** Notícias do dia: as da rodada mais recente (Jornal do Dia), as do clube do treinador primeiro. */
function dailyPaper(news                     )             {
  if (news.length === 0) return [];
  const last = news[news.length - 1];
  const today = news.filter((n) => n.season === last.season && n.round === last.round);
  return [...today.filter((n) => n.mine), ...today.filter((n) => !n.mine)];
}

__exports["roundNews"] = roundNews;
__exports["dailyPaper"] = dailyPaper;

__exports["KIND_LABEL"] = KIND_LABEL;
};

__defs["game/manager/stadium.ts"] = function (__exports, __req) {

const UPGRADES                         = [
  { id: 'ARQUIBANCADA', label: 'Arquibancadas', description: '+1.500 lugares por nível. Mais lugares não garantem mais público: a ocupação depende do time e do adversário.', maxLevel: 5, cost: 450_000, rounds: 6, seats: 1500 },
  { id: 'GRAMADO', label: 'Gramado', description: 'Gramado melhor atrai mais torcedores.', maxLevel: 3, cost: 120_000, rounds: 3, fill: 0.02 },
  { id: 'ILUMINACAO', label: 'Iluminação', description: 'Jogos noturnos mais atraentes.', maxLevel: 2, cost: 150_000, rounds: 3, fill: 0.02 },
  { id: 'SEGURANCA', label: 'Segurança', description: 'Famílias voltam ao estádio.', maxLevel: 3, cost: 100_000, rounds: 2, fill: 0.02 },
  { id: 'ACESSOS', label: 'Acessos', description: 'Entrada e saída mais rápidas.', maxLevel: 2, cost: 180_000, rounds: 4, fill: 0.03 },
  { id: 'ESTACIONAMENTO', label: 'Estacionamento', description: '+R$ 0,80 por torcedor em cada jogo em casa.', maxLevel: 2, cost: 120_000, rounds: 3, perFan: 0.8 },
  { id: 'ALIMENTACAO', label: 'Alimentação', description: '+R$ 1,50 por torcedor em cada jogo em casa.', maxLevel: 3, cost: 90_000, rounds: 2, perFan: 1.5 },
  { id: 'LOJA', label: 'Loja do clube', description: '+R$ 1,20 por torcedor em cada jogo em casa.', maxLevel: 3, cost: 110_000, rounds: 3, perFan: 1.2 },
  { id: 'VIP', label: 'Área VIP', description: '+R$ 4.000 por jogo em casa.', maxLevel: 2, cost: 250_000, rounds: 5, perGame: 4000 },
  { id: 'CONFORTO', label: 'Conforto', description: 'Assentos e cobertura: mais ocupação.', maxLevel: 2, cost: 200_000, rounds: 4, fill: 0.03 },
  { id: 'CT', label: 'Centro de treinamento', description: 'Jogadores de até 23 anos evoluem mais no fim da temporada.', maxLevel: 2, cost: 400_000, rounds: 8, youth: 1 },
];

const MAX_WORKS = 2;

function upgradeInfo(id           )              {
  const u = UPGRADES.find((x) => x.id === id);
  if (!u) throw new Error(`obra desconhecida: ${id}`);
  return u;
}

                                                        

const lvl = (levels        , id           ) => levels[id] ?? 0;

function fillBonus(levels        )         {
  return UPGRADES.reduce((sum, u) => sum + (u.fill ?? 0) * lvl(levels, u.id), 0);
}

function homeExtras(levels        , attendance        )         {
  return Math.round(UPGRADES.reduce((sum, u) => sum + (u.perFan ?? 0) * lvl(levels, u.id) * attendance + (u.perGame ?? 0) * lvl(levels, u.id), 0));
}

function youthBonus(levels        )         {
  return UPGRADES.reduce((sum, u) => sum + (u.youth ?? 0) * lvl(levels, u.id), 0);
}

                                                                                                                  

function canStartWork(levels        , works                        , id           , money        )            {
  const u = upgradeInfo(id);
  const pending = works.filter((w) => w.upgrade === id).length;
  const next = lvl(levels, id) + pending + 1;
  if (next > u.maxLevel) return { ok: false, reason: `${u.label} já está no nível máximo.` };
  if (works.length >= MAX_WORKS) return { ok: false, reason: `No máximo ${MAX_WORKS} obras ao mesmo tempo.` };
  if (money < u.cost) return { ok: false, reason: 'Caixa insuficiente para a obra.' };
  return { ok: true, cost: u.cost, rounds: u.rounds, level: next };
}

/** Aplica a obra concluída ao clube (só arquibancada muda dado do mundo). */
function applyWork(club      , id           )       {
  const u = upgradeInfo(id);
  if (!u.seats) return club;
  const capacity = club.stadium.capacity + u.seats;
  return { ...club, stadium: { ...club.stadium, capacity, maxCapacity: Math.max(club.stadium.maxCapacity, capacity) } };
}

// ---------- público (camada de jogo) ----------

                                  
                   
                                          
                        
                                                                                       
                           
                                                             
                                 
                             
                   
                 
 

/**
 * Público de um jogo: ocupação base pela reputação e pela divisão, ajustada pela fase do time, pela tabela, pelo
 * adversário, por rivalidade (mesma cidade) e pelo conforto do estádio. Limitada à capacidade.
 */
function attendanceFor(i                 )         {
  const divisionBase = [0, 0.3, 0.26, 0.22, 0.18][i.divisionLevel] ?? 0.18;
  let fill = divisionBase + 0.004 * i.reputation;
  if (i.formRatio !== null) fill += (i.formRatio - 0.45) * 0.3;
  if (i.tablePercentile !== null) fill += i.tablePercentile <= 0.25 ? 0.06 : i.tablePercentile > 0.75 ? -0.05 : 0;
  fill += Math.min(0.1, i.opponentReputation / 1000);
  if (i.rivalry) fill += 0.12;
  fill += fillBonus(i.levels);
  fill = Math.max(0.08, Math.min(1, fill));
  return Math.round(i.capacity * fill);
}

// de partida: o engine recebe os mesmos elencos e as mesmas seeds; só o PÚBLICO de cada jogo é calculado aqui

function roundAttendance(c             , m              , home        , away        )         {

  const opp = c.world.clubs[away];
  const form = recentForm(c.results, home, 5);
  const pts = form.reduce((s, x) => s + (x === 'V' ? 3 : x === 'E' ? 1 : 0), 0);
  let percentile                = null;
  if (c.results.length > 0) {
    const table = divisionStandings(c, club.divisionId);
    percentile = (table.findIndex((r) => r.clubId === home) + 1) / table.length;

    capacity: club.stadium.capacity,
    reputation: club.reputation,
    divisionLevel: levelOf(c, home),
    formRatio: form.length ? pts / (form.length * 3) : null,

    opponentReputation: opp.reputation,
