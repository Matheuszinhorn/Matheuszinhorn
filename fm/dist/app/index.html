body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { line-height: 1.15; letter-spacing: .02em; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .center { text-align: center; } .good { color: var(--green); } .bad { color: var(--red); }
.row { display: flex; align-items: center; } .gap { gap: 10px; } .wrap { flex-wrap: wrap; }
.plain { list-style: none; padding: 0; display: grid; gap: 4px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 6px; }
.empty { color: var(--muted); padding: 10px 0; }
.notice { background: rgba(255,210,63,.1); border: 1px solid rgba(255,210,63,.35); color: #ffe38a; border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; }

/* ---------- estrutura ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100dvh; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: var(--bg2); border-bottom: 1px solid var(--line); }
.tb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tb-main strong { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-sub { color: var(--muted); font-size: 12px; line-height: 1.25; }
.tb-cash { text-align: right; display: flex; flex-direction: column; } .tb-cash-l { font-size: 10px; letter-spacing: .12em; color: var(--muted); } .tb-cash b { color: var(--text); font-variant-numeric: tabular-nums; }
.content { padding: 14px 14px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom)); max-width: 1180px; width: 100%; margin: 0 auto; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--brand-navy); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: var(--nav-h); background: none; border: 0; color: var(--muted); font-size: 9.5px; font-weight: 800; letter-spacing: .04em; }
.nav-btn.on { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); background: var(--accent-soft); }
.ico-svg { width: 22px; height: 22px; display: block; }
.nav-dot { position: absolute; top: 10px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(179,250,70,.7); animation: pulse 1.4s infinite; }
.nav-dot.warn { background: var(--yellow); }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(179,250,70,0); } 100% { box-shadow: 0 0 0 0 rgba(179,250,70,0); } }
@media (min-width: 900px) {
  .shell { grid-template-columns: 210px minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .topbar { grid-column: 1 / -1; padding: 12px 24px; }
  .nav { position: sticky; top: 68px; align-self: start; height: calc(100dvh - 68px); grid-template-columns: 1fr; grid-auto-rows: 58px; align-content: start; gap: 4px; padding: 14px 10px; border-top: 0; border-right: 1px solid var(--line); background: var(--brand-navy); }
  .nav-btn { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; min-height: 0; font-size: 13px; border-radius: 12px; }
  .nav-btn.on { box-shadow: inset 3px 0 0 var(--accent); }
  .nav-dot { top: 24px; right: 14px; }
  .content { padding: 22px 28px 40px; }
}

/* ---------- componentes ---------- */
.card, .stack, .page, .match-card { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
.card-title { display: flex; align-items: center; gap: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--text); margin-bottom: 10px; }
.card-title::before { content: ""; flex: none; width: 4px; height: 14px; border-radius: 2px; background: var(--accent); }
.card > details, details.card summary { cursor: pointer; font-weight: 700; }
.page { display: block; } .stack { display: flex; flex-direction: column; }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; } .two > .card { margin-bottom: 0; }
@media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .page.live .two { grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); } }
.btn { min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid rgba(242,244,237,.18); background: rgba(242,244,237,.05); font-weight: 800; letter-spacing: .05em; font-size: 13px; text-transform: uppercase; transition: transform .08s, filter .15s; }
.btn:active:not(:disabled) { transform: scale(.97); } .btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-danger { background: #7f1d2a; border-color: #c2414f; } .btn-good { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-big { min-height: 54px; font-size: 15px; padding: 0 26px; }
.seg { display: inline-flex; flex-wrap: wrap; background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; max-width: 100%; }
.seg-btn { min-height: 38px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 800; font-size: 12px; letter-spacing: .03em; text-transform: uppercase; }
.seg-btn.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); } .seg-btn:disabled { opacity: .5; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; margin: 6px 0 10px; }
.stat { background: rgba(242,244,237,.04); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat-v { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; } .stat-l { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.stat-good .stat-v { color: var(--green); } .stat-bad .stat-v { color: var(--red); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; }
.badge-blue { background: var(--info-soft); color: var(--text); } .badge-green { background: var(--accent-soft); color: var(--accent); } .badge-red { background: rgba(255,90,104,.18); color: #ff8a96; } .badge-yellow { background: rgba(255,210,63,.2); color: var(--yellow); } .badge-gray { background: rgba(242,244,237,.08); color: var(--muted); }
.crest { display: inline-grid; place-items: center; border-radius: 50%; border: 2px solid; font-weight: 900; letter-spacing: .02em; flex: none; }
.crest-sm { width: 30px; height: 30px; font-size: 11px; } .crest-md { width: 40px; height: 40px; font-size: 13px; } .crest-lg { width: 60px; height: 60px; font-size: 19px; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; } .field > span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input[type=text], select { min-height: 46px; padding: 0 12px; background: #050f19; border: 1px solid var(--line); border-radius: 12px; width: 100%; }
.pos { display: inline-block; min-width: 34px; text-align: center; padding: 2px 4px; border-radius: 6px; font-size: 10.5px; font-weight: 900; letter-spacing: .05em; }
.pos-GK { background: var(--sec-gk); color: #fff; } .pos-DEF { background: var(--sec-def); } .pos-MID { background: var(--sec-mid); } .pos-ATT { background: var(--sec-att); }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; scrollbar-width: none; }
.tab { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; background: rgba(242,244,237,.05); border: 1px solid var(--line); font-weight: 800; font-size: 13px; }
.tab.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
/* Celular: as 4 divisões sempre visíveis, em colunas iguais (sem aba escondida atrás da rolagem). */
@media (max-width: 520px) { .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; overflow: visible; } .tab { min-width: 0; padding: 0 4px; font-size: 12px; white-space: nowrap; letter-spacing: -.01em; } }
.speedrow { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; margin: 4px 0 12px; } .speedrow .label { margin: 0; }
@media (max-width: 520px) { .hs { display: none; } .standings td, .standings th { padding-left: 4px; padding-right: 4px; } .standings td.club { max-width: 150px; } }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; max-width: 100%; } .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px 6px; border-bottom: 1px solid rgba(242,244,237,.06); white-space: nowrap; } .tbl .n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tbody tr { cursor: pointer; } .tbl tbody tr:hover { background: rgba(242,244,237,.04); }
.standings td.club { max-width: 170px; overflow: hidden; text-overflow: ellipsis; } .pos-n { color: var(--muted); font-variant-numeric: tabular-nums; }
.standings tr.up td:first-child { box-shadow: inset 3px 0 var(--green); } .standings tr.down td:first-child { box-shadow: inset 3px 0 var(--red); }
.tbl tr.me { background: var(--accent-soft); font-weight: 700; } .tbl tr.me td.club { color: var(--accent); } .tbl tr.sel { background: rgba(255,210,63,.18); } .tbl tr.unavailable { opacity: .55; }
.legend { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.results { list-style: none; padding: 0; display: grid; gap: 6px; } .results li { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; background: rgba(242,244,237,.04); font-size: 14px; }
.results li.me { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); } .results .r { text-align: right; }
.card .results:has(.wdl) li { grid-template-columns: 26px 1fr auto; } .card .results:has(.wdl) .r { text-align: left; }
.wdl { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 900; } .wdl-W { background: var(--accent); color: var(--on-accent); } .wdl-D { background: #5d6b78; } .wdl-L { background: #b62b3a; }
.clublist { list-style: none; padding: 0; display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.clubrow { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 10px; border-radius: 12px; background: rgba(242,244,237,.04); border: 1px solid transparent; text-align: left; }
.clubrow.me { border-color: var(--accent-line); background: var(--accent-soft); } .cname { flex: 1; font-weight: 600; } .cstr { font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
.team-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; } .team-head h2 { font-size: 22px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 14px; font-size: 13.5px; } .facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; }

/* ---------- início ---------- */
.start { max-width: 980px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 16px 40px; }
.hero { text-align: center; padding: 0 8px 22px; }
.brand-logo { display: block; aspect-ratio: var(--logo-ratio); background: var(--brand-logo) center / contain no-repeat; }
.hero .brand-logo { width: min(68vw, 300px); margin: 0 auto; }
.hero p { color: var(--muted); max-width: 520px; margin: 8px auto 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.start-panel { max-width: 720px; margin: 0 auto; } .offers { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin: 12px 0; }
.offer { background: rgba(242,244,237,.04); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; } .offer h4 { font-size: 18px; } .offer .btn { align-self: stretch; margin-top: auto; }
.legal { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }

/* ---------- partida ---------- */
.match-card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.sb-team { display: flex; flex-direction: column; gap: 3px; min-width: 0; } .sb-team:last-child { text-align: right; align-items: flex-end; } .sb-name { font-size: clamp(13px, 3.4vw, 20px); font-weight: 800; overflow-wrap: break-word; word-break: normal; hyphens: manual; line-height: 1.15; } .sb-style { font-size: 11px; color: var(--muted); }
.sb-team.me .sb-name { color: var(--accent); }
.sb-mid { text-align: center; } .sb-score { font-size: clamp(38px, 11vw, 60px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; } .sb-score span { margin: 0 6px; color: var(--muted); font-weight: 400; }
.sb-clock { display: inline-flex; align-items: center; gap: 7px; margin-top: 6px; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .06em; background: rgba(0,0,0,.35); }
/* Celular: o relógio desce para uma linha própria, abaixo do placar, e os nomes ganham a largura da coluna do meio (sem partir palavra). */
@media (max-width: 520px) { .scoreboard { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: 'home score away' 'clock clock clock'; row-gap: 6px; } .sb-team:first-child { grid-area: home; } .sb-team:last-child { grid-area: away; } .sb-mid { display: contents; } .sb-score { grid-area: score; text-align: center; } .sb-clock { grid-area: clock; justify-self: center; margin-top: 0; } .sb-name { font-size: 14px; } }
.sb-clock .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); } .sb-clock.live .dot { background: var(--green); animation: pulse 1.4s infinite; } .sb-clock.paused .dot { background: var(--yellow); } .sb-clock.wait { color: var(--yellow); } .sb-clock.wait .dot { background: var(--yellow); animation: pulse 1s infinite; } .sb-clock.end .dot { background: var(--red); }
.controls { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 12px; } .controls .seg { justify-content: center; }
.result-flag { text-align: center; margin-bottom: 10px; } .result-flag .badge { font-size: 13px; padding: 4px 16px; } .scorers { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 3px; text-align: center; font-size: 14px; }
.next-vs { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: clamp(16px, 4.4vw, 22px); font-weight: 800; text-align: center; flex-wrap: wrap; margin: 4px 0 6px; } .next-vs b { color: var(--muted); }
/* Celular: confronto empilhado (mandante / x / visitante) e botões da rodada na largura toda. */
@media (max-width: 520px) { .next-vs { flex-direction: column; gap: 2px; } .pre-actions > .btn { flex: 1 1 100%; } } .next .muted { text-align: center; margin-bottom: 8px; }
.feed { list-style: none; padding: 0; max-height: 340px; overflow-y: auto; display: grid; gap: 4px; }
.ev { display: grid; grid-template-columns: 48px 22px 1fr; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 10px; background: rgba(242,244,237,.04); font-size: 13.5px; } .ev.key { background: rgba(242,244,237,.09); font-weight: 700; } .ev-goal.key { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); } .ev-min { color: var(--muted); font-variant-numeric: tabular-nums; }
.ev-ico { width: 18px; height: 18px; display: grid; place-items: center; font-size: 11px; font-weight: 900; border-radius: 4px; }
.ev-goal .ev-ico { border-radius: 50%; background: var(--accent); color: var(--on-accent); } .ev-goal .ev-ico::before { content: "G"; }
.ev-yellow .ev-ico { background: var(--yellow); width: 13px; height: 18px; } .ev-red .ev-ico { background: var(--red); width: 13px; height: 18px; }
.ev-injury .ev-ico { background: #fff; color: var(--red); border-radius: 4px; } .ev-injury .ev-ico::before { content: "+"; font-size: 15px; }
.ev-sub .ev-ico::before { content: "\21C4"; color: var(--accent); font-size: 15px; } .ev-pen .ev-ico { background: var(--text); color: var(--on-accent); } .ev-pen .ev-ico::before { content: "P"; }
.ev-save .ev-ico::before { content: "D"; color: var(--text); } .ev-wood .ev-ico::before { content: "T"; color: var(--muted); } .ev-info .ev-ico::before { content: "\2022"; color: var(--muted); }
.board { background: linear-gradient(180deg, #0c4a2a, #093a22); border: 1px solid rgba(43,214,123,.25); border-radius: 12px; padding: 6px 6px 10px; max-height: 520px; overflow-y: auto; }
.board-div { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); padding: 10px 6px 4px; }
.mrow { display: grid; grid-template-columns: 42px 1fr auto 1fr; gap: 6px; align-items: center; padding: 5px 6px; border-radius: 8px; font-size: 13px; } .mrow.me { background: rgba(7,21,34,.55); outline: 1px solid var(--accent); font-weight: 700; } .mrow.me .mteam { color: var(--brand-offwhite); }
.mmin { font-size: 11px; color: #b9ccbf; font-variant-numeric: tabular-nums; } .mmin.live { color: var(--yellow); font-weight: 800; } .mteam { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .mteam.r { text-align: right; }
.mscore { min-width: 50px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; background: rgba(0,0,0,.3); border-radius: 6px; padding: 1px 6px; }
.lu h4 { margin: 8px 0 6px; } .lu-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; } .lu-p { background: rgba(242,244,237,.07); border-radius: 8px; padding: 2px 8px; font-size: 13px; }
.cta { display: flex; justify-content: center; margin: 0 0 12px; } .cta .btn { width: 100%; max-width: 520px; }
.season-line { font-size: 18px; font-weight: 800; margin-bottom: 6px; }

/* ---------- campo (MEU TIME) ---------- */
.pitch { position: relative; aspect-ratio: 3 / 4; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,.35); background: repeating-linear-gradient(0deg, var(--pitch) 0 46px, var(--pitch2) 46px 92px); }
.pitch-lines::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(255,255,255,.4); } .pitch-lines::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; border: 2px solid rgba(255,255,255,.4); border-radius: 50%; transform: translate(-50%, -50%); }
.chip { position: absolute; transform: translate(-50%, -50%); width: 62px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 0; }
.chip-n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 14px; border: 2px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.45); background: var(--sec-def); }
.chip-GK .chip-n { background: var(--sec-gk); } .chip-MID .chip-n { background: var(--sec-mid); } .chip-ATT .chip-n { background: var(--sec-att); }
.chip-name { font-size: 10.5px; font-weight: 700; text-shadow: 0 1px 3px #000, 0 0 2px #000; white-space: nowrap; max-width: 62px; overflow: hidden; text-overflow: ellipsis; }
/* Universo de dados: o displayName aparece inteiro no campo (quebra em linhas em vez de cortar com "…"). */
.names-full .pitch { overflow: visible; } /* nome do goleiro, na borda de baixo, nunca é cortado */
.names-full .chip-name { white-space: normal; overflow: visible; text-overflow: clip; max-width: 74px; text-align: center; line-height: 1.15; overflow-wrap: anywhere; }
.chip.sel .chip-n { box-shadow: 0 0 0 4px var(--accent), 0 3px 8px rgba(0,0,0,.45); transform: scale(1.12); } .chip.off .chip-n { border-style: dashed; border-color: var(--yellow); } .chip:disabled { cursor: default; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; } .pill { min-height: 38px; padding: 0 14px; border-radius: 999px; background: rgba(242,244,237,.05); border: 1px solid var(--line); font-weight: 800; font-size: 13px; } .pill.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); } .pill:disabled { opacity: .5; }

/* ---------- pop-ups de decisão ---------- */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(3,10,17,.82); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 12px; }
.modal { width: min(580px, 100%); max-height: calc(100dvh - 24px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid rgba(242,244,237,.16); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.6); overflow: hidden; }

    const res = this.session.choosePenaltyTaker(playerId);
    if (!res.ok) this.notify(res.message, 'error');
  }

    const res = this.session.openTeamAdjustment();
    if (!res.ok) this.notify(res.message, 'error');

    const res = this.session.adjustTeam(changes);

      return false;

  // ----- MEU TIME (antes e depois da rodada) -----

          editLineup(fn                                                 )       {
    const career = this.state.career;
    if (!career) return;
    if (this.state.phase === 'LIVE') return this.notify('Durante a partida, use o botão MEU TIME da tela PARTIDA.', 'error');

      const next = withUserLineup(career, fn(current, career));

      this.fail(e);

  selectPlayer(id        )       {
    const first = this.state.selected;
    if (this.state.phase === 'LIVE') return this.notify('Durante a partida, use o botão MEU TIME da tela PARTIDA.', 'error');

    this.editLineup((l, c) => applyFormation(userClub(c), c.world.players, l, f));
  }

  setTactics(t                                        )       {
    this.editLineup((l) => setTactics(l, t));
  }

  setPenaltyTaker(id               )       {
    this.editLineup((l) => setPenaltyTaker(l, id));
  }

  bestTeam()       {
    this.editLineup((l, c) => bestLineup(userClub(c), c.world.players, l));
  }

  /** Pausa a rodada em andamento e sai da consulta a CLUBES ao descartar a sessão. */
  dispose()       {
    if (this.toastTimer) clearTimeout(this.toastTimer);
    this.session.dispose();
  }

__defs["engine/rng.ts"] = function (__exports, __req) {
                                        

// Aleatoriedade determinística sem Math.random().
// Só operações inteiras de 32 bits (|0, >>>, Math.imul): o mesmo resultado em qualquer motor JavaScript.

/** Hash de texto para 128 bits (4 palavras de 32 bits). Aceita seeds de qualquer tamanho, sem truncar. */
function cyrb128(text        )                                   {
  let h1 = 1779033703;
  let h2 = 3144134277;
  let h3 = 1013904242;
  let h4 = 2773480762;
  for (let i = 0; i < text.length; i++) {
    const k = text.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  h1 ^= h2 ^ h3 ^ h4;
  h2 ^= h1;
  h3 ^= h1;
  h4 ^= h1;
  return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
}

/** Gerador sfc32: devolve números em [0, 1). */
function sfc32(seed                                  )               {
  let [a, b, c, d] = seed;
  return () => {
    a |= 0;
    b |= 0;
    c |= 0;
    d |= 0;
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

// Descarta os primeiros números de cada gerador para misturar melhor o estado inicial.
const WARMUP = 4;

function generator(key        )               {
  const next = sfc32(cyrb128(key));
  for (let i = 0; i < WARMUP; i++) next();
  return next;
}

                      
                 
                                                   
                                        
                                  
 

/** Gerador sequencial. Usado fora da partida (geração do mundo, calendário), onde a ordem é fixa. */
function createRng(key        )      {
  const next = generator(key);
  return {
    next,
    int: (min, max) => min + Math.floor(next() * (max - min + 1)),
    pick: (items) => items[Math.floor(next() * items.length)],
  };
}

/** Deriva uma seed filha em texto (32 hex). Ex.: seed da partida = deriveSeed(seedDaRodada, matchId). */
function deriveSeed(parent        , label        )         {
  return cyrb128(`${parent}:${label}`)
    .map((w) => w.toString(16).padStart(8, '0'))
    .join('');
}

function clockKey(clock       )         {
  return `${clock.half}|${clock.minute}|${clock.added}`;
}

/**
 * Canal de sorteio da partida (seção 25).
 * sorteio(seed, relógio, canal, ocorrência): cada canal de cada minuto tem seu próprio mini-gerador,
 * e a ocorrência n é o n-ésimo número dele. Criar um canal novo nunca desloca os outros.
 */
function channel(seed        , clock       , name        )                                 {
  const next = generator(`${seed}|${clockKey(clock)}|${name}`);
  const values           = [];
  return (occurrence        ) => {
    while (values.length <= occurrence) values.push(next());
    return values[occurrence];
  };
}

/** Escolha ponderada determinística: u em [0, 1). Devolve -1 se todos os pesos forem zero. */
function pickWeighted(weights                   , u        )         {
  let total = 0;
  for (const w of weights) total += w;
  if (total <= 0) return -1;
  let target = u * total;
  for (let i = 0; i < weights.length; i++) {
    target -= weights[i];
    if (target < 0) return i;
  }
  return weights.length - 1;
}

__exports["cyrb128"] = cyrb128;
__exports["createRng"] = createRng;
__exports["deriveSeed"] = deriveSeed;
__exports["clockKey"] = clockKey;
__exports["channel"] = channel;
__exports["pickWeighted"] = pickWeighted;
};

__defs["engine/strength.ts"] = function (__exports, __req) {
const { DEFAULT_CONFIG,                   } = __req("engine/config.ts");
                                                               

                        
                     
                   
 

const LINE_ORDER                                          = { DEF: 0, MID: 1, ATT: 2 };

/** Fator de fora de posição (seção 5): mesma 1,00; vizinha 0,80; distante 0,60; gol ↔ linha 0,30. */
function positionFactor(natural          , sector        , cfg               = DEFAULT_CONFIG)         {
  if (natural === sector) return cfg.positionFactor.same;
  if (natural === 'GK' || sector === 'GK') return cfg.positionFactor.goal;
  const distance = Math.abs(LINE_ORDER[natural] - LINE_ORDER[sector]);
  return distance === 1 ? cfg.positionFactor.adjacent : cfg.positionFactor.far;
}

function effectiveStrength(player       , sector        , cfg               = DEFAULT_CONFIG)         {
  return player.strength * positionFactor(player.position, sector, cfg);
}

                               
             
              
              
              
 

/** Soma (não média) da força efetiva por setor (seção 4). */
function sectorTotals(
  slots                       ,
  players                       ,
  cfg               = DEFAULT_CONFIG,
)               {
  const totals               = { GK: 0, DEF: 0, MID: 0, ATT: 0 };
  for (const slot of slots) totals[slot.sector] += effectiveStrength(players[slot.playerId], slot.sector, cfg);
  return totals;
}

function attackAndDefense(t              , cfg               = DEFAULT_CONFIG)                                      {
  return {
    attack: t.ATT + cfg.midfieldShare * t.MID,
    defense: t.DEF + cfg.midfieldShare * t.MID,
  };
}

/** Força geral: média da força efetiva dos jogadores em campo (tela e CPU; não entra no cálculo da partida). */
function overallStrength(
  slots                       ,
  players                       ,
  cfg               = DEFAULT_CONFIG,
)         {
  if (slots.length === 0) return 0;
  let sum = 0;
  for (const slot of slots) sum += effectiveStrength(players[slot.playerId], slot.sector, cfg);
  return sum / slots.length;
}

__exports["positionFactor"] = positionFactor;
__exports["effectiveStrength"] = effectiveStrength;
__exports["sectorTotals"] = sectorTotals;
__exports["attackAndDefense"] = attackAndDefense;
__exports["overallStrength"] = overallStrength;
};

__defs["engine/lineup.ts"] = function (__exports, __req) {
const { ALL_BEHAVIORS, ALL_STYLES, DEFAULT_CONFIG,                   } = __req("engine/config.ts");
const { effectiveStrength } = __req("engine/strength.ts");
                                                                                                       

// Escalação (seções 3 e 5). Formação livre: qualquer divisão dos 10 jogadores de linha, mais 1 goleiro.

const SECTORS           = ['GK', 'DEF', 'MID', 'ATT'];
const SECTOR_Y                         = { GK: 5, DEF: 30, MID: 55, ATT: 80 };

function formationLabel(f           )         {
  return `${f.DEF}-${f.MID}-${f.ATT}`;
}

/** "4-3-3" → { DEF: 4, MID: 3, ATT: 3 }. Lança erro se não somar 10. */
function parseFormation(label        )            {
  const parts = label.split('-').map((n) => Number.parseInt(n, 10));
  if (parts.length !== 3 || parts.some((n) => !Number.isInteger(n) || n < 0)) {
    throw new Error(`Formação inválida: ${label}`);
  }
  const [DEF, MID, ATT] = parts;
  if (DEF + MID + ATT !== 10) throw new Error(`Formação precisa somar 10 jogadores de linha: ${label}`);
  return { DEF, MID, ATT };
}

function formationOf(slots                       )            {
  const f            = { DEF: 0, MID: 0, ATT: 0 };
  for (const s of slots) if (s.sector !== 'GK') f[s.sector] += 1;
  return f;
}

function isAvailable(p        )          {
  return p.condition.injuryRounds === 0 && p.condition.suspensionRounds === 0;
}

/** Espalha x no campo e fixa y pelo setor. Só serve à futura tela; o motor usa o setor. */
function arrangeSlots(entries                                                 )               {
  const bySector                           = { GK: [], DEF: [], MID: [], ATT: [] };
  for (const e of entries) bySector[e.sector].push(e.playerId);
  const slots               = [];
  for (const sector of SECTORS) {
    const ids = bySector[sector];
    ids.forEach((playerId, i) => {
      slots.push({ playerId, sector, x: Math.round(((i + 1) * 100) / (ids.length + 1)), y: SECTOR_Y[sector] });
    });
  }
  return slots;
}

/** Ordena por força e usa o id como desempate: a mesma entrada sempre gera a mesma escalação. */
function byStrengthDesc(a        , b        )         {
  return b.strength - a.strength || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
}

                                    
                        
                
                      
 

/**
 * Escalação automática (CPU e botão "melhor time"): goleiro mais forte, depois os mais fortes
 * de cada posição natural. Faltando alguém, entra quem rende mais naquele setor.
 */
function autoLineup(
  club      ,
  players                        ,
  opts                    = {},
  cfg               = DEFAULT_CONFIG,
)         {
  const formation = opts.formation ?? club.defaultTactics.formation;
  const pool = club.squad
    .map((id) => players[id])
    .filter((p)              => p !== undefined && isAvailable(p))
    .sort(byStrengthDesc);
  if (pool.length < 11) throw new Error(`${club.name} não tem 11 jogadores disponíveis`);

  const taken = new Set        ();
  const chosen                                         = [];
  const need                         = { GK: 1, DEF: formation.DEF, MID: formation.MID, ATT: formation.ATT };

  // 1ª passada: posições naturais.
  for (const sector of SECTORS) {
    for (const p of pool) {
      if (need[sector] === 0) break;
      if (p.position === sector && !taken.has(p.id)) {
        chosen.push({ playerId: p.id, sector });
        taken.add(p.id);
        need[sector] -= 1;
      }
    }
  }
  // 2ª passada: vagas restantes vão para quem tiver mais força efetiva no setor.
  for (const sector of SECTORS) {
    while (need[sector] > 0) {
      const best = pool
        .filter((p) => !taken.has(p.id))
        .sort((a, b) => effectiveStrength(b, sector, cfg) - effectiveStrength(a, sector, cfg) || byStrengthDesc(a, b))[0];
      if (!best) throw new Error(`${club.name}: faltam jogadores para ${formationLabel(formation)}`);
      chosen.push({ playerId: best.id, sector });
      taken.add(best.id);
      need[sector] -= 1;
    }
  }

  // Banco: um goleiro reserva primeiro (se houver), depois os mais fortes.
  const rest = pool.filter((p) => !taken.has(p.id));
  const bench           = [];
  const reserveGk = rest.find((p) => p.position === 'GK');
  if (reserveGk) bench.push(reserveGk.id);
  for (const p of rest) {
    if (bench.length >= cfg.maxBench) break;
    if (!bench.includes(p.id)) bench.push(p.id);
  }

  const starters = arrangeSlots(chosen);
  const taker = club.penaltyTakerId && starters.some((s) => s.playerId === club.penaltyTakerId) ? club.penaltyTakerId : null;
  return {
    clubId: club.id,
    starters,
    bench,
    style: opts.style ?? club.defaultTactics.style,
    behavior: opts.behavior ?? club.defaultTactics.behavior,
    penaltyTakerId: taker,
  };
}

/** Devolve a lista de problemas. Lista vazia = escalação válida. O motor nunca "conserta" em silêncio. */
function validateLineup(
  lineup        ,
  club      ,
  players                        ,
  cfg               = DEFAULT_CONFIG,
)           {
  const errors           = [];
  const squad = new Set(club.squad);
  const seen = new Set        ();

  if (lineup.clubId !== club.id) errors.push('escalação de outro clube');
  if (lineup.starters.length !== 11) errors.push(`precisa de 11 titulares (tem ${lineup.starters.length})`);
  const goalkeepers = lineup.starters.filter((s) => s.sector === 'GK').length;
  if (goalkeepers !== 1) errors.push(`precisa de exatamente 1 no gol (tem ${goalkeepers})`);
  if (lineup.bench.length > cfg.maxBench) errors.push(`banco com mais de ${cfg.maxBench} reservas`);

  for (const id of [...lineup.starters.map((s) => s.playerId), ...lineup.bench]) {
    if (seen.has(id)) errors.push(`jogador repetido: ${id}`);
    seen.add(id);
    const p = players[id];
    if (!p || !squad.has(id)) errors.push(`jogador fora do elenco: ${id}`);
    else if (!isAvailable(p)) errors.push(`jogador lesionado ou suspenso: ${id}`);
  }
  for (const s of lineup.starters) {
    if (!SECTORS.includes(s.sector)) errors.push(`setor inválido: ${s.sector}`);
  }
  if (!ALL_STYLES.includes(lineup.style)) errors.push(`estilo inválido: ${lineup.style}`);
  if (!ALL_BEHAVIORS.includes(lineup.behavior)) errors.push(`comportamento inválido: ${lineup.behavior}`);
  if (lineup.penaltyTakerId && !lineup.starters.some((s) => s.playerId === lineup.penaltyTakerId)) {
    errors.push('batedor de pênalti precisa ser titular');
  }
  return errors;
}

__exports["formationLabel"] = formationLabel;
__exports["parseFormation"] = parseFormation;
__exports["formationOf"] = formationOf;
__exports["isAvailable"] = isAvailable;
__exports["arrangeSlots"] = arrangeSlots;
__exports["autoLineup"] = autoLineup;
__exports["validateLineup"] = validateLineup;
__exports["SECTORS"] = SECTORS;
};

const { validateLineup } = __req("engine/lineup.ts");
             
        
             
             
              
             
                 
       
            
            
                     

/** Erro do motor com código estável (ex.: step chamado com decisão pendente). */
class EngineError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'EngineError';
    this.code = code;
  }
}

function emptyStats()            {
  return {
    chances: 0,
    goals: 0,
    saves: 0,
    woodwork: 0,
    offTarget: 0,
    yellowCards: 0,
    redCards: 0,
    penalties: 0,
    penaltyGoals: 0,
    injuries: 0,
    possession: 50,
  };
}

function buildTeam(input                )            {
  const players                              = {};
  for (const id of [...input.lineup.starters.map((s) => s.playerId), ...input.lineup.bench]) {
    const p = input.players[id];
    players[id] = { id: p.id, name: p.name, position: p.position, strength: p.strength, temperament: p.temperament };
  }
  return {
    clubId: input.club.id,
    name: input.club.name,
    players,
    onField: input.lineup.starters.map((s) => ({ ...s })),
    bench: [...input.lineup.bench],
    subbedOff: [],
    sentOff: [],
    injured: [],
    yellowCards: [],
    subsUsed: 0,
    style: input.lineup.style,
    behavior: input.lineup.behavior,
    penaltyTakerId: input.lineup.penaltyTakerId,
    vacated: {},
  };
}

/** Cria a partida. Escalação inválida gera erro: o motor não simula nem "conserta" em silêncio. */
function createMatch(input            , cfg               = DEFAULT_CONFIG)             {
  for (const side of ['home', 'away']         ) {
    const t = input[side];
    const errors = validateLineup(t.lineup, t.club, t.players, cfg);
    if (errors.length > 0) throw new EngineError('INVALID_LINEUP', `${t.club.name}: ${errors.join('; ')}`);
  }
  if (input.home.club.id === input.away.club.id) throw new EngineError('INVALID_MATCH', 'um clube não joga contra si mesmo');
  const controlled = input.controlledClubId ?? null;
  if (controlled !== null && controlled !== input.home.club.id && controlled !== input.away.club.id) {
    throw new EngineError('INVALID_MATCH', 'clube controlado não está nesta partida');
  }

  const state             = {
    engineVersion: cfg.engineVersion,
    matchId: input.matchId,
    seed: input.seed,
    clock: { half: 1, minute: 1, added: 0 },
    stoppage: { first: null, second: null },
    status: 'RUNNING',
    decision: null,
    decisionQueue: [],
    controlledClubId: controlled,
    attendance: input.attendance ?? 0,
    home: buildTeam(input.home),
    away: buildTeam(input.away),
    pendingPenalty: null,
    score: { home: 0, away: 0 },
    events: [],
    stats: { home: emptyStats(), away: emptyStats() },
    commands: [],
    minutesPlayed: 0,
    decisionSeq: 0,
  };
  pushEvent(state, { clock: state.clock, type: 'KICKOFF', side: null });
  return state;
}

function otherSide(side      )       {
  return side === 'home' ? 'away' : 'home';
}

function sideOfClub(state            , clubId        )              {
  if (state.home.clubId === clubId) return 'home';
  if (state.away.clubId === clubId) return 'away';
  return null;
}

function cloneState(state            )             {

 * O relógio já ultrapassou o fim da partida?
 * Ao jogar o último minuto do 2º tempo (o último de acréscimo, ou a extensão de um pênalti), o relógio vai para
 * "um minuto depois" (90, added > acréscimo). Esse é o sinal de fim: a partida só vira FINISHED quando não há
 * decisão pendente (seção 23: decisão obrigatória bloqueia o FINISHED, inclusive em 90+).
 * Com pênalti pendente o relógio também fica além do acréscimo (extensão), mas aí o jogo continua.
 */
function isPastEnd(state            )          {
  const stoppage = state.stoppage.second;
  return (
    state.clock.half === 2 &&
    state.clock.minute === 90 &&
    stoppage !== null &&
    state.clock.added > stoppage &&
    state.pendingPenalty === null
  );

const { channel, pickWeighted } = __req("engine/rng.ts");

/**
 * Curva força → volume de chances (seção 8, 0.2.0): f(r) = (1+c)·r ÷ (r+c), r = ataque efetivo ÷ defesa adversária.

 * O resto são as chances ADICIONAIS pela superioridade, e a fração δ = X ÷ (X+h) delas é degradada.

function chanceQualityContext(team           , rival           , ratio        , cfg              )                {

  const ovRival = overallStrength(rival.onField, rival.players, cfg);
  const X = ovRival > 0 ? Math.max(0, ovSelf / ovRival - 1) : 0;
  const fr = chanceCurve(ratio, cfg);

function qualityShares(q               , cfg              )                           {

  const base = cfg.quality.baseShares;
  const degraded = cfg.quality.degradedShares;

    base[0] * keep + add * q.delta * degraded[0],
    base[1] * keep + add * q.delta * degraded[1],
    base[2] * keep + add * q.delta * degraded[2],
  ];
}

/** Categoria (0 baixa, 1 média, 2 alta) para o sorteio v ∈ [0,1). */

      (rival.behavior === 'AGGRESSIVE' ? cfg.aggressive.oppChances : 1);

      chancesPerMatch: chances,
      conversion,
      yellowPerMatch: cfg.yellowRatePerTeam * cardFactor(team, cfg),
      redPerMatch: cfg.directRedRatePerTeam * cardFactor(team, cfg),
      injuryPerMatch: cfg.injuryRatePerTeam * (rival.behavior === 'AGGRESSIVE' ? cfg.aggressive.injuriesCaused : 1),

    home: rates('home'),
    away: rates('away'),
    possessionHome: midTotal > 0 ? totals.home.MID / midTotal : 0.5,
  };

function pickScorer(team           , u        , cfg              )                {

 * Canal CHANCE:<lado> (seção 25): ocorrência 0 = houve chance?; 1 = resultado; 2 = autor do gol;
 * 3 = categoria de qualidade da chance (0.2.0, só com cfg.quality.enabled; entra no FIM do canal e não desloca as demais).
 */
function resolveChance(state            , side      , rates           , clock       , cfg              )       {
  const draw = channel(state.seed, clock, `CHANCE:${side.toUpperCase()}`);
  if (draw(0) >= perMinute(rates.chancesPerMatch, cfg)) return;

  const team = state[side];
  const opp = otherSide(side);
  const stats = state.stats[side];
  stats.chances += 1;

  const u = draw(1);
  let conversion = rates.conversion;
  if (rates.quality) {

    stats.goals += 1;

    const keeper = state[opp].onField.find((s) => s.sector === 'GK');
    pushEvent(state, { clock, type: 'SAVE', side: opp, playerId: keeper ? keeper.playerId : null });

    pushEvent(state, { clock, type: 'WOODWORK', side });
  } else {
    stats.offTarget += 1;
  }

const { DEFAULT_CONFIG,                   } = __req("engine/config.ts");

function executeDecision(state            , decision          , command         , cfg              )              {
  if (command.clubId !== decision.clubId) return { ok: false, error: 'NOT_CONTROLLED', message: 'decisão de outro clube' };

  if (decision.type === 'PENALTY_TAKER') {
    if (command.type !== 'CHOOSE_PENALTY_TAKER') {
      return { ok: false, error: 'WRONG_DECISION', message: 'esta decisão pede a escolha do cobrador' };
    }
    const pending = state.pendingPenalty;
    if (!pending || pending.side !== decision.side) return { ok: false, error: 'NO_DECISION', message: 'não há pênalti pendente' };
    if (!isOnField(state[decision.side], command.playerId)) {
      return { ok: false, error: 'INVALID_PLAYER', message: 'o cobrador precisa estar em campo' };
    }
    pending.takerId = command.playerId;
    return { ok: true };
  }

    return { ok: false, error: 'WRONG_DECISION', message: 'esta decisão pede um ajuste do time' };

 * - comando inválido: devolve o estado original e o erro.

function applyCommand(
  state            ,
  command         ,
  origin                   = 'PLAYER',
  cfg               = DEFAULT_CONFIG,
)                {

  const fail = (error                  , message        )                => ({ ok: false, state, error, message });

  if (state.status === 'FINISHED') return fail('INVALID_STATUS', 'a partida já terminou');

    return fail('NOT_CONTROLLED', 'só o clube do jogador aceita comandos');

/** Recalcula quem é elegível e a sugestão com o estado ATUAL (o time pode ter mudado na decisão anterior). */
function refreshDecision(state            , d          , cfg              )           {
  const team = state[d.side];
  const subsLeft = canSubstitute(team, cfg);

  let suggested                = null;

    eligible = team.onField.map((s) => s.playerId);

  }

function buildDecision(
  state            ,
  side      ,
  type              ,
  playerId               ,
  createdAt       ,
  cfg              ,
)           {
  state.decisionSeq += 1;
  const d           = {
    id: `${state.matchId}:${clockKey(createdAt)}:${type}:${state.decisionSeq}`,
    type,
    clubId: state[side].clubId,
    side,
    createdAt: { ...createdAt },
    playerId,
    eligible: [],
    suggested: null,
  };

  if (state.decision === null) {
    state.decision = refreshDecision(state, d, cfg);
    state.status = 'AWAITING_DECISION';
  } else {
    state.decisionQueue.push(d);
  }
}

/** Fecha a decisão atual: ativa a próxima da fila ou volta a RUNNING. */
function closeDecision(state            , cfg              )       {
  const next = state.decisionQueue.shift();
  if (next) {
    state.decision = refreshDecision(state, next, cfg);
    state.status = 'AWAITING_DECISION';
  } else {
    state.decision = null;
    state.status = 'RUNNING';
  }
}

__exports["closeDecision"] = closeDecision;
};

// Gera os MESMOS comandos que o jogador enviaria; quem aplica é commands.ts.

function byId(a        , b        )         {
  return a < b ? -1 : a > b ? 1 : 0;
}

/** Batedor: o da escalação, se em campo; senão o mais forte entre atacantes e meias; senão o mais forte. */
function cpuPenaltyTaker(team           )                {
  if (team.penaltyTakerId && team.onField.some((s) => s.playerId === team.penaltyTakerId)) return team.penaltyTakerId;
  const onField = team.onField.map((s) => team.players[s.playerId]);
  const pool = onField.filter((p) => p.position === 'ATT' || p.position === 'MID');
  const candidates = (pool.length > 0 ? pool : onField).sort((a, b) => b.strength - a.strength || byId(a.id, b.id));
  return candidates[0]?.id ?? null;
}

/** Melhor reserva para um setor: mesma posição natural primeiro, depois quem rende mais ali. */
function cpuReplacement(team           , sector        , cfg               = DEFAULT_CONFIG)                {
  const bench = team.bench.map((id) => team.players[id]);
  const natural = bench.filter((p) => p.position === sector).sort((a, b) => b.strength - a.strength || byId(a.id, b.id));
  if (natural.length > 0) return natural[0].id;
  const any = bench.sort(
    (a, b) => effectiveStrength(b, sector, cfg) - effectiveStrength(a, sector, cfg) || byId(a.id, b.id),
  );
  return any[0]?.id ?? null;
}

function strongestBenchGoalkeeper(team           )                {
  const gks = team.bench
    .map((id) => team.players[id])
    .filter((p) => p.position === 'GK')
    .sort((a, b) => b.strength - a.strength || byId(a.id, b.id));
  return gks[0]?.id ?? null;
}

/** Jogador de linha que menos rende onde está. Usado para ceder vaga ao goleiro reserva ou ir para o gol. */

  const outfield = team.onField
    .filter((s) => s.sector !== 'GK')
    .sort(
      (a, b) =>
        effectiveStrength(team.players[a.playerId], a.sector, cfg) -

/**

 * Devolve substituições + posições finais, ou null se o time ainda tem goleiro.

function goalkeeperFix(
  team           ,
  vacatedGk            ,
  cfg               = DEFAULT_CONFIG,
)                                                                                   {
  if (team.onField.some((s) => s.sector === 'GK')) return null;
  const weakest = weakestOutfield(team, cfg);
  if (!weakest) return null;
  const reserveGk = team.subsUsed < cfg.maxSubs ? strongestBenchGoalkeeper(team) : null;

      .filter((s) => s.playerId !== weakest.playerId)
      .map((s) => ({ ...s }))
      .concat({ playerId: reserveGk, sector: 'GK', x: vacatedGk.x, y: vacatedGk.y });
    return { substitutions: [{ out: weakest.playerId, in: reserveGk }], positions };
  }
  const positions = team.onField.map((s) =>
    s.playerId === weakest.playerId ? { ...s, sector: 'GK'         , x: vacatedGk.x, y: vacatedGk.y } : { ...s },
  );
  return { substitutions: [], positions };
}

/** Comando que a CPU envia para resolver uma decisão. */
function cpuCommandFor(state            , decision          , cfg               = DEFAULT_CONFIG)          {
  const team = state[decision.side];
  const base = { commandId: `cpu:${decision.id}`, clubId: decision.clubId, decisionId: decision.id };

  if (decision.type === 'PENALTY_TAKER') {
    return { ...base, type: 'CHOOSE_PENALTY_TAKER', playerId: decision.suggested ?? cpuPenaltyTaker(team) ?? '' };
  }

  const vacated = decision.playerId ? team.vacated[decision.playerId] : undefined;

  if (decision.type === 'INJURY_SUBSTITUTION' && decision.playerId && vacated) {
    if (canSubstitute(team, cfg)) {
      const incoming = cpuReplacement(team, vacated.sector, cfg);
      if (incoming) return { ...base, type: 'ADJUST_TEAM', substitutions: [{ out: decision.playerId, in: incoming }] };
    }
    if (vacated.sector === 'GK') {
      const fix = goalkeeperFix(team, vacated, cfg);
      if (fix) return { ...base, type: 'ADJUST_TEAM', ...fix };
    }
    return { ...base, type: 'ADJUST_TEAM', substitutions: [] };
  }

  if (decision.type === 'RED_CARD_ADJUSTMENT' && vacated && vacated.sector === 'GK') {
    const fix = goalkeeperFix(team, vacated, cfg);
    if (fix) return { ...base, type: 'ADJUST_TEAM', ...fix };
  }

  return { ...base, type: 'ADJUST_TEAM', substitutions: [] };
}

/** Estilo da CPU antes do jogo (seção 6): ofensivo se ≥10% mais forte, defensivo se ≥10% mais fraco. */
function cpuPreMatchStyle(ownOverall        , oppOverall        )        {
  if (oppOverall <= 0) return 'BALANCED';
  const ratio = ownOverall / oppOverall;
  if (ratio >= 1.1) return 'OFFENSIVE';
  if (ratio <= 1 / 1.1) return 'DEFENSIVE';
  return 'BALANCED';
}

__exports["cpuReplacement"] = cpuReplacement;
__exports["strongestBenchGoalkeeper"] = strongestBenchGoalkeeper;
__exports["weakestOutfield"] = weakestOutfield;
__exports["canSubstitute"] = canSubstitute;
__exports["goalkeeperFix"] = goalkeeperFix;
__exports["cpuCommandFor"] = cpuCommandFor;
__exports["cpuPreMatchStyle"] = cpuPreMatchStyle;
};

__defs["engine/match/substitutions.ts"] = function (__exports, __req) {
const { ALL_BEHAVIORS, ALL_STYLES,                   } = __req("engine/config.ts");
const { SECTORS } = __req("engine/lineup.ts");
                                                                                               
const { eventClock, pushEvent } = __req("engine/match/state.ts");

                                                                                                 

                                                            

function fail(error                  , message        )              {
  return { ok: false, error, message };
}

/**
 * Valida e aplica um ADJUST_TEAM (seção 23). Valida tudo antes de alterar qualquer coisa:
 * se falhar, o estado fica intacto.
 */
function applyAdjustTeam(state            , decision          , command            , cfg              )              {
  const side = decision.side;
  const team = state[side];
  const subs = command.substitutions ?? [];

  if (team.subsUsed + subs.length > cfg.maxSubs) {
    return fail('INVALID_LINEUP', `limite de ${cfg.maxSubs} substituições`);
  }

  // 1. Substituições, numa cópia do campo.
  let field               = team.onField.map((s) => ({ ...s }));
  const outs = new Set        ();
  const ins = new Set        ();
  let injuredReplaced = false;
  for (const sub of subs) {
    if (outs.has(sub.out) || ins.has(sub.in) || ins.has(sub.out) || sub.out === sub.in) {
      return fail('INVALID_PLAYER', 'substituição repetida');
    }
    if (!team.bench.includes(sub.in)) {
      return fail('INVALID_PLAYER', `${sub.in} não está disponível no banco`);
    }
    const idx = field.findIndex((s) => s.playerId === sub.out);
    if (idx !== -1) {
      field[idx] = { ...field[idx], playerId: sub.in };
    } else if (
      decision.type === 'INJURY_SUBSTITUTION' &&
      sub.out === decision.playerId &&
      team.injured.includes(sub.out) &&
      team.vacated[sub.out]
    ) {
      field.push({ ...team.vacated[sub.out], playerId: sub.in });
      injuredReplaced = true;
    } else {
      return fail('INVALID_PLAYER', `${sub.out} não está em campo`);
    }
    outs.add(sub.out);
    ins.add(sub.in);
  }

  // 2. Posições: se vierem, precisam ser exatamente os jogadores em campo depois das trocas.
  if (command.positions) {
    const expected = new Set(field.map((s) => s.playerId));
    const given = command.positions.map((s) => s.playerId);
    if (given.length !== expected.size || new Set(given).size !== given.length || given.some((id) => !expected.has(id))) {
      return fail('INVALID_LINEUP', 'as posições precisam listar exatamente os jogadores em campo');
    }
    for (const s of command.positions) {
      if (!SECTORS.includes(s.sector)) return fail('INVALID_LINEUP', `setor inválido: ${s.sector}`);
    }
    field = command.positions.map((s) => ({
      playerId: s.playerId,
      sector: s.sector,
      x: Number.isFinite(s.x) ? s.x : 50,
      y: Number.isFinite(s.y) ? s.y : 50,
    }));
  }

  // 3. Regras do time final.
  const keepers = field.filter((s) => s.sector === 'GK');
  if (keepers.length !== 1) return fail('INVALID_LINEUP', 'precisa haver exatamente um jogador no gol');

  const canSub = team.subsUsed < cfg.maxSubs && team.bench.length > 0;
  if (decision.type === 'INJURY_SUBSTITUTION' && canSub && !injuredReplaced) {
    return fail('INVALID_LINEUP', 'escolha o substituto do jogador lesionado');
  }
  const vacated = decision.playerId ? team.vacated[decision.playerId] : undefined;
  if (decision.type === 'RED_CARD_ADJUSTMENT' && vacated?.sector === 'GK') {
    const reserveGkAvailable = team.subsUsed < cfg.maxSubs && team.bench.some((id) => team.players[id].position === 'GK');
    if (reserveGkAvailable && team.players[keepers[0].playerId].position !== 'GK') {
      return fail('INVALID_LINEUP', 'com goleiro reserva disponível, ele deve entrar no gol');
    }

  if (command.style !== undefined && !ALL_STYLES.includes(command.style)) return fail('INVALID_LINEUP', 'estilo inválido');
  if (command.behavior !== undefined && !ALL_BEHAVIORS.includes(command.behavior)) {
    return fail('INVALID_LINEUP', 'comportamento inválido');
  }

  // 4. Tudo válido: aplica.
  team.onField = field;
  team.bench = team.bench.filter((id) => !ins.has(id));
  for (const sub of subs) {
    if (!team.injured.includes(sub.out)) team.subbedOff.push(sub.out);
    const reason =
      decision.type === 'INJURY_SUBSTITUTION' && sub.out === decision.playerId
        ? 'injury'
        : decision.type === 'RED_CARD_ADJUSTMENT'
          ? 'red_card'
          : 'tactical';
    pushEvent(state, { clock: eventClock(state), type: 'SUBSTITUTION', side, playerId: sub.out, relatedPlayerId: sub.in, detail: reason });
  }
  team.subsUsed += subs.length;
  if (command.style !== undefined) team.style = command.style;
  if (command.behavior !== undefined) team.behavior = command.behavior;
  return { ok: true };
}

__exports["applyAdjustTeam"] = applyAdjustTeam;
};

__defs["engine/match/incidents.ts"] = function (__exports, __req) {
const { DEFAULT_CONFIG, perMinute,                   } = __req("engine/config.ts");
const { channel, pickWeighted } = __req("engine/rng.ts");
const { effectiveStrength } = __req("engine/strength.ts");
                                                                      
const { cpuPenaltyTaker } = __req("engine/match/cpu.ts");
                                              
const { isOnField, otherSide, pushEvent, removeFromField } = __req("engine/match/state.ts");

/** Algo que aconteceu no minuto e pode exigir decisão (seção 23). */
                          
             
                                          
                          
 

/** Este gatilho tirou o goleiro (a vaga do gol) de campo? Vale para o goleiro titular e para quem já o substituía. */
function vacatedGoalkeeper(state            , trigger         )          {
  return trigger.playerId !== null && state[trigger.side].vacated[trigger.playerId]?.sector === 'GK';
}

/**
 * Ordem em que as decisões do minuto são resolvidas (seção 23).
 *
 * Os eventos do minuto (expulsão, lesão) tiram os jogadores de campo NA HORA; as decisões vêm depois, uma por vez.
 * Se a decisão de um jogador de linha fosse resolvida antes da do goleiro, ela seria validada com o time sem goleiro
 * e nunca poderia ser satisfeita. Por isso a decisão que restaura o gol vem primeiro, e só ela se move:
 * ela passa à frente das decisões anteriores do MESMO time; todo o resto mantém a ordem original (ordenação estável).
 * CPU e jogador humano usam a mesma lista, então a mesma ordem.
 */
function prioritizeTriggers(state            , triggers                    )            {
  const ordered            = [];
  for (const trigger of triggers) {
    if (vacatedGoalkeeper(state, trigger)) {
      const at = ordered.findIndex((o) => o.side === trigger.side && !vacatedGoalkeeper(state, o));
      if (at !== -1) {
        ordered.splice(at, 0, trigger);
        continue;
      }
    }
    ordered.push(trigger);
  }
  return ordered;
}

function tag(side      )         {
  return side.toUpperCase();
}

/** Expulsão: sai de campo, guarda a posição e nunca mais volta. */
function sendOff(state            , side      , playerId        , clock       , detail                            )       {
  const team = state[side];
  removeFromField(team, playerId);
  team.sentOff.push(playerId);
  state.stats[side].redCards += 1;
  pushEvent(state, { clock, type: 'RED_CARD', side, playerId, detail });
}

function cardWeights(team           , cfg              )           {
  return team.onField.map(
    (s) => cfg.cardSectorWeights[s.sector] * cfg.temperamentWeights[team.players[s.playerId].temperament],
  );
}

/**
 * Canal CARD:<lado>: 0 = amarelo?; 1 = vermelho direto?; 2 = quem leva o amarelo; 3 = quem leva o vermelho.
 * Posições fixas: a ocorrência 2 é sempre "quem leva o amarelo", mesmo sem amarelo.
 */
function resolveCards(state            , side      , rates           , clock       , cfg              )            {
  const draw = channel(state.seed, clock, `CARD:${tag(side)}`);
  const team = state[side];
  const triggers            = [];

  if (draw(0) < perMinute(rates.yellowPerMatch, cfg) && team.onField.length > 0) {
    const idx = pickWeighted(cardWeights(team, cfg), draw(2));
    if (idx !== -1) {
      const playerId = team.onField[idx].playerId;
      state.stats[side].yellowCards += 1;
      pushEvent(state, { clock, type: 'YELLOW_CARD', side, playerId });
      if (team.yellowCards.includes(playerId)) {
        sendOff(state, side, playerId, clock, 'second_yellow');
        triggers.push({ side, kind: 'RED_CARD', playerId });
      } else {
        team.yellowCards.push(playerId);
      }
    }
  }
  if (draw(1) < perMinute(rates.redPerMatch, cfg) && team.onField.length > 0) {
    const idx = pickWeighted(cardWeights(team, cfg), draw(3));
    if (idx !== -1) {
      const playerId = team.onField[idx].playerId;
      sendOff(state, side, playerId, clock, 'direct');
      triggers.push({ side, kind: 'RED_CARD', playerId });
    }
  }
  return triggers;
}

/** Canal INJURY:<lado>: 0 = lesão?; 1 = quem; 2 = duração. */
function resolveInjury(state            , side      , rates           , clock       , cfg              )            {
  const draw = channel(state.seed, clock, `INJURY:${tag(side)}`);
  const team = state[side];
  if (draw(0) >= perMinute(rates.injuryPerMatch, cfg) || team.onField.length === 0) return [];

  const weights = team.onField.map((s) => (s.sector === 'GK' ? cfg.injuryGoalkeeperWeight : 1));
  const idx = pickWeighted(weights, draw(1));
  if (idx === -1) return [];
  const playerId = team.onField[idx].playerId;

  // Duração: 1 rodada (60%), 2–3 (30%), 4–8 (10%).
  const u = draw(2);
  const rounds = u < 0.6 ? 1 : u < 0.9 ? 2 + Math.floor(((u - 0.6) / 0.3) * 2) : 4 + Math.floor(((u - 0.9) / 0.1) * 5);

  removeFromField(team, playerId);
  team.injured.push(playerId);
  state.stats[side].injuries += 1;
  pushEvent(state, { clock, type: 'INJURY', side, playerId, detail: Math.min(rounds, 8) });
  return [{ side, kind: 'INJURY', playerId }];
}

/** Canal PENALTY:<lado>: 0 = pênalti marcado? Só um pênalti pendente por vez. */
function resolvePenaltyAward(state            , side      , rates           , clock       , cfg               = DEFAULT_CONFIG)            {
  if (state.pendingPenalty !== null || state[side].onField.length === 0) return [];
  const draw = channel(state.seed, clock, `PENALTY:${tag(side)}`);
  if (draw(0) >= perMinute(rates.penaltyPerMatch, cfg)) return [];
  state.pendingPenalty = { side, awardedAt: { ...clock }, takerId: null };
  state.stats[side].penalties += 1;
  pushEvent(state, { clock, type: 'PENALTY_AWARDED', side });
  return [{ side, kind: 'PENALTY', playerId: null }];
}

/**
 * Cobrança no início do minuto seguinte ao da marcação (71' → 72').
 * Canal PENALTY_KICK:<lado>: 0 = converte?; 1 = defendido ou para fora.
 */
function resolvePenaltyKick(state            , clock       , cfg              )       {
  const pending = state.pendingPenalty;
  if (!pending) return;
  state.pendingPenalty = null;
  const side = pending.side;
  const team = state[side];
  const keeperSide = otherSide(side);
  const takerId = pending.takerId && isOnField(team, pending.takerId) ? pending.takerId : cpuPenaltyTaker(team);
  if (!takerId) return;
  const conversion = penaltyChance(state, side, takerId, cfg);

  const draw = channel(state.seed, clock, `PENALTY_KICK:${tag(side)}`);
  if (draw(0) < conversion) {
    state.score[side] += 1;
    state.stats[side].goals += 1;
    state.stats[side].penaltyGoals += 1;
    pushEvent(state, { clock, type: 'PENALTY_GOAL', side, playerId: takerId });
  } else if (draw(1) < cfg.penaltySavedShare) {
    state.stats[keeperSide].saves += 1;
    pushEvent(state, { clock, type: 'PENALTY_MISSED', side, playerId: takerId, detail: 'saved' });
  } else {
    pushEvent(state, { clock, type: 'PENALTY_MISSED', side, playerId: takerId, detail: 'wide' });
  }
}

/** Chance estimada de conversão, para o pop-up de escolha do batedor (função pura). */
function penaltyChance(state            , side      , takerId        , cfg              )         {
  const keeperSide = otherSide(side);
  const keeperSlot = state[keeperSide].onField.find((s) => s.sector === 'GK');
  const keeper = keeperSlot ? effectiveStrength(state[keeperSide].players[keeperSlot.playerId], 'GK', cfg) : 0;
  const taker = state[side].players[takerId];
  return Math.min(
    cfg.penaltyConversionMax,
    Math.max(cfg.penaltyConversionMin, cfg.penaltyConversionBase + (cfg.penaltyConversionSlope * (taker.strength - keeper)) / 50),
  );
}

__exports["vacatedGoalkeeper"] = vacatedGoalkeeper;
__exports["prioritizeTriggers"] = prioritizeTriggers;
__exports["sendOff"] = sendOff;
__exports["resolveCards"] = resolveCards;
__exports["resolveInjury"] = resolveInjury;
__exports["resolvePenaltyAward"] = resolvePenaltyAward;
__exports["resolvePenaltyKick"] = resolvePenaltyKick;
__exports["penaltyChance"] = penaltyChance;
};

__defs["engine/match/simulate.ts"] = function (__exports, __req) {
const { DEFAULT_CONFIG,                   } = __req("engine/config.ts");
                                                                                                         
const { applyCommand } = __req("engine/match/commands.ts");
const { cpuCommandFor } = __req("engine/match/cpu.ts");
const { createMatch, EngineError, sameClock } = __req("engine/match/state.ts");
const { step } = __req("engine/match/step.ts");

/** Quem responde às decisões do clube controlado. Sem decider, a CPU decide por ele. */
                                                                         

// 90 minutos + acréscimos (máx. 8 + 8) + extensões de pênalti: nunca passa disso.
const MAX_STEPS = 200;

/** Resolve a decisão aberta com o decider (origem PLAYER) ou com a CPU (origem CPU). */
function resolveOpenDecision(
  state            ,
  decider                     ,
  cfg               = DEFAULT_CONFIG,
)             {
  const decision = state.decision;
  if (!decision) return state;
  const command = decider ? decider(state, decision) : cpuCommandFor(state, decision, cfg);
  const result = applyCommand(state, command, decider ? 'PLAYER' : 'CPU', cfg);
  if (!result.ok) throw new EngineError(result.error, result.message);
  return result.state;
}

function simulateMatch(
  input                         ,
  decider          ,
  cfg               = DEFAULT_CONFIG,
)             {
  let s = 'status' in input ? input : createMatch(input, cfg);
  for (let i = 0; s.status !== 'FINISHED'; i++) {
    if (i > MAX_STEPS * 4) throw new EngineError('RUNAWAY', 'a partida não terminou');
    s = s.status === 'AWAITING_DECISION' ? resolveOpenDecision(s, decider, cfg) : step(s, cfg);
  }
  return s;
}

/** O que as camadas de temporada e economia precisam aplicar depois do jogo. */
function summarizeMatch(state            )              {
  const clubOf = (side                        ) => (side === 'away' ? state.away.clubId : state.home.clubId);
  const result              = {
    matchId: state.matchId,
    homeClubId: state.home.clubId,
    awayClubId: state.away.clubId,
    homeGoals: state.score.home,
    awayGoals: state.score.away,
    attendance: state.attendance,
    injuries: [],
    redCards: [],
    yellowCards: [],
  };
  for (const e of state.events) {
    if (!e.playerId) continue;
    if (e.type === 'INJURY') result.injuries.push({ clubId: clubOf(e.side), playerId: e.playerId, rounds: Number(e.detail) });
    if (e.type === 'RED_CARD') result.redCards.push({ clubId: clubOf(e.side), playerId: e.playerId });
    if (e.type === 'YELLOW_CARD') result.yellowCards.push({ clubId: clubOf(e.side), playerId: e.playerId });
  }
  return result;
}

/**
 * Reprodução técnica (só desenvolvimento: testes, depuração, balanceamento).
 * Reaplica, na mesma seed e nos mesmos dados, os comandos do clube controlado no minuto em que foram dados.
 * NÃO é recurso do jogador: não existe replay no jogo.
 */
function reproduceMatch(input            , records                          , cfg               = DEFAULT_CONFIG)             {
  const controlled = input.controlledClubId ?? null;
  const queue = records.filter((r) => r.command.clubId === controlled);
  let s = createMatch(input, cfg);
  let i = 0;
  for (let guard = 0; s.status !== 'FINISHED'; guard++) {
    if (guard > MAX_STEPS * 4) throw new EngineError('RUNAWAY', 'a reprodução não terminou');
    const next = queue[i];
    if (next && sameClock(next.clock, s.clock) && (s.status === 'AWAITING_DECISION' || next.command.type === 'OPEN_TEAM_ADJUSTMENT')) {
      const r = applyCommand(s, next.command, next.origin, cfg);
      if (!r.ok) throw new EngineError(r.error, `reprodução: ${r.message}`);
      s = r.state;
      i++;
      continue;
    }
    if (s.status === 'AWAITING_DECISION') throw new EngineError('MISSING_COMMAND', 'faltou um comando gravado');
    s = step(s, cfg);
  }
  return s;
}

__exports["resolveOpenDecision"] = resolveOpenDecision;
__exports["simulateMatch"] = simulateMatch;
__exports["summarizeMatch"] = summarizeMatch;
__exports["reproduceMatch"] = reproduceMatch;
};

// Finanças (seção 19). Duas partes:
//  1. Público (computeAttendance): calculado antes do jogo e guardado no MatchState.
//  2. Receitas e despesas por rodada (mais abaixo): primeira versão determinística e simples.
//
// Ocupação = 0,30 + 0,005 × reputação, limitada a 100%. O fator de momento (últimos 5 jogos) entra depois.

function computeAttendance(club      )         {
  const occupancy = Math.min(1, Math.max(0, 0.3 + 0.005 * club.reputation));
  return Math.round(club.stadium.capacity * occupancy);

// ---------- Receitas e despesas por rodada ----------
//
// Regras desta versão (todas em reais inteiros; nada de decimais em dinheiro):
//  - Bilheteria: só o mandante recebe, público × preço do ingresso da divisão dele.
//  - Cota de TV: todo clube que joga a rodada recebe o valor da sua divisão.
//  - Salários: soma dos salários do elenco, paga a cada rodada, em casa ou fora, lesionado ou não.
//  - Manutenção do estádio: R$ por lugar (capacidade atual) por rodada.
//  - Saldo do clube = Club.money; pode ficar negativo (as consequências vêm com o mercado).

class FinanceError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'FinanceError';
    this.code = code;
  }
}

                                  
                                         
                                                                      
 

                                
                                                                        
                                                                                      
                                                           
 

// Calibragem inicial: um clube médio de cada divisão fecha a temporada com margem de cerca de +8% sobre o custo.
// Clubes grandes e de torcida forte ganham mais; clubes pequenos com folha pesada entram no vermelho.
// Difere do exemplo ilustrativo da especificação (D3 a R$ 20 e TV R$ 50.000), que deixaria o clube médio com ~+27%.
const DEFAULT_FINANCE                = {
  byDivision: {
    D1: { ticketPrice: 40, tvRightsPerRound: 350_000 },
    D2: { ticketPrice: 25, tvRightsPerRound: 160_000 },
    D3: { ticketPrice: 15, tvRightsPerRound: 50_000 },
    D4: { ticketPrice: 8, tvRightsPerRound: 18_000 },
  },
  fallback: { ticketPrice: 8, tvRightsPerRound: 18_000 },
  upkeepPerSeatPerRound: 1,
};

/** O que uma partida (uma rodada) rende e custa a um clube. */
                                   
                 
                  
                
                                           
                        
                    
                                               
                   
                 
                                        
                                    
 

function divisionFinance(club      , cfg                = DEFAULT_FINANCE)                  {
  return cfg.byDivision[club.divisionId] ?? cfg.fallback;
}

/** Folha salarial de uma rodada: soma dos salários de todo o elenco. */
function payroll(club      , players                        )         {
  let total = 0;

}

}

function stadiumUpkeep(club      , cfg                = DEFAULT_FINANCE)         {
  return club.stadium.capacity * cfg.upkeepPerSeatPerRound;

function computeClubEntry(
  club      ,
  players                        ,
  match                                                        ,
  cfg                = DEFAULT_FINANCE,
)                   {
  const attendance = match.home ? match.attendance : 0;
  const ticket = match.home ? ticketRevenue(club, attendance, cfg) : 0;
  const tv = divisionFinance(club, cfg).tvRightsPerRound;
  const salaries = payroll(club, players);
  const upkeep = stadiumUpkeep(club, cfg);
  const revenue = ticket + tv;
  const expenses = salaries + upkeep;
  return {
    clubId: club.id,
    matchId: match.matchId,
    home: match.home,
    attendance,
    ticketRevenue: ticket,
    tvRevenue: tv,
    revenue,
    salaries,
    upkeep,
    expenses,
    net: revenue - expenses,
  };
}

/** Devolve o clube com o saldo atualizado; não altera o original. */
function applyEntry(club      , entry                  )       {

 * Fecha as finanças de uma rodada: cada clube que jogou recebe e paga o que lhe cabe.
 * Aplique UMA vez por rodada: aplicar de novo a mesma rodada cobraria tudo em dobro (quem controla isso é a camada de sessão).
 * Devolve novos clubes (os de fora da rodada seguem iguais) e o extrato, na ordem das partidas (mandante, visitante).

function settleRound(

  players                        ,
  results                        ,
  cfg                = DEFAULT_FINANCE,

  const ledger                     = [];
  const seen = new Set        ();

  for (const r of results) {
    for (const [clubId, home] of [[r.homeClubId, true], [r.awayClubId, false]]         ) {

    });

    t.ticketRevenue += e.ticketRevenue;
    t.tvRevenue += e.tvRevenue;
    t.revenue += e.revenue;
    t.salaries += e.salaries;
    t.upkeep += e.upkeep;
    t.expenses += e.expenses;
    t.net += e.net;
  }
  return out;
}

__exports["FinanceError"] = FinanceError;
__exports["divisionFinance"] = divisionFinance;
__exports["payroll"] = payroll;
__exports["ticketRevenue"] = ticketRevenue;
__exports["stadiumUpkeep"] = stadiumUpkeep;
__exports["computeClubEntry"] = computeClubEntry;
__exports["applyEntry"] = applyEntry;
__exports["settleRound"] = settleRound;
__exports["totalsByClub"] = totalsByClub;
__exports["DEFAULT_FINANCE"] = DEFAULT_FINANCE;
};

/**
 * Pontos corridos ida e volta (seção 18): turno pelo método do círculo, returno espelhado com mando invertido.
 * A ordem dos clubes é embaralhada com a seed: cada temporada tem um calendário diferente, mas reproduzível.
 */
function doubleRoundRobin(clubIds                   , seed        )                     {
  const n = clubIds.length;
  if (n < 2 || n % 2 !== 0) throw new Error('o calendário precisa de um número par de clubes');

  // Embaralhamento Fisher–Yates determinístico.
  const teams = [...clubIds];
  const rng = createRng(deriveSeed(seed, 'calendar'));
  for (let i = teams.length - 1; i > 0; i--) {
    const j = rng.int(0, i);
    [teams[i], teams[j]] = [teams[j], teams[i]];
  }

  const fixed = teams[n - 1];
  const rotating = teams.slice(0, n - 1);
  const m = n - 1;
  const firstHalf                     = [];
  for (let r = 0; r < m; r++) {
    const round                   = [];
    // O fixo alterna o mando a cada rodada.
    const opponent = rotating[r];
    round.push(r % 2 === 0 ? { home: fixed, away: opponent } : { home: opponent, away: fixed });
    for (let i = 1; i < n / 2; i++) {
      const a = rotating[(r + i) % m];
      const b = rotating[(r - i + m) % m];
      round.push(i % 2 === 1 ? { home: a, away: b } : { home: b, away: a });
    }
    firstHalf.push(round);
  }
  // Returno: mando invertido, com a ordem deslocada em 1 rodada (começa pelo espelho da 2ª rodada
  // e termina com o da 1ª). Assim ninguém faz 3 jogos seguidos no mesmo mando na virada do turno,
  // e não há revanche imediata entre a última rodada do turno e a primeira do returno.
  const secondHalf = firstHalf.map((_, j) => firstHalf[(j + 1) % m].map((f) => ({ home: f.away, away: f.home })));
  return [...firstHalf, ...secondHalf];
}

/** Maior sequência de jogos seguidos em casa ou fora de um clube (usada nos testes de qualidade do calendário). */
function longestHomeAwayRun(rounds                             , clubId        )         {
  let best = 0;
  let run = 0;
  let last                   = null;
  for (const round of rounds) {
    const f = round.find((x) => x.home === clubId || x.away === clubId);
    if (!f) continue;
    const venue = f.home === clubId ? 'H' : 'A';
    run = venue === last ? run + 1 : 1;
    last = venue;
    best = Math.max(best, run);
  }
  return best;
}

__exports["longestHomeAwayRun"] = longestHomeAwayRun;

const DEFAULT_POINTS             = { win: 3, draw: 1, loss: 0 };

function emptyRow(clubId        )              {
  return { clubId, played: 0, won: 0, drawn: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, goalDiff: 0, points: 0 };
}

function tally(clubIds                   , results                      , rule            )                           {
  const rows = new Map(clubIds.map((id) => [id, emptyRow(id)]));
  for (const r of results) {
    const h = rows.get(r.homeClubId);
    const a = rows.get(r.awayClubId);
    if (!h || !a) continue;
    h.played++;
    a.played++;
    h.goalsFor += r.homeGoals;
    h.goalsAgainst += r.awayGoals;
    a.goalsFor += r.awayGoals;
    a.goalsAgainst += r.homeGoals;
    if (r.homeGoals > r.awayGoals) {
      h.won++;
      a.lost++;
      h.points += rule.win;
      a.points += rule.loss;
    } else if (r.homeGoals < r.awayGoals) {
      a.won++;
      h.lost++;
      a.points += rule.win;
      h.points += rule.loss;
    } else {
      h.drawn++;
      a.drawn++;
      h.points += rule.draw;
      a.points += rule.draw;
    }

}

  return b.points - a.points || b.won - a.won || b.goalDiff - a.goalDiff || b.goalsFor - a.goalsFor;

  clubIds                   ,
  results                      ,
  tiebreakSeed        ,
  rule             = DEFAULT_POINTS,
)                {

  const drawKey = (id        ) => deriveSeed(tiebreakSeed, `desempate:${id}`);

    }
    out.push(...group);
    i = j;
  }
  return out;
}
