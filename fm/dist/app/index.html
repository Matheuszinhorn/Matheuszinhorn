__defs["engine/finance.ts"] = function (__exports, __req) {
                                                            

// Finanças (seção 19). Duas partes:
//  1. Público (computeAttendance): calculado antes do jogo e guardado no MatchState.
//  2. Receitas e despesas por rodada (mais abaixo): primeira versão determinística e simples.
//
// Ocupação = 0,30 + 0,005 × reputação, limitada a 100%. O fator de momento (últimos 5 jogos) entra depois.

function computeAttendance(club      )         {
  const occupancy = Math.min(1, Math.max(0, 0.3 + 0.005 * club.reputation));
  return Math.round(club.stadium.capacity * occupancy);
}

// ---------- Receitas e despesas por rodada ----------
//
// Regras desta versão (todas em reais inteiros; nada de decimais em dinheiro):
//  - Bilheteria: só o mandante recebe, público × preço do ingresso da divisão dele.
//  - Cota de TV: todo clube que joga a rodada recebe o valor da sua divisão.
//  - Salários: soma dos salários do elenco, paga a cada rodada, em casa ou fora, lesionado ou não.
//  - Manutenção do estádio: R$ por lugar (capacidade atual) por rodada.
//  - Saldo do clube = Club.money; pode ficar negativo (as consequências vêm com o mercado).
// Ficam para depois: premiação de fim de temporada, preço de ingresso ajustável, fator de momento no público.

class FinanceError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'FinanceError';
    this.code = code;
  }
}

                                  
                                         
                                                                      
 

                                
                                                                        
                                                                                      
                                                           
 

// Calibragem inicial: um clube médio de cada divisão fecha a temporada com margem de cerca de +8% sobre o custo.
// Clubes grandes e de torcida forte ganham mais; clubes pequenos com folha pesada entram no vermelho.
// Difere do exemplo ilustrativo da especificação (D3 a R$ 20 e TV R$ 50.000), que deixaria o clube médio com ~+27%.
const DEFAULT_FINANCE                = {
  byDivision: {
    D1: { ticketPrice: 40, tvRightsPerRound: 350_000 },
    D2: { ticketPrice: 25, tvRightsPerRound: 160_000 },
    D3: { ticketPrice: 15, tvRightsPerRound: 50_000 },
    D4: { ticketPrice: 8, tvRightsPerRound: 18_000 },
  },
  fallback: { ticketPrice: 8, tvRightsPerRound: 18_000 },
  upkeepPerSeatPerRound: 1,
};

/** O que uma partida (uma rodada) rende e custa a um clube. */
                                   
                 
                  
                
                                           
                        
                    
                                               
                   
                 
                                        
                                    
 

function divisionFinance(club      , cfg                = DEFAULT_FINANCE)                  {
  return cfg.byDivision[club.divisionId] ?? cfg.fallback;
}

/** Folha salarial de uma rodada: soma dos salários de todo o elenco. */
function payroll(club      , players                        )         {
  let total = 0;
  for (const id of club.squad) {
    const p = players[id];
    if (!p) throw new FinanceError('UNKNOWN_PLAYER', `jogador do elenco de ${club.id} não encontrado: ${id}`);
    total += p.salary;
  }
  return total;
}

function ticketRevenue(club      , attendance        , cfg                = DEFAULT_FINANCE)         {
  return attendance * divisionFinance(club, cfg).ticketPrice;
}

function stadiumUpkeep(club      , cfg                = DEFAULT_FINANCE)         {
  return club.stadium.capacity * cfg.upkeepPerSeatPerRound;
}

function computeClubEntry(
  club      ,
  players                        ,
  match                                                        ,
  cfg                = DEFAULT_FINANCE,
)                   {
  const attendance = match.home ? match.attendance : 0;
  const ticket = match.home ? ticketRevenue(club, attendance, cfg) : 0;
  const tv = divisionFinance(club, cfg).tvRightsPerRound;
  const salaries = payroll(club, players);
  const upkeep = stadiumUpkeep(club, cfg);
  const revenue = ticket + tv;
  const expenses = salaries + upkeep;
  return {
    clubId: club.id,
    matchId: match.matchId,
    home: match.home,
    attendance,
    ticketRevenue: ticket,
    tvRevenue: tv,
    revenue,
    salaries,
    upkeep,
    expenses,
    net: revenue - expenses,
  };
}

/** Devolve o clube com o saldo atualizado; não altera o original. */
function applyEntry(club      , entry                  )       {
  if (entry.clubId !== club.id) throw new FinanceError('WRONG_CLUB', `lançamento de ${entry.clubId} aplicado em ${club.id}`);
  return { ...club, money: club.money + entry.net };
}

/**
 * Fecha as finanças de uma rodada: cada clube que jogou recebe e paga o que lhe cabe.
 * Aplique UMA vez por rodada: aplicar de novo a mesma rodada cobraria tudo em dobro (quem controla isso é a camada de sessão).
 * Devolve novos clubes (os de fora da rodada seguem iguais) e o extrato, na ordem das partidas (mandante, visitante).
 */
function settleRound(
  clubs                      ,
  players                        ,
  results                        ,
  cfg                = DEFAULT_FINANCE,
)                                                              {
  const ledger                     = [];
  const seen = new Set        ();
  const next = { ...clubs };
  for (const r of results) {
    for (const [clubId, home] of [[r.homeClubId, true], [r.awayClubId, false]]         ) {
      const club = clubs[clubId];
      if (!club) throw new FinanceError('UNKNOWN_CLUB', `clube inexistente: ${clubId}`);
      if (seen.has(clubId)) throw new FinanceError('CLUB_TWICE_IN_ROUND', `${clubId} aparece duas vezes na mesma rodada`);
      seen.add(clubId);
      const entry = computeClubEntry(club, players, { matchId: r.matchId, home, attendance: r.attendance }, cfg);

      next[clubId] = applyEntry(club, entry);

}

                                    
                 
                 
                        
                    
                  
                   
                 
                   
              
 

/** Soma um extrato (várias rodadas) por clube. */
function totalsByClub(ledger                             )                                    {
  const out                                    = {};
  for (const e of ledger) {
    const t = (out[e.clubId] ??= {
      clubId: e.clubId, rounds: 0, ticketRevenue: 0, tvRevenue: 0, revenue: 0, salaries: 0, upkeep: 0, expenses: 0, net: 0,
    });
    t.rounds += 1;
    t.ticketRevenue += e.ticketRevenue;
    t.tvRevenue += e.tvRevenue;
    t.revenue += e.revenue;
    t.salaries += e.salaries;
    t.upkeep += e.upkeep;
    t.expenses += e.expenses;
    t.net += e.net;
  }
  return out;
}

__exports["computeAttendance"] = computeAttendance;
__exports["FinanceError"] = FinanceError;
__exports["divisionFinance"] = divisionFinance;
__exports["payroll"] = payroll;
__exports["ticketRevenue"] = ticketRevenue;
__exports["stadiumUpkeep"] = stadiumUpkeep;
__exports["computeClubEntry"] = computeClubEntry;
__exports["applyEntry"] = applyEntry;
__exports["settleRound"] = settleRound;
__exports["totalsByClub"] = totalsByClub;
__exports["DEFAULT_FINANCE"] = DEFAULT_FINANCE;
};

__defs["engine/season/calendar.ts"] = function (__exports, __req) {
const { createRng, deriveSeed } = __req("engine/rng.ts");

                                 
               
               
 

/**
 * Pontos corridos ida e volta (seção 18): turno pelo método do círculo, returno espelhado com mando invertido.
 * A ordem dos clubes é embaralhada com a seed: cada temporada tem um calendário diferente, mas reproduzível.
 */
function doubleRoundRobin(clubIds                   , seed        )                     {
  const n = clubIds.length;
  if (n < 2 || n % 2 !== 0) throw new Error('o calendário precisa de um número par de clubes');

  // Embaralhamento Fisher–Yates determinístico.
  const teams = [...clubIds];
  const rng = createRng(deriveSeed(seed, 'calendar'));
  for (let i = teams.length - 1; i > 0; i--) {
    const j = rng.int(0, i);
    [teams[i], teams[j]] = [teams[j], teams[i]];
  }

  const fixed = teams[n - 1];
  const rotating = teams.slice(0, n - 1);
  const m = n - 1;
  const firstHalf                     = [];
  for (let r = 0; r < m; r++) {
    const round                   = [];
    // O fixo alterna o mando a cada rodada.
    const opponent = rotating[r];
    round.push(r % 2 === 0 ? { home: fixed, away: opponent } : { home: opponent, away: fixed });
    for (let i = 1; i < n / 2; i++) {
      const a = rotating[(r + i) % m];
      const b = rotating[(r - i + m) % m];
      round.push(i % 2 === 1 ? { home: a, away: b } : { home: b, away: a });
    }
    firstHalf.push(round);
  }
  // Returno: mando invertido, com a ordem deslocada em 1 rodada (começa pelo espelho da 2ª rodada
  // e termina com o da 1ª). Assim ninguém faz 3 jogos seguidos no mesmo mando na virada do turno,
  // e não há revanche imediata entre a última rodada do turno e a primeira do returno.
  const secondHalf = firstHalf.map((_, j) => firstHalf[(j + 1) % m].map((f) => ({ home: f.away, away: f.home })));
  return [...firstHalf, ...secondHalf];
}

/** Maior sequência de jogos seguidos em casa ou fora de um clube (usada nos testes de qualidade do calendário). */
function longestHomeAwayRun(rounds                             , clubId        )         {
  let best = 0;
  let run = 0;
  let last                   = null;
  for (const round of rounds) {
    const f = round.find((x) => x.home === clubId || x.away === clubId);
    if (!f) continue;
    const venue = f.home === clubId ? 'H' : 'A';
    run = venue === last ? run + 1 : 1;
    last = venue;
    best = Math.max(best, run);
  }
  return best;
}

__exports["doubleRoundRobin"] = doubleRoundRobin;
__exports["longestHomeAwayRun"] = longestHomeAwayRun;
};

__defs["engine/season/standings.ts"] = function (__exports, __req) {
const { deriveSeed } = __req("engine/rng.ts");

// Classificação (seção 17). Desempate: pontos → vitórias → saldo → gols pró → confronto direto → sorteio com seed.

                              
                 
                 
              
                
               
                   
                       
                   
                 
 

                            
                     
                     
                    
                    
 

                             
              
               
               
 

const DEFAULT_POINTS             = { win: 3, draw: 1, loss: 0 };

function emptyRow(clubId        )              {
  return { clubId, played: 0, won: 0, drawn: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, goalDiff: 0, points: 0 };
}

function tally(clubIds                   , results                      , rule            )                           {
  const rows = new Map(clubIds.map((id) => [id, emptyRow(id)]));
  for (const r of results) {
    const h = rows.get(r.homeClubId);
    const a = rows.get(r.awayClubId);
    if (!h || !a) continue;
    h.played++;
    a.played++;
    h.goalsFor += r.homeGoals;
    h.goalsAgainst += r.awayGoals;
    a.goalsFor += r.awayGoals;
    a.goalsAgainst += r.homeGoals;
    if (r.homeGoals > r.awayGoals) {
      h.won++;
      a.lost++;
      h.points += rule.win;
      a.points += rule.loss;
    } else if (r.homeGoals < r.awayGoals) {
      a.won++;
      h.lost++;
      a.points += rule.win;
      h.points += rule.loss;
    } else {
      h.drawn++;
      a.drawn++;
      h.points += rule.draw;
      a.points += rule.draw;
    }
  }
  for (const row of rows.values()) row.goalDiff = row.goalsFor - row.goalsAgainst;
  return rows;
}

function compareMain(a             , b             )         {
  return b.points - a.points || b.won - a.won || b.goalDiff - a.goalDiff || b.goalsFor - a.goalsFor;
}

function computeStandings(
  clubIds                   ,
  results                      ,
  tiebreakSeed        ,
  rule             = DEFAULT_POINTS,
)                {
  const rows = [...tally(clubIds, results, rule).values()].sort(compareMain);
  const drawKey = (id        ) => deriveSeed(tiebreakSeed, `desempate:${id}`);

  // Grupos empatados nos critérios principais: confronto direto (mini-tabela), depois sorteio.
  const out                = [];
  for (let i = 0; i < rows.length; ) {
    let j = i + 1;
    while (j < rows.length && compareMain(rows[i], rows[j]) === 0) j++;
    const group = rows.slice(i, j);
    if (group.length > 1) {
      const ids = new Set(group.map((r) => r.clubId));
      const mini = tally([...ids], results.filter((r) => ids.has(r.homeClubId) && ids.has(r.awayClubId)), rule);
      group.sort((a, b) => {
        const ma = mini.get(a.clubId)               ;
        const mb = mini.get(b.clubId)               ;
        return mb.points - ma.points || (drawKey(a.clubId) < drawKey(b.clubId) ? -1 : 1);
      });
    }
    out.push(...group);
    i = j;
  }
  return out;
}

__exports["computeStandings"] = computeStandings;
__exports["DEFAULT_POINTS"] = DEFAULT_POINTS;
};

__defs["engine/season/promotion.ts"] = function (__exports, __req) {
                                                            
                                                  

// Promoção e rebaixamento (seção 17). Função pura: recebe as classificações finais e as regras,
// devolve as divisões da próxima temporada. Nada aqui conhece um campeonato específico:
// quantidade e destino de cada movimento vêm das regras.

class PromotionError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'PromotionError';
    this.code = code;
  }
}

                           
                
                                                               
 

                                
                                                                           
                      
                                                       
                       
 

/** Uma regra por divisão, indexada pelo id da divisão. */
                                                           

                                 
             
               
                            
                                                                                 
 

                                
                                       
 

                           
                 
                         
                       
                                 
                                                    
                    
 

                                  
                                                              
                                                                           
                        
 

/**
 * Regras usuais em escada: cada divisão promove `count` para a de cima e rebaixa `count` para a de baixo.
 * A primeira divisão não promove e a última não rebaixa.
 */
function standardRules(divisions                                          , count = 4)                 {
  const ordered = [...divisions].sort((a, b) => a.level - b.level);
  const rules                 = {};
  ordered.forEach((d, i) => {
    const above = ordered[i - 1];
    const below = ordered[i + 1];
    rules[d.id] = {
      promotion: above ? { count, destinationId: above.id } : { count: 0, destinationId: null },
      relegation: below ? { count, destinationId: below.id } : { count: 0, destinationId: null },
    };
  });
  return rules;
}

function validate(season               , rules                )       {
  const ids = new Set(season.divisions.map((d) => d.id));
  if (ids.size !== season.divisions.length) throw new PromotionError('DUPLICATE_DIVISION', 'há divisões com o mesmo id');
  for (const id of Object.keys(rules)) {
    if (!ids.has(id)) throw new PromotionError('UNKNOWN_DIVISION', `regra para uma divisão inexistente: ${id}`);
  }
  const seen = new Set        ();
  for (const d of season.divisions) {
    const rule = rules[d.id];
    if (!rule) throw new PromotionError('MISSING_RULE', `falta a regra da divisão ${d.id}`);
    for (const [name, move] of [['promoção', rule.promotion], ['rebaixamento', rule.relegation]]         ) {
      if (!Number.isInteger(move.count) || move.count < 0) throw new PromotionError('INVALID_COUNT', `${name} em ${d.id}: quantidade inválida`);
      if (move.count > 0) {
        if (move.destinationId === null || !ids.has(move.destinationId)) {
          throw new PromotionError('INVALID_DESTINATION', `${name} em ${d.id}: destino inexistente`);
        }
        if (move.destinationId === d.id) throw new PromotionError('INVALID_DESTINATION', `${name} em ${d.id}: o destino é a própria divisão`);
      }
    }
    if (rule.promotion.count + rule.relegation.count > d.standings.length) {
      throw new PromotionError('TOO_MANY_MOVES', `${d.id}: promoção + rebaixamento excede o número de clubes`);
    }
    for (const row of d.standings) {
      if (seen.has(row.clubId)) throw new PromotionError('DUPLICATE_CLUB', `clube repetido: ${row.clubId}`);
      seen.add(row.clubId);
    }
  }
}

/**
 * Produz as divisões da próxima temporada. Em cada divisão, primeiro ficam os clubes que permaneceram
 * (na ordem da tabela) e depois os que chegaram (vindos de cima e de baixo, na ordem dos movimentos).
 * O tamanho de cada divisão se mantém: o que sai de uma precisa entrar em outra, senão as regras são recusadas.
 */
function applyPromotionRelegation(season               , rules                )                  {
  validate(season, rules);

  const movements             = [];
  const champions                         = {};
  const moved = new Set        ();

  for (const d of season.divisions) {
    const rule = rules[d.id];
    const total = d.standings.length;
    if (total > 0) champions[d.id] = d.standings[0].clubId;
    if (rule.promotion.count > 0) {
      d.standings.slice(0, rule.promotion.count).forEach((row, i) => {
        movements.push({
          clubId: row.clubId,
          fromDivisionId: d.id,
          toDivisionId: rule.promotion.destinationId          ,
          kind: 'PROMOTED',
          position: i + 1,
          champion: i === 0,
        });
        moved.add(row.clubId);
      });
    }
    if (rule.relegation.count > 0) {
      const first = total - rule.relegation.count;
      d.standings.slice(first).forEach((row, i) => {
        movements.push({
          clubId: row.clubId,
          fromDivisionId: d.id,
          toDivisionId: rule.relegation.destinationId          ,
          kind: 'RELEGATED',
          position: first + i + 1,
          champion: false,
        });
        moved.add(row.clubId);
      });
    }
  }

  for (const d of season.divisions) {
    const out = movements.filter((m) => m.fromDivisionId === d.id).length;
    const incoming = movements.filter((m) => m.toDivisionId === d.id).length;
    if (out !== incoming) {
      throw new PromotionError('UNBALANCED', `${d.id}: saem ${out} clubes e entram ${incoming}; as regras alterariam o tamanho da divisão`);
    }
  }

  const divisions             = season.divisions.map((d) => ({
    id: d.id,
    name: d.name,
    level: d.level,
    clubIds: [
      ...d.standings.filter((row) => !moved.has(row.clubId)).map((row) => row.clubId),
      ...movements.filter((m) => m.toDivisionId === d.id).map((m) => m.clubId),
    ],
  }));

  return { divisions, champions, movements };
}

/** Novo mundo com as divisões da próxima temporada; o divisionId de cada clube acompanha. Não altera o original. */
function withDivisions(world       , divisions                     )        {
  const clubs = { ...world.clubs };
  for (const d of divisions) {
    for (const id of d.clubIds) {
      const club = clubs[id];
      if (!club) throw new PromotionError('UNKNOWN_CLUB', `clube inexistente no mundo: ${id}`);
      clubs[id] = { ...club, divisionId: d.id };
    }
  }
  return { ...world, divisions: divisions.map((d) => ({ ...d, clubIds: [...d.clubIds] })), clubs };
}

__exports["PromotionError"] = PromotionError;
__exports["standardRules"] = standardRules;
__exports["applyPromotionRelegation"] = applyPromotionRelegation;
__exports["withDivisions"] = withDivisions;
};

  // Cidades únicas para todos os clubes.

  for (const p of PLACE_PREFIX) for (const w of PLACE_WORD) places.push(`${p} ${w}`);
  for (let i = places.length - 1; i > 0; i--) {
    const j = rng.int(0, i);
    [places[i], places[j]] = [places[j], places[i]];
  }

  let clubSeq = 0;
  let playerSeq = 0;
  const usedNames = new Set        ();

  PROFILES.forEach((profile, level) => {
    const division           = { id: `D${level + 1}`, name: `${level + 1}ª Divisão`, level: level + 1, clubIds: [] };
    for (let c = 0; c < clubsPerDivision; c++) {
      clubSeq++;
      const id = `clb-${String(clubSeq).padStart(3, '0')}`;
      const city = places[clubSeq - 1];
      const type = rng.pick(CLUB_TYPE);
      const name = rng.next() < 0.5 ? `${type} ${city}` : `${city} ${type}`;
      const quality = between(rng, profile.strength);
      const capacity = Math.round(between(rng, profile.capacity) / 500) * 500;
      const primary = rng.pick(COLORS);
      const secondary = rng.pick(COLORS.filter((c2) => c2 !== primary));

      const squad           = [];
      for (const position of ['GK', 'DEF', 'MID', 'ATT']              ) {
        for (let k = 0; k < SQUAD_SHAPE[position]; k++) {
          playerSeq++;
          const pid = `ply-${String(playerSeq).padStart(4, '0')}`;
          // Nome + sobrenome; se repetir, ganha um segundo sobrenome. Tentativas limitadas: nunca trava.
          let pname = `${rng.pick(FIRST_NAMES)} ${rng.pick(LAST_NAMES)}`;
          for (let tries = 0; usedNames.has(pname) && tries < 50; tries++) {
            pname = `${rng.pick(FIRST_NAMES)} ${rng.pick(LAST_NAMES)} ${rng.pick(LAST_NAMES)}`;
          }
          if (usedNames.has(pname)) pname = `${pname} ${playerSeq}`;
          usedNames.add(pname);
          // Força em torno da qualidade do clube: soma de dois sorteios dá uma curva mais "normal".
          const strength = clampStrength(quality + (rng.next() + rng.next() - 1) * 8);
          players[pid] = {
            id: pid,
            name: pname,
            age: rng.int(17, 35),
            nationality: rng.next() < 0.9 ? 'Brasil' : rng.pick(['Argentina', 'Uruguai', 'Paraguai', 'Colômbia']),
            position,
            strength,
            temperament: rng.pick(TEMPERAMENTS),
            salary: Math.round((strength * profile.salaryPerPoint) / 100) * 100,
            marketValue: Math.round((strength * strength * profile.salaryPerPoint * 4) / 1000) * 1000,
            contract: { endSeason: 2026 + rng.int(0, 3) },
            clubId: id,
            condition: { injuryRounds: 0, suspensionRounds: 0, yellowCardsAccumulated: 0 },
          };
          squad.push(pid);
        }
      }

      const style        = 'BALANCED';
      const behavior           = rng.next() < 0.8 ? 'NORMAL' : rng.pick(['AGGRESSIVE', 'REACTIVE']              );
      clubs[id] = {
        id,
        name,
        // Sigla: 1ª letra do prefixo + 2 primeiras da palavra (ex.: Vila Aurora → VAU).
        shortName: (city.split(' ')[0].slice(0, 1) + city.split(' ')[1].slice(0, 2))
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toUpperCase(),
        primaryColor: primary,
        secondaryColor: secondary,
        country: 'Brasil',
        city,
        divisionId: division.id,
        stadium: { name: `Estádio ${city}`, capacity, maxCapacity: Math.round((capacity * 1.5) / 500) * 500 },
        money: Math.round(between(rng, profile.money) / 1000) * 1000,
        reputation: between(rng, profile.reputation),
        squad,
        defaultTactics: { formation: rng.pick(FORMATIONS), style, behavior },
        penaltyTakerId: null,
      };
      division.clubIds.push(id);
    }
    divisions.push(division);
  });
  return { seed, divisions, clubs, players };
}

__exports["generateWorld"] = generateWorld;
};

__defs["game/career.ts"] = function (__exports, __req) {

  DEFAULT_FINANCE,
  applyPromotionRelegation,
  autoLineup,
  createRng,
  deriveSeed,

  prepareFixture,

const { getStandings,                                     } = __req("game/queries.ts");

// Carreira (camada game/): junta os módulos que já existem (calendário, classificação, promoção, finanças, mundo, escalação)
// e faz o que faltava entre uma rodada e outra: aplicar lesões e suspensões, fechar as finanças UMA vez, virar a temporada.
// Funções puras: cada uma devolve uma carreira nova e nunca altera a recebida. Nada aqui conhece telas.
// O engine é o contrato: nenhuma regra de partida mora aqui.

const CAREER_VERSION = 1;
const ROUNDS_PER_SEASON = 38;
const FIRST_SEASON = 2026;
/** Suspensões (seção 14): vermelho = 1 rodada; 3 amarelos acumulados = 1 rodada. */
const YELLOW_LIMIT = 3;

class CareerError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'CareerError';
    this.code = code;
  }
}

                        
               
 

                               
                 
                     
                         
                       
                                    
                        
                                
                                                                            
                  
 

                              
                  
               
                 
               
                     
               
                                                                
                                               
                                                                                 
                      
                         
                                                                                                      
                            
                                                                                      
                                 
                                                                           
                                           
                          
 

// ---------- Criação ----------

/** Três clubes oferecidos ao treinador novo: um da 3ª divisão e dois da 4ª (a carreira começa por baixo). */
function careerOffers(seed        )           {
  const world = generateWorld(seed);
  const rng = createRng(deriveSeed(seed, 'ofertas'));
  const pool = (level        ) => (world.divisions.find((d) => d.level === level)?.clubIds ?? []).slice();
  const picks           = [];
  for (const level of [3, 4, 4]) {
    const options = pool(level).filter((id) => !picks.includes(id));
    picks.push(rng.pick(options));
  }
  return picks;
}

function buildSchedule(world       , seed        , season        )                                     {
  const schedule                                     = {};
  for (const d of world.divisions) schedule[d.id] = doubleRoundRobin(d.clubIds, deriveSeed(seed, `S${season}:${d.id}`));
  return schedule;
}

function createCareer(input                                                                      )              {
  const name = input.coachName.trim();
  if (name.length === 0) throw new CareerError('COACH_NAME', 'o treinador precisa de um nome');
  const world = generateWorld(input.seed);
  if (!world.clubs[input.clubId]) throw new CareerError('UNKNOWN_CLUB', `clube inexistente: ${input.clubId}`);
  const season = input.season ?? FIRST_SEASON;
  return {
    version: CAREER_VERSION,
    seed: input.seed,
    season,
    coach: { name },
    userClubId: input.clubId,
    world,
    schedule: buildSchedule(world, input.seed, season),
    roundNumber: 1,
    results: [],
    userLineup: null,
    userLedger: [],
    pendingPromotion: null,
    history: [],
  };
}

// ---------- Leitura ----------

function isSeasonOver(c             )          {
  return c.roundNumber > ROUNDS_PER_SEASON;
}

function userClub(c             )       {
  return c.world.clubs[c.userClubId];
}

/** Contexto das consultas (CLUBES, classificação): a mesma estrutura que game/queries.ts já espera. */
function clubsContext(c             , round                    = null)               {
  return {
    world: c.world,
    controlledClubId: c.userClubId,
    roundNumber: Math.min(c.roundNumber, ROUNDS_PER_SEASON),
    round,
    schedule: c.schedule,
    results: c.results,
    tiebreakSeed: undefined,
  };
}

/** Classificação atual da divisão (a mesma regra da tabela final, que decide acesso e rebaixamento). */
function divisionStandings(c             , divisionId        ) {
  return getStandings(clubsContext(c), divisionId);
}

// ---------- Escalação do jogador ----------

                                 
                 
                                                                                                   
                    
                   
 

/** A escalação que vai a campo: a do jogador, se ainda for válida; senão o melhor time disponível, mantendo formação e tática. */
function resolveUserLineup(c             )                 {
  const club = userClub(c);
  const chosen = c.userLineup;
  if (chosen) {
    const errors = validateLineup(chosen, club, c.world.players);
    if (errors.length === 0) return { lineup: chosen, adjusted: false, errors: [] };
    const auto = autoLineup(club, c.world.players, { formation: formationOf(chosen.starters), style: chosen.style, behavior: chosen.behavior });
    return { lineup: auto, adjusted: true, errors };
  }
  return { lineup: autoLineup(club, c.world.players, club.defaultTactics), adjusted: false, errors: [] };
}

/** Grava a escalação escolhida. Recusa escalação inválida (o motor nunca recebe uma). */
function withUserLineup(c             , lineup        )              {
  const errors = validateLineup(lineup, userClub(c), c.world.players);
  if (errors.length > 0) throw new CareerError('INVALID_LINEUP', errors.join('; '));
  return { ...c, userLineup: lineup };
}

// ---------- Rodada ----------

                            
                      
                  
               
                      
                           
                      
                          
 

const pad = (n        ) => String(n).padStart(2, '0');

/** Id estável de partida (seção 16): "T2026-D2-R05-P07". Mudar o formato muda as seeds. */
function matchIdFor(season        , level        , round        , pos        )         {
  return `T${season}-D${level}-R${pad(round)}-P${pad(pos)}`;
}

function scheduledFor(c             , round        ) {
  const out                                                    = [];
  for (const d of c.world.divisions) {
    (c.schedule[d.id][round - 1] ?? []).forEach((f, i) => out.push({ matchId: matchIdFor(c.season, d.level, round, i + 1), home: f.home, away: f.away }));
  }
  return out;
}

function planRound(c             )            {
  if (isSeasonOver(c)) throw new CareerError('SEASON_OVER', 'a temporada terminou: comece a próxima');
  const resolved = resolveUserLineup(c);
  const lineups = { [c.userClubId]: resolved.lineup };
  const fixtures = scheduledFor(c, c.roundNumber).map((m) => prepareFixture(m.matchId, c.world.clubs[m.home], c.world.clubs[m.away], c.world.players, lineups));
  const mine = scheduledFor(c, c.roundNumber).find((m) => m.home === c.userClubId || m.away === c.userClubId);
  if (!mine) throw new CareerError('NO_MATCH', 'o clube do jogador não joga nesta rodada');
  const roundId = `T${c.season}-R${pad(c.roundNumber)}`;
  return {
    roundNumber: c.roundNumber,
    roundId,
    seed: deriveSeed(c.seed, roundId),
    fixtures,
    controlledClubId: c.userClubId,
    userMatchId: mine.matchId,
    lineupAdjusted: resolved.adjusted,
  };
}

/** Lesões e suspensões (seção 13 e 14): quem ficou de fora cumpre uma rodada; depois entram os eventos novos desta rodada. */
function applyConditions(players                        , results                        )                         {
  const next                         = { ...players };
  const patch = (id        , fn                                                 ) => {
    const p = next[id];
    if (p) next[id] = { ...p, condition: fn(p.condition) };
  };
  for (const id of Object.keys(next)) {
    const c = next[id].condition;
    if (c.injuryRounds > 0 || c.suspensionRounds > 0) {
      patch(id, (x) => ({ ...x, injuryRounds: Math.max(0, x.injuryRounds - 1), suspensionRounds: Math.max(0, x.suspensionRounds - 1) }));
    }
  }
  for (const r of results) {
    for (const i of r.injuries) patch(i.playerId, (x) => ({ ...x, injuryRounds: Math.max(x.injuryRounds, i.rounds) }));
    for (const y of r.yellowCards) {
      patch(y.playerId, (x) => {
        const total = x.yellowCardsAccumulated + 1;
        return total >= YELLOW_LIMIT ? { ...x, yellowCardsAccumulated: 0, suspensionRounds: Math.max(x.suspensionRounds, 1) } : { ...x, yellowCardsAccumulated: total };
      });
    }
    for (const red of r.redCards) patch(red.playerId, (x) => ({ ...x, suspensionRounds: Math.max(x.suspensionRounds, 1) }));
  }
  return next;
}

                               
                      
                                                 
                           
                       
 

/** Fase de aplicação (seção 16): só depois que as 40 partidas terminam. Aplique UMA vez por rodada. */
function finishRound(c             , results                        )               {
  if (isSeasonOver(c)) throw new CareerError('SEASON_OVER', 'a temporada já terminou');
  const expected = scheduledFor(c, c.roundNumber).map((m) => m.matchId).sort();
  const got = results.map((r) => r.matchId).sort();
  if (expected.length !== got.length || expected.some((id, i) => id !== got[i])) {
    throw new CareerError('ROUND_MISMATCH', `os resultados não são os da rodada ${c.roundNumber}`);
  }
  const settled = settleRound(c.world.clubs, c.world.players, results, DEFAULT_FINANCE);
  const players = applyConditions(c.world.players, results);
  const played                = results.map((r) => ({ round: c.roundNumber, homeClubId: r.homeClubId, awayClubId: r.awayClubId, homeGoals: r.homeGoals, awayGoals: r.awayGoals }));
  const mine = settled.ledger.find((e) => e.clubId === c.userClubId);
  if (!mine) throw new CareerError('NO_LEDGER', 'o clube do jogador não aparece nos resultados');
  let career              = {
    ...c,
    world: { ...c.world, clubs: settled.clubs, players },
    results: [...c.results, ...played],
    userLedger: [...c.userLedger, mine],
    roundNumber: c.roundNumber + 1,
  };
  const seasonEnded = isSeasonOver(career);
  if (seasonEnded) career = closeSeason(career);
  return { career, ledger: mine, seasonEnded };
}

function closeSeason(c             )              {
  const ctx = clubsContext(c);
  const promotion = applyPromotionRelegation(
    { divisions: c.world.divisions.map((d) => ({ id: d.id, name: d.name, level: d.level, standings: getStandings(ctx, d.id) })) },
    standardRules(c.world.divisions),
  );
  const userDiv = userClub(c).divisionId;
  const table = getStandings(ctx, userDiv);
  const report               = {
    season: c.season,
    userClubId: c.userClubId,
    userDivisionId: userDiv,
    userPosition: table.findIndex((row) => row.clubId === c.userClubId) + 1,
    champions: promotion.champions,
    movements: promotion.movements,
    userMovement: promotion.movements.find((m) => m.clubId === c.userClubId) ?? null,
    userNet: c.userLedger.reduce((sum, e) => sum + e.net, 0),
  };
  return { ...c, pendingPromotion: promotion, history: [...c.history, report] };
}

/** Nova temporada: aplica acesso e rebaixamento, gera o calendário e zera resultados, extrato e cartões acumulados. */
function startNextSeason(c             )              {
  if (!isSeasonOver(c) || !c.pendingPromotion) throw new CareerError('SEASON_NOT_OVER', 'a temporada ainda não terminou');
  const moved = withDivisions(c.world, c.pendingPromotion.divisions);
  const players                         = {};
  for (const [id, p] of Object.entries(moved.players)) {
    players[id] = p.condition.yellowCardsAccumulated > 0 ? { ...p, condition: { ...p.condition, yellowCardsAccumulated: 0 } } : p;
  }
  const world        = { ...moved, players };
  const season = c.season + 1;
  return { ...c, world, season, schedule: buildSchedule(world, c.seed, season), roundNumber: 1, results: [], userLedger: [], pendingPromotion: null };
}

// ---------- Persistência ----------

function serializeCareer(c             )         {
  return JSON.stringify(c);
}

function deserializeCareer(json        )              {
  let data         ;
  try {
    data = JSON.parse(json);
  } catch {
    throw new CareerError('BAD_SAVE', 'o arquivo de carreira está corrompido');
  }
  const c = data                               ;
  if (!c || c.version !== CAREER_VERSION || !c.world || !c.schedule || !c.userClubId) throw new CareerError('BAD_SAVE', 'carreira salva em formato desconhecido');
  return c               ;
}

__defs["game/queries.ts"] = function (__exports, __req) {
const {
  autoLineup,
  clockLabel,
  computeAttendance,
  computeStandings,
  DEFAULT_CONFIG,
  formationLabel,
  formationOf,
  overallStrength,
  payroll,
                
             
            
                 
                  
                  
                   
              
                
                  
                      
              
                   
             
                 
             
} = __req("engine/index.ts");

// Consulta de clubes (seção 24): a área CLUBES da interface. Camada GAME, SOMENTE LEITURA.
//
//   ENGINE  →  GAME (session, queries)  →  APP
//
// Regras desta camada:
//  - só funções puras: recebem um contexto (dados do jogo) e devolvem objetos NOVOS; nada é alterado nem compartilhado;
//  - não conhece Command, não chama step/stepRound/applyCommand e não cria nem altera nenhuma decisão:
//    do engine importa apenas funções de leitura (escalação automática, força, classificação, público, folha);
//  - funciona igual para o clube controlado e para qualquer adversário, com a partida parada, em andamento ou
//    esperando uma decisão. A pausa da consulta é da sessão (openClubs/closeClubs); aqui não existe relógio.
//
// O que é público (decisão de implementação, ver seção 24 da especificação):
//  - jogador: nome, idade, nacionalidade, posição, força, valor de mercado, lesão e suspensão. NÃO: salário individual,
//    temperamento e contrato;
//  - finanças: capacidade, público estimado e folha salarial da rodada. O saldo exato só do clube controlado;
//    o dos demais aparece em faixas (BAIXO, MÉDIO, ALTO), por tercis entre todos os clubes do mundo.

class QueryError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'QueryError';
    this.code = code;
  }
}

// ---------- Contexto ----------

/** Uma partida já concluída em rodadas anteriores. */
                              
                                                    
                     
                     
                    
                    
 

                               
                        
                                           
                                                                                                      
                               
                                                                                                     
                                    
                                                    
                                                                                      
                                                                                                
                                           
                                                                                        
                                 
                                                        
                                  
 

// ---------- Visões ----------

                             
             
               
              
                      
                     
                   
                      
                        
                          
 

                                                      
                 
            
            
 

                             
                                                                                                                           
                          
                       
                         
               
                     
                                                                           
                   
                               
                      
                                 
                        
                        
                            
 

                                
                  
                      
                                                                                                       
                 
              
                
                     
                       
                                          
                     
 

                             
                
                     
                       
                
                   
                       
                           
 

                                
                
                
                     
                       
                                  
 

                                                    
                                                                                                  

                                                   
                   
                   
                        
 

                           
             
               
                    
                       
                         
                  
               
                                                               
                        
                     
                                                                                                 
                          
                      
                                                                                  
                            
                             
                     
                                                                                 
                                  
                                                                   
                                                                                          
 

                              
             
               
                    
                     
                       
                        
                          
                        
 

// ---------- Auxiliares (todos puros) ----------

const POSITION_ORDER                           = { GK: 0, DEF: 1, MID: 2, ATT: 3 };

function playerOf(ctx              , id        )         {
  const p = ctx.world.players[id];
  if (!p) throw new QueryError('UNKNOWN_PLAYER', `jogador inexistente no mundo: ${id}`);
  return p;
}

function clubOf(ctx              , id        )       {
  const c = ctx.world.clubs[id];
  if (!c) throw new QueryError('UNKNOWN_CLUB', `clube inexistente: ${id}`);
  return c;
}

function playerView(p        )             {
  return {
    id: p.id,
    name: p.name,
    age: p.age,
    nationality: p.nationality,
    position: p.position,
    strength: p.strength,
    marketValue: p.marketValue,
    injuredRounds: p.condition.injuryRounds,
    suspendedRounds: p.condition.suspensionRounds,
  };
}

function byPositionThenStrength(a            , b            )         {
  return (
    POSITION_ORDER[a.position] - POSITION_ORDER[b.position] || b.strength - a.strength || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)
  );
}

function slotView(ctx              , slot            )                   {
  return { ...playerView(playerOf(ctx, slot.playerId)), sector: slot.sector, x: slot.x, y: slot.y };
}

/** Força geral do melhor time disponível, ou null se não há 11 disponíveis. */
function bestStrength(ctx              , club      )                {
  try {
    const lineup = autoLineup(club, ctx.world.players, {}, DEFAULT_CONFIG);
    return overallStrength(lineup.starters, ctx.world.players, DEFAULT_CONFIG);
  } catch {
    return null;
  }
}

function liveMatchOf(ctx              , clubId        )                    {
  if (!ctx.round) return null;
  return ctx.round.matches.find((m) => m.home.clubId === clubId || m.away.clubId === clubId) ?? null;
}

/**
 * Minuto a mostrar. No fim do jogo (ou com uma decisão pendente depois do último minuto de acréscimo) o relógio interno
 * fica um minuto além do último jogado; a consulta mostra o último minuto realmente jogado.
 */
function shownClock(m            )        {
  const pastEnd =
    m.status === 'FINISHED' ||
    (m.clock.half === 2 && m.clock.minute === 90 && m.stoppage.second !== null && m.clock.added > m.stoppage.second && m.pendingPenalty === null);
  return pastEnd ? m.events[m.events.length - 1].clock : m.clock;
}

function roundInProgress(ctx              )          {
  return ctx.round !== null && ctx.round.matches.some((m) => m.status !== 'FINISHED');
}

function liveLineup(ctx              , team           )             {
  const starters = team.onField.map((slot) => slotView(ctx, slot));
  const view = (ids                   ) => ids.map((id) => playerView(playerOf(ctx, id))).sort(byPositionThenStrength);
  const formation = formationOf(team.onField);
  const rated = Object.fromEntries(team.onField.map((s) => [s.playerId, team.players[s.playerId]]));
  return {
    source: 'LIVE',
    formation,
    formationLabel: formationLabel(formation),
    style: team.style,
    behavior: team.behavior,
    strength: overallStrength(team.onField, rated, DEFAULT_CONFIG),
    starters,
    bench: view(team.bench),
    sentOff: view(team.sentOff),
    injured: view(team.injured),
    substitutionsUsed: team.subsUsed,
  };
}

function autoLineupView(ctx              , club      )                    {
  try {
    const lineup = autoLineup(club, ctx.world.players, {}, DEFAULT_CONFIG);
    const formation = formationOf(lineup.starters);
    return {
      source: 'AUTO',
      formation,
      formationLabel: formationLabel(formation),
      style: lineup.style,
      behavior: lineup.behavior,
      strength: overallStrength(lineup.starters, ctx.world.players, DEFAULT_CONFIG),
      starters: lineup.starters.map((slot) => slotView(ctx, slot)),
      bench: lineup.bench.map((id) => playerView(playerOf(ctx, id))).sort(byPositionThenStrength),
      sentOff: [],
      injured: [],
      substitutionsUsed: 0,
    };
  } catch {
    return null;
  }
}

function divisionResults(ctx              , clubIds                   )                {
  const ids = new Set(clubIds);
  return ctx.results.filter((r) => ids.has(r.homeClubId) && ids.has(r.awayClubId));

function tableFor(ctx              , divisionId        )                {

    homeClubId: r.homeClubId,
    awayClubId: r.awayClubId,
    homeGoals: r.homeGoals,
    awayGoals: r.awayGoals,
  }));
  return computeStandings(division.clubIds, results, ctx.tiebreakSeed ?? `classificacao:${divisionId}`);
}

function balanceOf(ctx              , club      )              {
  if (club.id === ctx.controlledClubId) return { kind: 'EXACT', amount: club.money };
  const all = Object.values(ctx.world.clubs);
  const below = all.filter((c) => c.money < club.money).length;
  const band              = below * 3 < all.length ? 'LOW' : below * 3 < 2 * all.length ? 'MEDIUM' : 'HIGH';
  return { kind: 'BAND', band };
}

function recentResultsOf(ctx              , clubId        )               {
  const limit = ctx.recentResults ?? 5;
  return ctx.results
    .filter((r) => r.homeClubId === clubId || r.awayClubId === clubId)
    .sort((a, b) => b.round - a.round)
    .slice(0, limit)
    .map((r) => {
      const home = r.homeClubId === clubId;
      const goalsFor = home ? r.homeGoals : r.awayGoals;
      const goalsAgainst = home ? r.awayGoals : r.homeGoals;
      const opponentId = home ? r.awayClubId : r.homeClubId;
      return {
        round: r.round,
        opponentId,
        opponentName: clubOf(ctx, opponentId).name,
        home,
        goalsFor,
        goalsAgainst,
        outcome: goalsFor > goalsAgainst ? 'W' : goalsFor < goalsAgainst ? 'L' : 'D',
      };
    });
}

function nextMatchOf(ctx              , club      )                       {
  const rounds = ctx.schedule[club.divisionId];
  if (!rounds) return null;
  // Com uma rodada em andamento, o próximo jogo é o da rodada seguinte; sem ela, o da rodada indicada.
  const first = roundInProgress(ctx) ? ctx.roundNumber : ctx.roundNumber - 1;
  for (let i = Math.max(0, first); i < rounds.length; i++) {
    const m = rounds[i].find((x) => x.home === club.id || x.away === club.id);
    if (!m) continue;
    const home = m.home === club.id;
    const opponent = clubOf(ctx, home ? m.away : m.home);

// ---------- API pública ----------

/** Visão pública de um clube. Igual para o clube controlado e para qualquer adversário. */
function getClubView(ctx              , clubId        )           {
  const club = clubOf(ctx, clubId);
  const division = ctx.world.divisions.find((d) => d.id === club.divisionId) ?? null;

  const match = liveMatchOf(ctx, clubId);
  const team = match ? (match.home.clubId === clubId ? match.home : match.away) : null;
  let live                       = null;
  if (match && team) {
    const home = match.home.clubId === clubId;
    const opponent = home ? match.away : match.home;
    const shown = shownClock(match);
    live = {
      matchId: match.matchId,
      status: match.status,
      minute: clockLabel(shown),
      half: shown.half,
      home,
      opponentId: opponent.clubId,
      opponentName: opponent.name,
      score: { for: home ? match.score.home : match.score.away, against: home ? match.score.away : match.score.home },
      attendance: match.attendance,
    };
  }

  let standing                       = null;
  if (division) {
    const table = tableFor(ctx, division.id);
    const idx = table.findIndex((r) => r.clubId === clubId);
    if (idx !== -1) standing = { ...table[idx], position: idx + 1, clubsInDivision: table.length };
  }

  return {
    id: club.id,
    name: club.name,
    shortName: club.shortName,
    primaryColor: club.primaryColor,
    secondaryColor: club.secondaryColor,
    country: club.country,
    city: club.city,
    division: division ? { id: division.id, name: division.name, level: division.level } : null,
    isControlled: club.id === ctx.controlledClubId,
    reputation: club.reputation,
    strength: bestStrength(ctx, club),
    squad: club.squad.map((id) => playerView(playerOf(ctx, id))).sort(byPositionThenStrength),
    lineup: team ? liveLineup(ctx, team) : autoLineupView(ctx, club),
    live,
    form: recentResultsOf(ctx, clubId),
    standing,
    nextMatch: nextMatchOf(ctx, club),
    stadium: { name: club.stadium.name, capacity: club.stadium.capacity, maxCapacity: club.stadium.maxCapacity },
    finance: {
      payrollPerRound: payroll(club, ctx.world.players),
      estimatedAttendance: computeAttendance(club),
      balance: balanceOf(ctx, club),
    },
  };
}

/** Classificação de uma divisão (rodadas concluídas). */
function getStandings(ctx              , divisionId        )                 {
  return tableFor(ctx, divisionId).map((row, i) => {
    const club = clubOf(ctx, row.clubId);
    return { ...row, position: i + 1, clubName: club.name, isControlled: club.id === ctx.controlledClubId };
  });
}

/** Lista de todos os clubes, para o menu da área CLUBES: por divisão (do topo para baixo) e por nome. */
function listClubs(ctx              )                {
  const out                = [];
  for (const d of ctx.world.divisions) {
    for (const id of d.clubIds) {
      const club = clubOf(ctx, id);
      out.push({
        id: club.id,
        name: club.name,
        shortName: club.shortName,
        divisionId: d.id,
        divisionName: d.name,
        divisionLevel: d.level,
        strength: bestStrength(ctx, club),
        isControlled: club.id === ctx.controlledClubId,
      });
    }
  }
  return out.sort((a, b) => a.divisionLevel - b.divisionLevel || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
}

__exports["getStandings"] = getStandings;

const { DEFAULT_CONFIG, autoLineup, formationOf,                                                                                } = __req("engine/index.ts");

// Edição da escalação no MEU TIME. Funções puras: devolvem uma escalação nova; a validação final (exatamente 1 goleiro,
// 11 titulares, disponíveis...) é do engine (validateLineup), aplicada por withUserLineup na carreira.

class LineupEditError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'LineupEditError';
    this.code = code;
  }
}

const isStarter = (l        , id        ) => l.starters.some((s) => s.playerId === id);

/**
 * Troca dois jogadores. Titular ↔ titular: trocam de posição. Titular ↔ reserva (ou jogador fora da lista): o de fora
 * assume a posição do titular e o titular vai para o banco. O banco respeita o limite da configuração (o mais fraco que não é
 * goleiro sai da lista se estourar).
 */
function swapPlayers(lineup        , players                        , aId        , bId        )         {
  if (aId === bId) return lineup;
  if (isStarter(lineup, aId) && isStarter(lineup, bId)) {
    return { ...lineup, starters: lineup.starters.map((s) => (s.playerId === aId ? { ...s, playerId: bId } : s.playerId === bId ? { ...s, playerId: aId } : s)) };
  }
  let [starterId, otherId] = [aId, bId];
  if (!isStarter(lineup, starterId)) [starterId, otherId] = [bId, aId];
  if (!isStarter(lineup, starterId)) throw new LineupEditError('NO_STARTER', 'um dos dois jogadores precisa ser titular');
  const starters = lineup.starters.map((s) => (s.playerId === starterId ? { ...s, playerId: otherId } : s));
  let bench = lineup.bench.includes(otherId) ? lineup.bench.map((id) => (id === otherId ? starterId : id)) : [...lineup.bench, starterId];
  while (bench.length > DEFAULT_CONFIG.maxBench) {
    const droppable = bench.filter((id) => id !== starterId && players[id]?.position !== 'GK');
    const weakest = droppable.sort((x, y) => players[x].strength - players[y].strength)[0];
    if (!weakest) break;
    bench = bench.filter((id) => id !== weakest);
  }
  const penaltyTakerId = lineup.penaltyTakerId === starterId ? null : lineup.penaltyTakerId;
  return { ...lineup, starters, bench, penaltyTakerId };
}

function setTactics(lineup        , tactics                                        )         {
  return { ...lineup, style: tactics.style ?? lineup.style, behavior: tactics.behavior ?? lineup.behavior };
}

function setPenaltyTaker(lineup        , playerId               )         {
  if (playerId !== null && !isStarter(lineup, playerId)) throw new LineupEditError('NOT_STARTER', 'o batedor de pênalti precisa ser titular');
  return { ...lineup, penaltyTakerId: playerId };
}

/** Nova formação: o jogo remonta o melhor time disponível nela, mantendo estilo, comportamento e batedor (se ainda titular). */
function applyFormation(club      , players                        , lineup        , formation           )         {
  const auto = autoLineup(club, players, { formation, style: lineup.style, behavior: lineup.behavior });
  const keep = lineup.penaltyTakerId !== null && auto.starters.some((s) => s.playerId === lineup.penaltyTakerId);
  return { ...auto, penaltyTakerId: keep ? lineup.penaltyTakerId : null };
}

/** O melhor time disponível na formação atual (botão MELHOR TIME). */
function bestLineup(club      , players                        , lineup        )         {
  return applyFormation(club, players, lineup, formationOf(lineup.starters));
}

};

  awaitingMatch,
  createRound,

// Sessão de jogo (seções 23 e 26). Fica ENTRE o engine e a interface:
//   ENGINE  →  GAME (esta camada)  →  INTERFACE (futura)
//
// A sessão decide QUANDO chamar stepRound. É só isso que a velocidade faz.
// O engine não conhece velocidade, relógio real, pausa de interface nem telas.
//
// Determinismo: mesma seed + mesmos dados + mesmas decisões do jogador = mesmo resultado,
// em qualquer velocidade, com qualquer número de pausas.

// ---------- Velocidades ----------

/** Identificadores em inglês no código; o rótulo em português é o que a interface mostra. */
                                                                           

                            
                
                                                                                                            
                     
 

const SPEEDS                             = {
  SLOW: { label: 'LENTA', intervalMs: 1000 },
  NORMAL: { label: 'NORMAL', intervalMs: 500 },
  FAST: { label: 'RÁPIDA', intervalMs: 250 },
  VERY_FAST: { label: 'MUITO RÁPIDA', intervalMs: 100 },
  INSTANT: { label: 'INSTANTÂNEA', intervalMs: 0 },
};

const SPEED_ORDER            = ['SLOW', 'NORMAL', 'FAST', 'VERY_FAST', 'INSTANT'];

// ---------- Temporizador injetável ----------

                            
                                                        
                                      
 

/** Temporizador real. Nos testes, injete um temporizador falso que avança o tempo à mão. */
const systemScheduler            = {
  setTimeout: (callback, ms) => globalThis.setTimeout(callback, ms),
  clearTimeout: (handle) => globalThis.clearTimeout(handle                                            ),
};

// ---------- Estado ----------

                           
                        
                                                
             
                                                     
                                                                 
                     

/** Por que a rodada está parada, do ponto de vista da interface. Decisões obrigatórias não entram aqui: vêm do engine. */
                                           

                                  
                  
                     
 

                                  
                        
                           
                                  
                 
                        
                                  
 

                                  
                  
               
                               
                                   
 

                              
                                 
                           
                
                      
 

class SessionError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'SessionError';
    this.code = code;
  }
}

                          
                              
                                                                       
                                           
               
                
                 
                    
                     
                                 
                                                                               
                                                                   
                                                                                     
                                                                                  
                                                                                  
                                                                                                
                                            
                           
                  
 

                                 
                        
                  
 

// Nunca chega perto disso: 90 minutos + acréscimos (máx. 8 + 8) + extensões de pênalti.
const MAX_STEPS = 1000;

function createSession(options                 = {})          {
  const scheduler = options.scheduler ?? systemScheduler;
  let speed          = options.speed ?? 'NORMAL';
  let round                    = null;
  let controlledClubId                = null;
  let playing = false;
  const pauses = new Set             ();
  let timer          = null;
  let commandSeq = 0;
  let disposed = false;
  const listeners = new Set                                     ();

  // ----- leitura -----

  function pendingDecision()                         {
    if (!round) return null;
    const match = awaitingMatch(round);
    return match && match.decision ? { matchId: match.matchId, decision: match.decision } : null;
  }

  function statusOf()                {
    if (!round) return 'IDLE';
    if (isRoundFinished(round)) return 'ROUND_FINISHED';
    if (awaitingMatch(round)) return 'AWAITING_DECISION';
    if (pauses.size > 0) return 'PAUSED';
    return playing ? 'PLAYING' : 'READY';
  }

  function snapshot()                  {
    return { status: statusOf(), round, controlledClubId, speed, pauses: [...pauses], pending: pendingDecision() };
  }

  function emit()       {
    if (disposed) return;
    const snap = snapshot();
    for (const listener of [...listeners]) listener(snap);
  }

  // ----- o laço de avanço: a única coisa que a velocidade controla -----

  function canAdvance()          {
    return !disposed && round !== null && playing && pauses.size === 0 && !isRoundFinished(round) && !awaitingMatch(round);
  }

  function cancelTimer()       {
    if (timer !== null) {
      scheduler.clearTimeout(timer);
      timer = null;
    }
  }

  function tick()       {
    timer = null;
    if (!canAdvance()) return;
    round = stepRound(round              );
    emit();
    scheduleNext();
  }

  /** INSTANTÂNEA: sem espera. Avança até a próxima decisão, pausa ou o fim, e avisa uma única vez. */
  function runWithoutWaiting()       {
    let stepped = 0;
    while (canAdvance()) {
      if (++stepped > MAX_STEPS) throw new SessionError('RUNAWAY', 'a rodada não terminou');
      round = stepRound(round              );
    }
    if (stepped > 0) emit();
  }

  function scheduleNext()       {
    cancelTimer();
    if (!canAdvance()) return;
    if (SPEEDS[speed].intervalMs === 0) runWithoutWaiting();
    else timer = scheduler.setTimeout(tick, SPEEDS[speed].intervalMs);
  }

  // ----- comandos -----

  function nextCommandId(matchId        , override         )         {
    return override ?? `${matchId}:c${++commandSeq}`;
  }

  function requireRound()             {
    if (!round) throw new SessionError('NO_ROUND', 'não há rodada em andamento');
    return round;
  }

  function controlledMatchId()         {
    const r = requireRound();
    if (!controlledClubId) throw new SessionError('NO_CONTROLLED_CLUB', 'não há clube controlado nesta rodada');
    const match = r.matches.find((m) => m.home.clubId === controlledClubId || m.away.clubId === controlledClubId);
    if (!match) throw new SessionError('UNKNOWN_CLUB', `o clube controlado não joga esta rodada: ${controlledClubId}`);
    return match.matchId;
  }

  function dispatch(command         )                {
    const r = requireRound();
    const match = r.matches.find((m) => m.home.clubId === command.clubId || m.away.clubId === command.clubId);
    if (!match) throw new SessionError('UNKNOWN_CLUB', `o clube ${command.clubId} não joga esta rodada`);
    const applied = applyRoundCommand(r, match.matchId, command);
    round = applied.round;
    emit();
    scheduleNext(); // se a decisão foi resolvida e a rodada estava em andamento, volta a andar
    return applied.result;
  }

  function pendingOfType(...types                    )                  {
    const pending = pendingDecision();
    if (!pending) throw new SessionError('NO_DECISION', 'não há decisão pendente');
    if (!types.includes(pending.decision.type)) {
      throw new SessionError('WRONG_DECISION', `a decisão pendente é ${pending.decision.type}`);
    }
    return pending;
  }

  return {
    getState: snapshot,

    subscribe(listener) {
      listeners.add(listener);
      return () => {
        listeners.delete(listener);
      };
    },

    startRound(input) {
      if (round && !isRoundFinished(round)) throw new SessionError('ROUND_IN_PROGRESS', 'a rodada anterior ainda não terminou');
      cancelTimer();
      controlledClubId = input.controlledClubId ?? null;
      round = createRound(input.roundId, input.seed, input.fixtures, controlledClubId);
      playing = false;
      pauses.clear();
      commandSeq = 0;
      emit();
    },

    play() {
      requireRound();
      playing = true;
      emit();
      scheduleNext();
    },

    pause() {
      pauses.add('USER');
      cancelTimer();
      emit();
    },

    resume() {
      pauses.delete('USER');
      emit();
      scheduleNext();
    },

    openClubs() {
      pauses.add('CLUBS');
      cancelTimer();
      emit();
    },

    closeClubs() {
      pauses.delete('CLUBS');
      emit();
      scheduleNext();
    },

    setSpeed(next) {
      if (!(next in SPEEDS)) throw new SessionError('INVALID_SPEED', `velocidade desconhecida: ${String(next)}`);
      speed = next;
      emit();
      scheduleNext(); // reprograma com o novo intervalo; nada do jogo muda
    },

    openTeamAdjustment(opts) {
      const matchId = controlledMatchId();
      return dispatch({ type: 'OPEN_TEAM_ADJUSTMENT', commandId: nextCommandId(matchId, opts?.commandId), clubId: controlledClubId           });
    },

    choosePenaltyTaker(playerId, opts) {
      const { matchId, decision } = pendingOfType('PENALTY_TAKER');
      return dispatch({
        type: 'CHOOSE_PENALTY_TAKER',
        commandId: nextCommandId(matchId, opts?.commandId),
        clubId: decision.clubId,
        decisionId: decision.id,
        playerId,
      });
    },

    adjustTeam(changes = {}, opts) {
      const { matchId, decision } = pendingOfType('INJURY_SUBSTITUTION', 'RED_CARD_ADJUSTMENT', 'TEAM_ADJUSTMENT');
      return dispatch({
        type: 'ADJUST_TEAM',
        commandId: nextCommandId(matchId, opts?.commandId),
        clubId: decision.clubId,
        decisionId: decision.id,
        substitutions: changes.substitutions ?? [],
        positions: changes.positions,
        style: changes.style,
        behavior: changes.behavior,
      });
    },

    dispatch,

    results() {
      return round ? roundResults(round) : [];
    },

    dispose() {
      disposed = true;
      cancelTimer();
      listeners.clear();
    },
  };
}

__exports["SessionError"] = SessionError;
__exports["createSession"] = createSession;
__exports["SPEEDS"] = SPEEDS;
__exports["SPEED_ORDER"] = SPEED_ORDER;
__exports["systemScheduler"] = systemScheduler;
};

__defs["app/src/dom.ts"] = function (__exports, __req) {
// Utilitários mínimos de DOM (sem framework: o ambiente de build não tem npm). Nenhuma regra de futebol mora aqui.

                                                                                
                                                   

/** Cria um elemento. Propriedades: class, on<Evento>, data-*, aria-*, disabled/checked/value e demais atributos. */
function h(tag        , props        , ...children         )              {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') el.className = String(value);
    else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2).toLowerCase(), value                 );
    else if (key === 'value') (el                    ).value = String(value);
    else if (value === true) el.setAttribute(key, '');
    else el.setAttribute(key, String(value));
  }
  append(el, children);
  return el;
}

function append(parent      , children         )       {
  for (const c of children) {
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) append(parent, c);
    else parent.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
}

/** Troca o conteúdo de root, preservando a rolagem dos elementos marcados com data-keep="nome". */
function render(root             , ...children         )       {
  const kept = new Map                ();
  root.querySelectorAll             ('[data-keep]').forEach((e) => kept.set(e.dataset.keep          , e.scrollTop));
  root.replaceChildren();
  append(root, children);
  root.querySelectorAll             ('[data-keep]').forEach((e) => {
    const top = kept.get(e.dataset.keep          );
    if (top !== undefined) e.scrollTop = top;
  });
}

__exports["render"] = render;
};

    const tone = mine > theirs ? 'good' : mine === theirs ? 'blue' : 'red';
    const scorers = m.events.filter((e) => e.type === 'GOAL' || e.type === 'PENALTY_GOAL');

      h(
        'div',
        { class: 'match-card' },
        h('div', { class: 'result-flag' }, badge(result, tone === 'good' ? 'green' : tone === 'red' ? 'red' : 'blue')),
        scoreboard(m, club.id, 'FIM DE JOGO', 'end'),
        scorers.length ? h('ul', { class: 'scorers' }, scorers.map((e) => h('li', null, `${eventClock(e.clock)} ${shortName(m[e.side ].players[e.playerId ?? '']?.name ?? 'Jogador')} (${m[e.side ].name})`))) : h('p', { class: 'muted center' }, 'Sem gols.'),
      ),
    );
  }
  parts.push(h('div', { class: 'cta' }, btn(over ? `INICIAR TEMPORADA ${career.season + 1}` : 'PRÓXIMA RODADA', () => ctrl.nextRound(), { kind: 'primary', big: true })));
  if (over) parts.push(seasonCard(ctrl));
  if (outcome) {
    const l = outcome.ledger;
    parts.push(
      card(
        'Finanças da rodada',
        h('div', { class: 'stats' }, stat('Público', num(l.attendance)), stat('Bilheteria', signedMoney(l.ticketRevenue)), stat('Cota de TV', signedMoney(l.tvRevenue)), stat('Salários', signedMoney(-l.salaries)), stat('Manutenção', signedMoney(-l.upkeep)), stat('Resultado', signedMoney(l.net), l.net >= 0 ? 'good' : 'bad')),

  parts.push(card('Resultados da rodada', roundBoard(ctrl, m?.matchId ?? null)));

function seasonCard(ctrl                )              {
  const career = ctrl.state.career ;
  const r = career.history[career.history.length - 1];
  if (!r) return card(null, empty('Temporada encerrada.'));
  const name = (id        ) => career.world.clubs[id].name;
  const divName = (id        ) => career.world.divisions.find((d) => d.id === id)?.name ?? id;
  const mv = r.userMovement;
  return card(
    `FIM DE TEMPORADA ${r.season}`,
    h('p', { class: 'season-line' }, `Você terminou em ${r.userPosition}º lugar na ${divName(r.userDivisionId)}.`),
    mv ? h('p', { class: mv.kind === 'PROMOTED' ? 'good' : 'bad' }, mv.kind === 'PROMOTED' ? `ACESSO! Você sobe para a ${divName(mv.toDivisionId)}${mv.champion ? ' como campeão' : ''}.` : `REBAIXAMENTO. Você cai para a ${divName(mv.toDivisionId)}.`) : h('p', { class: 'muted' }, 'Você permanece na mesma divisão.'),
    h('p', { class: 'muted' }, `Saldo financeiro da temporada: ${signedMoney(r.userNet)}`),
    h('h4', null, 'Campeões'),
    h('ul', { class: 'plain' }, Object.entries(r.champions).map(([div, id]) => h('li', null, `${divName(div)}: ${name(id)}`))),
    h('p', { class: 'muted small' }, `${plural(r.movements.filter((x) => x.kind === 'PROMOTED').length, 'clube sobe', 'clubes sobem')} e ${plural(r.movements.filter((x) => x.kind === 'RELEGATED').length, 'desce', 'descem')} entre as divisões.`),

function renderMatch(ctrl                )              {
  const phase = ctrl.state.phase;
  return phase === 'PRE' ? renderPre(ctrl) : phase === 'LIVE' ? renderLive(ctrl) : renderPost(ctrl);
}
