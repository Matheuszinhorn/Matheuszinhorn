      else drafts.push(draft('NOTICIA', 'Clube quita um empréstimo bancário', { clubId: userId, mine: true }));
    }
    m = { ...m, finance: { ...m.finance, loans } };
  }

  // obras concluídas
  if (userId) {
    const done = m.stadium.works.filter((w) => w.doneAtRound <= abs);
    if (done.length) {
      let world = c.world;
      const levels = { ...m.stadium.levels };
      for (const w of done) {
        levels[w.upgrade] = w.level;
        world = { ...world, clubs: { ...world.clubs, [userId]: applyWork(world.clubs[userId], w.upgrade) } };
        drafts.push(draft('NOTICIA', `Obra concluída: ${upgradeInfo(w.upgrade).label} (nível ${w.level})`, { clubId: userId, mine: true }));
      }
      c = { ...c, world };
      m = { ...m, stadium: { levels, works: m.stadium.works.filter((w) => w.doneAtRound > abs) } };
    }
  }

  // leilões que fecham nesta rodada
  ({ c, m } = closeAuctions(c, m, abs, round, drafts, extras));

  // negociações abertas caem quando a janela fecha
  if (!windowOpen(c.roundNumber, isSeasonOver(c))) {
    const open = m.market.negotiations.filter((n) => n.status === 'OPEN' || n.status === 'COUNTER');
    if (open.length) {
      m = { ...m, market: { ...m.market, negotiations: m.market.negotiations.map((n) => (n.status === 'OPEN' || n.status === 'COUNTER' ? { ...n, status: 'CANCELLED'         , message: 'A janela fechou.' } : n)) } };
      drafts.push(draft('NOTICIA', 'Janela de transferências fechada: negociações em aberto foram encerradas', { clubId: userId, mine: true }));
    }
  }

  // aplica o dinheiro extra
  const extraTotal = extras.reduce((s, e) => s + e.amount, 0);
  if (userId && extraTotal !== 0) c = { ...c, world: addMoney(c.world, userId, extraTotal) };
  m = { ...m, finance: { ...m.finance, ledger: [...m.finance.ledger, ...extras] } };

  // notícias da rodada
  const top = [...c.world.divisions].sort((a, b) => a.level - b.level)[0]?.id ?? null;
  drafts.unshift(...roundNews(c.world, matches, userId, top));

  // moral do treinador
  let fired = false;
  if (userId) {
    const letter = recentForm(c.results, userId, 1)[0];
    const table = divisionStandings(c, c.world.clubs[userId].divisionId);
    const pos = table.findIndex((r) => r.clubId === userId) + 1;
    const target = m.objective?.target ?? 20;
    const before = m.morale;
    let morale = letter ? moraleAfterRound(m.morale, letter, round, pos, target) : m.morale;
    const last4 = recentForm(c.results, userId, 4).filter((x) => x === 'D').length;
    if (last4 >= 3 && before >= 35 && morale < 35) drafts.push(draft('OPINIAO', 'Pressão aumenta: diretoria cobra reação depois de três derrotas', { clubId: userId, mine: true }));
    if (!out.seasonEnded && round >= 10 && morale < FIRING_MORALE) {
      ({ c, m } = fire(c, { ...m, morale }, round, drafts));
      fired = true;
      morale = mgr(c).morale;
    }
    if (!fired) m = { ...m, morale };
  }

  // técnicos da CPU
  const cpu = cpuCoachChanges(c, m.coaches, round);
  m = { ...m, coaches: cpu.coaches };
  for (const ch of cpu.changes) {
    drafts.push(draft('URGENTE', `${c.world.clubs[ch.clubId].name} demite ${ch.out}; ${ch.in} é o novo técnico`, { clubId: ch.clubId }));
  }

  // propostas de emprego (treinador sem clube) e validade das abertas
  m = expireOffers(m, abs);
  if (!c.userClubId && !out.seasonEnded) ({ m } = organicOffers(c, m, round, cpu.changes.map((x) => x.clubId), drafts));

  // análise a cada 5 rodadas: líderes das divisões
  if (round % 5 === 0 && !out.seasonEnded) {
    for (const d of [...c.world.divisions].sort((a, b) => a.level - b.level).slice(0, 2)) {
      const lead = divisionStandings(c, d.id)[0];
      if (lead) drafts.push(draft('ANALISE', `${d.name}: ${lead.clubName} lidera com ${lead.points} pontos após ${round} rodadas`, { clubId: lead.clubId, mine: lead.clubId === userId }));
    }
  }

  if (out.seasonEnded && !fired) {
    // premiação e bônus entram no caixa dentro de closeManagedSeason; aqui só vão para o extrato
    const n0 = extras.length;
    ({ c, m } = closeManagedSeason(c, m, drafts, extras));
    m = { ...m, finance: { ...m.finance, ledger: [...m.finance.ledger, ...extras.slice(n0)] } };
    if (c.userClubId && m.morale < 20) {
      ({ c, m } = fire(c, m, ROUNDS, drafts));
      fired = true;
    }
  }

  const newsBefore = m.newsSeq;
  m = publish(m, season, round, drafts);
  c = { ...c, manager: m };
  return { ...out, career: c, extras, fired, news: m.newsSeq - newsBefore };
}

function fire(c             , m              , round        , drafts         )                                      {
  const clubId = c.userClubId          ;
  const name = c.world.clubs[clubId].name;
  drafts.push(draft('URGENTE', `${c.coach.name} é demitido do ${name}`, { body: 'A diretoria perdeu a confiança depois da sequência de maus resultados.', clubId, mine: true }));
  const coaches = { ...m.coaches, [clubId]: { name: coachName(c.seed, `${clubId}:${c.season}:${round}:sucessor`), since: absRound(c.season, round) } };
  const next               = {
    ...m,
    coaches,
    morale: 50,
    reputation: clamp(m.reputation - 5),
    objective: null,
    finance: { ...m.finance, sponsor: null, sponsorOffers: [], loans: [] },
    stadium: { levels: {}, works: [] },
    market: { ...m.market, negotiations: [], auctions: m.market.auctions.map((a) => (a.status === 'OPEN' ? { ...a, status: 'WITHDRAWN'          } : a)) },
    contracts: {},
  };
  return { c: { ...c, userClubId: null, userLineup: null, manager: next }, m: next };
}

function closeAuctions(c             , m              , abs        , round        , drafts         , extras             )                                      {
  const auctions = [];
  let world = c.world;
  for (const a of m.market.auctions) {
    if (a.status !== 'OPEN' || a.closesRound > abs) {
      auctions.push(a);
      continue;
    }
    const p = world.players[a.playerId];
    if (!p || p.clubId !== c.userClubId) {
      auctions.push({ ...a, status: 'WITHDRAWN'          });
      continue;
    }
    const bids = auctionBids(world, c.seed, a, round);
    if (bids.length === 0) {
      auctions.push({ ...a, bids, status: 'NO_BIDS'          });
      drafts.push(draft('NOTICIA', `Leilão de ${p.name} termina sem lances`, { clubId: c.userClubId, playerId: p.id, mine: true }));
      continue;
    }
    const win = bids[0];
    world = movePlayer(world, p.id, win.clubId, { contract: { endSeason: Math.max(p.contract.endSeason, c.season + 1) } });
    world = addMoney(world, win.clubId, -win.amount);
    extras.push(line(c.season, round, `Venda de ${p.name} (leilão) para ${world.clubs[win.clubId].name}`, win.amount));
    auctions.push({ ...a, bids, status: 'SOLD'         , winner: win });
    drafts.push(draft('NOTICIA', `${p.name} é vendido em leilão para o ${world.clubs[win.clubId].name}`, { body: `${bids.length} lance(s). Valor final: R$ ${win.amount.toLocaleString('pt-BR')}.`, clubId: c.userClubId, playerId: p.id, mine: true }));
  }
  return { c: { ...c, world }, m: { ...m, market: { ...m.market, auctions } } };
}

function expireOffers(m              , abs        )               {
  const offers = m.jobs.offers.map((o) => (o.status === 'OPEN' && o.expiresRound < abs ? { ...o, status: 'EXPIRED'          } : o));
  return { ...m, jobs: { ...m.jobs, offers } };
}

/** Nível de divisão mais alto que aceita o treinador, pela reputação dele. */
function reachLevel(reputation        )         {
  return reputation >= 70 ? 1 : reputation >= 45 ? 2 : reputation >= 25 ? 3 : 4;
}

function addJobOffer(c             , m              , clubId        , round        , reason        , drafts         )               {
  if (m.jobs.offers.some((o) => o.clubId === clubId && o.status === 'OPEN')) return m;
  const seq = m.jobs.seq + 1;
  const offer           = { id: `job${seq}`, clubId, season: c.season, round, expiresRound: absRound(c.season, round) + 3, reason, status: 'OPEN' };
  drafts.push(draft('URGENTE', `Proposta de trabalho: ${c.world.clubs[clubId].name} quer ${c.coach.name}`, { body: reason, clubId, mine: true }));
  return { ...m, jobs: { ...m.jobs, seq, offers: [...m.jobs.offers, offer] } };
}

/** Treinador sem clube: clubes que acabaram de demitir chamam primeiro; fora isso, de vez em quando surge uma proposta. */
function organicOffers(c             , m              , round        , firedClubs          , drafts         )                      {
  const reach = reachLevel(m.reputation);
  const open = m.jobs.offers.filter((o) => o.status === 'OPEN').length;
  if (open >= 3) return { m };
  for (const id of firedClubs) {
    if (levelOf(c, id) >= reach) m = addJobOffer(c, m, id, round, 'O clube acabou de trocar de técnico e procura um nome para a sequência da temporada.', drafts);
  }
  const rng = createRng(deriveSeed(c.seed, `emprego:${c.season}:${round}`));
  if (m.jobs.offers.filter((o) => o.status === 'OPEN').length === 0 || rng.next() < 0.3) {
    const pool = c.world.divisions.filter((d) => d.level >= reach).flatMap((d) => divisionStandings(c, d.id).slice(-8).map((r) => r.clubId)).sort();
    const options = pool.filter((id) => !m.jobs.offers.some((o) => o.clubId === id && o.status === 'OPEN'));
    if (options.length) m = addJobOffer(c, m, options[rng.int(0, options.length - 1)], round, 'A diretoria quer mudar o rumo da temporada e gostou do seu perfil.', drafts);
  }
  return { m };
}

function closeManagedSeason(c             , m              , drafts         , extras             )                                      {
  const report = c.history[c.history.length - 1];
  const round = ROUNDS;
  // premiação para todos os clubes
  let world = c.world;
  for (const d of world.divisions) {
    divisionStandings(c, d.id).forEach((row, i) => {
      const prize = prizeMoney(d.level, i + 1, d.clubIds.length);
      world = addMoney(world, row.clubId, prize);
      if (row.clubId === c.userClubId) extras.push(line(c.season, round, `Premiação: ${i + 1}º lugar`, prize));
    });
  }
  for (const [divId, clubId] of Object.entries(report.champions)) {
    const d = world.divisions.find((x) => x.id === divId);
    drafts.push(draft('NOTICIA', `${world.clubs[clubId].name} é campeão da ${d?.name ?? divId}`, { clubId, mine: clubId === c.userClubId }));
  }
  if (c.userClubId) {
    const mv = report.userMovement;
    const champion = Object.values(report.champions).includes(c.userClubId);
    const sp = m.finance.sponsor;
    if (sp && sp.season === c.season && sp.bonus > 0 && goalMet(sp.goal, report.userPosition, mv?.kind === 'PROMOTED')) {
      world = addMoney(world, c.userClubId, sp.bonus);
      extras.push(line(c.season, round, `Bônus de meta do patrocínio ${sp.name}`, sp.bonus));
      drafts.push(draft('NOTICIA', `Meta cumprida: ${sp.name} paga bônus ao clube`, { clubId: c.userClubId, mine: true }));
    }
    const target = m.objective?.target ?? 20;
    const morale = moraleAfterSeason(m.morale, report.userPosition, target, mv?.kind ?? null, champion);
    let reputation = m.reputation + (report.userPosition <= target ? 4 : -2) + (mv?.kind === 'PROMOTED' ? 8 : mv?.kind === 'RELEGATED' ? -6 : 0) + (champion ? 6 : 0);
    reputation = clamp(reputation);
    m = { ...m, morale, reputation };
    if (mv?.kind === 'PROMOTED') drafts.push(draft('URGENTE', `ACESSO! ${world.clubs[c.userClubId].name} sobe de divisão`, { clubId: c.userClubId, mine: true }));
    if (mv?.kind === 'RELEGATED') drafts.push(draft('URGENTE', `${world.clubs[c.userClubId].name} é rebaixado`, { clubId: c.userClubId, mine: true }));
    if (morale >= 70) {
      const reach = reachLevel(reputation);
      const myLevel = levelOf({ ...c, world }, c.userClubId);
      const rng = createRng(deriveSeed(c.seed, `propostas-fim:${c.season}`));
      const upLevel = Math.max(reach, myLevel - 1);
      const pool = world.divisions.filter((d) => d.level === upLevel && d.level < myLevel).flatMap((d) => d.clubIds).filter((id) => id !== c.userClubId).sort();
      if (pool.length) m = addJobOffer({ ...c, world }, m, pool[rng.int(0, pool.length - 1)], round, 'O seu trabalho chamou atenção: o clube quer você para a próxima temporada.', drafts);
    }
    if (m.jobs.national === 'NONE' && reputation >= 60) {
      m = { ...m, jobs: { ...m.jobs, national: 'INVITED' } };
      drafts.push(draft('URGENTE', `${c.coach.name} é convidado para comandar a seleção`, { body: 'Convite honorário: o cargo acumula com o clube. Veja em CARREIRA.', mine: true }));
    }
  }
  return { c: { ...c, world }, m };
}

// ---------- virada de temporada ----------

                                 
                      
                                                             
                  
                   
 

function startManagedSeason(career             )                 {
  const c0 = ensureManager(career);
  let m = c0.manager;
  const newSeason = c0.season + 1;
  const drafts          = [];
  let world = c0.world;
  const userId = c0.userClubId;

  // empréstimos voltam
  for (const l of m.market.loans) {
    if (l.untilSeason > c0.season) continue;
    const p = world.players[l.playerId];
    if (!p) continue;
    world = movePlayer(world, l.playerId, l.fromClubId);
  }
  m = { ...m, market: { ...m.market, loans: m.market.loans.filter((l) => l.untilSeason > c0.season) } };

  // contratos do treinador que venceram e não foram renovados: jogador sai livre (se o elenco aguentar; senão a base repõe)
  const left           = [];
  if (userId) {
    for (const id of [...world.clubs[userId].squad]) {
      const p = world.players[id];
      if (p.contract.endSeason < newSeason) {
        world = movePlayer(world, id, null);
        left.push(id);
        drafts.push(draft('NOTICIA', `${p.name} deixa o clube ao fim do contrato`, { clubId: userId, playerId: id, mine: true }));
      }
    }
  }
  world = cpuRenewals(world, newSeason, (id) => id === userId);
  // livres veteranos se aposentam
  const players = { ...world.players };
  for (const p of Object.values(world.players)) if (p.clubId === null && p.age >= 34) delete players[p.id];
  world = { ...world, players };

  // acesso/rebaixamento e calendário novo
  let c = startNextSeason({ ...c0, world });
  world = c.world;
  const aged = agePlayers(world, c.seed, newSeason, (p) => (p.clubId === userId && p.age < 23 ? youthBonus(m.stadium.levels) : 0));
  world = aged.world;
  const moves = cpuTransfers(world, c.seed, newSeason, userId);
  world = moves.world;
  for (const mv of moves.moves.filter((x) => x.fee > 0).slice(0, 6)) {
    const p = world.players[mv.playerId];
    drafts.push(draft('NOTICIA', `${world.clubs[mv.to].name} contrata ${p.name}${mv.from ? ` (ex-${world.clubs[mv.from].name})` : ''}`, { clubId: mv.to, playerId: p.id }));
  }
  world = youthIntake(world, c.seed, newSeason, (id) => (id === userId ? MIN_SQUAD + 2 : CPU_MIN_SQUAD)).world;

  c = { ...c, world, userLineup: c.userLineup && left.length === 0 ? c.userLineup : null };
  const level = userId ? levelOf(c, userId) : 4;
  m = {
    ...m,
    stats: { season: {}, career: m.stats.career },
    refereeStats: {},
    contracts: {},
    market: { ...m.market, negotiations: [], auctions: m.market.auctions.filter((a) => a.status === 'OPEN') },
    finance: {
      ...m.finance,
      sponsor: null,
      sponsorOffers: userId ? sponsorOffers(c.seed, newSeason, userId, level, c.world.clubs[userId].reputation) : [],
      ledger: m.finance.ledger.filter((e) => e.season >= newSeason - 1),
    },
    objective: userId ? objectiveFor(c, userId) : null,
  };
  // leilões abertos na intertemporada fecham agora
  const extras              = [];
  const closed = closeAuctions(c, m, absRound(newSeason, 1), 0, drafts, extras);
  c = closed.c;
  m = closed.m;
  if (userId && extras.length) {
    c = { ...c, world: addMoney(c.world, userId, extras.reduce((s, e) => s + e.amount, 0)) };
    m = { ...m, finance: { ...m.finance, ledger: [...m.finance.ledger, ...extras.map((e) => ({ ...e, season: newSeason }))] } };
  }
  drafts.push(draft('NOTICIA', `Começa a temporada ${newSeason}`, { body: m.objective ? `Objetivo da diretoria: ${m.objective.label}.` : null, mine: true }));
  m = publish(m, newSeason, 0, drafts);
  return { career: { ...c, manager: m }, left, retired: aged.retired.length, cpuMoves: moves.moves.length };
}

function requireManagedClub(c             )                                                    {
  if (!hasClub(c)) throw new CareerError('NO_CLUB', 'o treinador está sem clube');
}

__defs["game/manager/stats.ts"] = function (__exports, __req) {
                                                                   
                                                         
const { EMPTY_LINE } = __req("game/manager/state.ts");

// Estatísticas dos jogadores e dos árbitros, lidas dos eventos REAIS das partidas (o engine não muda).
// Assistências não existem aqui: o evento de gol do Engine 0.2.0 não registra quem deu o passe (ver docs/ENGINE.md).

/** Quem entrou em campo: titulares que ainda estão, os que saíram, os expulsos e os lesionados. */
function appeared(team           )           {
  const ids = new Set        ([...team.onField.map((s) => s.playerId), ...team.subbedOff, ...team.sentOff, ...team.injured]);
  return [...ids];
}

function matchStatLines(m            )                           {
  const out                           = {};
  const line = (id        ) => (out[id] ??= { ...EMPTY_LINE });
  for (const side of ['home', 'away']         ) for (const id of appeared(m[side])) line(id).apps += 1;
  for (const e of m.events) {
    if (!e.playerId) continue;
    if (e.type === 'GOAL' || e.type === 'PENALTY_GOAL') line(e.playerId).goals += 1;
    else if (e.type === 'YELLOW_CARD') line(e.playerId).yellows += 1;
    else if (e.type === 'RED_CARD') line(e.playerId).reds += 1;
    else if (e.type === 'INJURY') line(e.playerId).injuries += 1;
  }
  return out;
}

function addLines(base                          , add                          )                           {
  const out = { ...base };
  for (const [id, l] of Object.entries(add)) {
    const b = out[id] ?? EMPTY_LINE;
    out[id] = { apps: b.apps + l.apps, goals: b.goals + l.goals, yellows: b.yellows + l.yellows, reds: b.reds + l.reds, injuries: b.injuries + l.injuries };
  }
  return out;
}

function refereeLine(m            )               {
  let yellows = 0;
  let reds = 0;
  let penalties = 0;
  for (const e of m.events) {
    if (e.type === 'YELLOW_CARD') yellows++;
    else if (e.type === 'RED_CARD') reds++;
    else if (e.type === 'PENALTY_AWARDED') penalties++;
  }
  return { matches: 1, yellows, reds, penalties };
}

function addReferee(a                          , b              )               {
  return a ? { matches: a.matches + b.matches, yellows: a.yellows + b.yellows, reds: a.reds + b.reds, penalties: a.penalties + b.penalties } : b;
}

                                 
                  
                        
                            
                
 

/** Perfil a partir dos jogos que o árbitro de fato apitou, comparado com a média de todos os árbitros. */
function refereeProfile(stats                          , all                         )                 {
  if (!stats || stats.matches < 3) {
    return { matches: stats?.matches ?? 0, cardsPerMatch: stats ? (stats.yellows + stats.reds) / Math.max(1, stats.matches) : 0, penaltiesPerMatch: stats ? stats.penalties / Math.max(1, stats.matches) : 0, label: 'Poucos jogos na temporada: ainda sem um perfil claro.' };
  }
  const tot = all.reduce((acc, s) => ({ m: acc.m + s.matches, c: acc.c + s.yellows + s.reds, p: acc.p + s.penalties }), { m: 0, c: 0, p: 0 });
  const avgCards = tot.m ? tot.c / tot.m : 0;
  const avgPens = tot.m ? tot.p / tot.m : 0;
  const cards = (stats.yellows + stats.reds) / stats.matches;
  const pens = stats.penalties / stats.matches;
  let label = 'Equilibrado: distribui cartões na média do campeonato.';
  if (cards >= avgCards * 1.15) label = 'Rigoroso: mostra mais cartões que a média e para bastante o jogo.';
  else if (cards <= avgCards * 0.85) label = 'Deixa o jogo correr: mostra menos cartões que a média.';
  if (avgPens > 0 && pens >= avgPens * 1.5 && stats.penalties >= 2) label += ' Marca pênaltis com frequência.';
  return { matches: stats.matches, cardsPerMatch: cards, penaltiesPerMatch: pens, label };
}

__exports["matchStatLines"] = matchStatLines;
__exports["addLines"] = addLines;
__exports["refereeLine"] = refereeLine;
__exports["addReferee"] = addReferee;
__exports["refereeProfile"] = refereeProfile;
};

__defs["game/manager/world.ts"] = function (__exports, __req) {
const { createRng, deriveSeed,                                        } = __req("engine/index.ts");
                                                
const { coachName, stableHash } = __req("game/manager/people.ts");
const { recentForm } = __req("game/manager/board.ts");
const { divisionStandings } = __req("game/career.ts");
const { MAX_SQUAD, MIN_GOALKEEPERS, addMoney, movePlayer } = __req("game/manager/market.ts");
                                           
const { absRound } = __req("game/manager/state.ts");
const { roundTo } = __req("game/manager/finance.ts");

// Mundo vivo: técnicos da CPU caem e chegam, jogadores envelhecem e evoluem, contratos vencem, clubes da CPU
// contratam na intertemporada e as categorias de base repõem elencos curtos.
// Tudo o que muda JOGADORES acontece só na virada da temporada: durante a temporada o mundo esportivo da CPU fica
// parado, então a 1ª temporada joga exatamente as mesmas partidas da versão anterior (mesma seed = mesmos placares).

const SALARY_PER_POINT                         = { 1: 900, 2: 400, 3: 150, 4: 60 };
const YOUTH_STRENGTH                                   = { 1: [22, 34], 2: [16, 28], 3: [11, 22], 4: [7, 17] };
const RETIRE_AGE = 37;
const CPU_MIN_SQUAD = 18;

const levelOfClub = (world       , clubId        ) => world.divisions.find((d) => d.id === world.clubs[clubId]?.divisionId)?.level ?? 4;

// ---------- técnicos da CPU ----------

                              
                 
              
             
 

/**
 * Demissões na CPU depois da rodada: a partir da 6ª, quem está entre os 3 últimos da divisão e perdeu 3 dos últimos
 * 4 jogos, com o técnico há pelo menos 6 rodadas no cargo. No máximo 2 por rodada no mundo todo.

function cpuCoachChanges(c             , coaches                          , playedRound        )                                                                {
  if (playedRound < 6) return { coaches, changes: [] };
  const now = absRound(c.season, playedRound);
  const changes                = [];
  const next = { ...coaches };
  for (const d of [...c.world.divisions].sort((a, b) => a.level - b.level)) {
    const table = divisionStandings(c, d.id);
    for (const row of table.slice(-3)) {
      if (row.clubId === c.userClubId || changes.length >= 2) continue;
      const coach = next[row.clubId];
      if (!coach || now - coach.since < 6) continue;
      const losses = recentForm(c.results, row.clubId, 4).filter((x) => x === 'D').length;
      if (losses < 3) continue;
      const fresh           = { name: coachName(c.seed, `${row.clubId}:${c.season}:${playedRound}`), since: now };
      changes.push({ clubId: row.clubId, out: coach.name, in: fresh.name });
      next[row.clubId] = fresh;
    }
  }
  return { coaches: next, changes };
}

// ---------- virada de temporada ----------

const FIRST = ['Adriano', 'Bruno', 'Caio', 'Davi', 'Enzo', 'Felipe', 'Gabriel', 'Heitor', 'Igor', 'João', 'Kauã', 'Lucas', 'Matheus', 'Nicolas', 'Otávio', 'Pedro', 'Rafael', 'Samuel', 'Thiago', 'Vinícius', 'Wesley', 'Yuri'];
const LAST = ['Alves', 'Barbosa', 'Cardoso', 'Duarte', 'Esteves', 'Farias', 'Gomes', 'Henrique', 'Lopes', 'Macedo', 'Nogueira', 'Oliveira', 'Pereira', 'Queiroz', 'Rocha', 'Santana', 'Teixeira', 'Viana'];

function valueFor(strength        , level        )                                          {
  const per = SALARY_PER_POINT[level] ?? 60;
  return { salary: Math.max(100, Math.round((strength * per) / 100) * 100), marketValue: Math.max(1_000, Math.round((strength * strength * per * 4) / 1000) * 1000) };
}

/** Jovem da base: 17–19 anos, força da faixa de baixo da divisão, contrato de 3 temporadas. */
function youthPlayer(seed        , season        , clubId        , n        , position          , level        )         {
  const rng = createRng(deriveSeed(seed, `base:${season}:${clubId}:${n}`));
  const [lo, hi] = YOUTH_STRENGTH[level] ?? [7, 17];
  const strength = rng.int(lo, hi);
  return {
    id: `${clubId}-b${season}-${n}`,
    name: `${rng.pick(FIRST)} ${rng.pick(LAST)}`,
    age: rng.int(17, 19),
    nationality: 'Brasil',
    position,
    strength,
    temperament: rng.pick(['CALM', 'NORMAL', 'NORMAL', 'EXPLOSIVE']         ),
    ...valueFor(strength, level),
    contract: { endSeason: season + 3 },
    clubId,
    condition: { injuryRounds: 0, suspensionRounds: 0, yellowCardsAccumulated: 0 },
  };

/** Repõe elencos curtos com jovens da base (goleiros primeiro). */
function youthIntake(world       , seed        , season        , minSquad                            )                                                    {
  let w = world;
  const added                           = {};

    let n = 0;
    const level = levelOfClub(w, id);
    const need = () => {
      const club = w.clubs[id];
      const gks = club.squad.filter((p) => w.players[p]?.position === 'GK').length;
      if (gks < MIN_GOALKEEPERS) return 'GK'            ;
      if (club.squad.length >= minSquad(id)) return null;
      const count = (pos          ) => club.squad.filter((p) => w.players[p]?.position === pos).length;
      const ratios                       = [['DEF', count('DEF') / 7], ['MID', count('MID') / 7], ['ATT', count('ATT') / 4]];
      return ratios.sort((a, b) => a[1] - b[1])[0][0];
    };
    for (let pos = need(); pos !== null && n < 12; pos = need()) {
      const p = youthPlayer(seed, season, id, ++n, pos, level);
      w = { ...w, players: { ...w.players, [p.id]: p }, clubs: { ...w.clubs, [id]: { ...w.clubs[id], squad: [...w.clubs[id].squad, p.id] } } };
      (added[id] ??= []).push(p.id);
    }
  }
  return { world: w, added };
}

/**
 * Envelhecimento e evolução (uma vez por virada): +1 ano; até 23 anos sobe 0 a 2 (+ bônus do CT no clube do treinador),
 * 24–29 varia de −1 a +1, 30–32 cai 0 a 1, 33+ cai 0 a 2. Valor de mercado e salário-base acompanham a nova força.
 * Quem chega a 37 anos se aposenta.
 */
function agePlayers(world       , seed        , season        , bonus                       )                                      {
  const players                         = {};
  const retired           = [];
  const clubs = { ...world.clubs };
  for (const id of Object.keys(world.players).sort()) {
    const p = world.players[id];
    const age = p.age + 1;
    if (age >= RETIRE_AGE) {
      retired.push(p);
      if (p.clubId && clubs[p.clubId]) clubs[p.clubId] = { ...clubs[p.clubId], squad: clubs[p.clubId].squad.filter((x) => x !== id), penaltyTakerId: clubs[p.clubId].penaltyTakerId === id ? null : clubs[p.clubId].penaltyTakerId };
      continue;
    }
    const h = stableHash(`${seed}|evolucao|${season}|${id}`);
    const roll = (lo        , hi        ) => lo + (h % (hi - lo + 1));
    const delta = age <= 23 ? roll(0, 2) + bonus(p) : age <= 29 ? roll(-1, 1) : age <= 32 ? roll(-1, 0) : roll(-2, 0);
    const strength = Math.max(1, Math.min(50, p.strength + delta));
    const ratio = strength / Math.max(1, p.strength);
    players[id] = { ...p, age, strength, marketValue: Math.max(1_000, roundTo(p.marketValue * ratio * ratio * (age >= 31 ? 0.85 : 1), 1_000)) };
  }
  return { world: { ...world, players, clubs }, retired };
}

/** CPU renova automaticamente quem tem contrato vencendo (1 a 3 temporadas). */
function cpuRenewals(world       , newSeason        , isUser                             )        {
  const players = { ...world.players };
  for (const p of Object.values(world.players)) {
    if (!p.clubId || isUser(p.clubId) || p.contract.endSeason >= newSeason) continue;
    players[p.id] = { ...p, contract: { endSeason: newSeason - 1 + 1 + (stableHash(`renova|${p.id}|${newSeason}`) % 3) } };
  }
  return { ...world, players };
}

                          
                   
                      
             
              
 

/**
 * Transferências da CPU na intertemporada: os destaques das divisões de baixo sobem para clubes da divisão de cima
 * que podem pagar; depois, clubes de elenco curto contratam jogadores livres. O clube do treinador não entra.
 */
function cpuTransfers(world       , seed        , season        , userClubId               )                                     {
  const rng = createRng(deriveSeed(seed, `mercado-cpu:${season}`));
  let w = world;
  const moves            = [];
  const levels = [...w.divisions].sort((a, b) => a.level - b.level);
  for (let i = 1; i < levels.length; i++) {
    const below = levels[i];
    const above = levels[i - 1];
    const stars = below.clubIds
      .filter((id) => id !== userClubId)
      .flatMap((id) => w.clubs[id].squad.map((p) => w.players[p]))
      .filter(Boolean)
      .sort((a, b) => b.strength - a.strength || a.id.localeCompare(b.id))
      .slice(0, 8);
    for (const p of stars) {
      if (rng.next() < 0.5) continue;
      const from = w.clubs[p.clubId          ];
      if (from.squad.length <= CPU_MIN_SQUAD - 2) continue;
      const fee = roundTo(p.marketValue * 1.2, 5_000);
      const buyers = above.clubIds.filter((id) => id !== userClubId && w.clubs[id].money > fee * 3 && w.clubs[id].squad.length < MAX_SQUAD - 2).sort();
      if (buyers.length === 0) continue;
      const to = buyers[rng.int(0, buyers.length - 1)];
      const salary = Math.max(p.salary, valueFor(p.strength, above.level).salary);
      w = movePlayer(w, p.id, to, { salary, contract: { endSeason: season + 2 } });
      w = addMoney(addMoney(w, to, -fee), from.id, fee);
      moves.push({ playerId: p.id, from: from.id, to, fee });
    }
  }
  const free = Object.values(w.players).filter((p) => p.clubId === null).sort((a, b) => b.strength - a.strength || a.id.localeCompare(b.id));
  for (const p of free) {
    const needy = Object.values(w.clubs)
      .filter((c) => c.id !== userClubId && c.squad.length < CPU_MIN_SQUAD + 2)
      .sort((a, b) => a.squad.length - b.squad.length || a.id.localeCompare(b.id))[0];
    if (!needy) break;
    const level = levelOfClub(w, needy.id);
    w = movePlayer(w, p.id, needy.id, { salary: valueFor(p.strength, level).salary, contract: { endSeason: season + 1 } });
    moves.push({ playerId: p.id, from: null, to: needy.id, fee: 0 });
  }
  return { world: w, moves };
}

__exports["CPU_MIN_SQUAD"] = CPU_MIN_SQUAD;

__defs["game/lineup-edit.ts"] = function (__exports, __req) {
const { DEFAULT_CONFIG, autoLineup, formationOf,                                                                                } = __req("engine/index.ts");

// Edição da escalação no MEU TIME. Funções puras: devolvem uma escalação nova; a validação final (exatamente 1 goleiro,
// 11 titulares, disponíveis...) é do engine (validateLineup), aplicada por withUserLineup na carreira.

class LineupEditError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'LineupEditError';
    this.code = code;
  }
}

const isStarter = (l        , id        ) => l.starters.some((s) => s.playerId === id);

/**
 * Troca dois jogadores. Titular ↔ titular: trocam de posição. Titular ↔ reserva (ou jogador fora da lista): o de fora
 * assume a posição do titular e o titular vai para o banco. O banco respeita o limite da configuração (o mais fraco que não é
 * goleiro sai da lista se estourar).
 */
function swapPlayers(lineup        , players                        , aId        , bId        )         {
  if (aId === bId) return lineup;
  if (isStarter(lineup, aId) && isStarter(lineup, bId)) {
    return { ...lineup, starters: lineup.starters.map((s) => (s.playerId === aId ? { ...s, playerId: bId } : s.playerId === bId ? { ...s, playerId: aId } : s)) };
  }
  let [starterId, otherId] = [aId, bId];
  if (!isStarter(lineup, starterId)) [starterId, otherId] = [bId, aId];
  if (!isStarter(lineup, starterId)) throw new LineupEditError('NO_STARTER', 'um dos dois jogadores precisa ser titular');
  const starters = lineup.starters.map((s) => (s.playerId === starterId ? { ...s, playerId: otherId } : s));
  let bench = lineup.bench.includes(otherId) ? lineup.bench.map((id) => (id === otherId ? starterId : id)) : [...lineup.bench, starterId];
  while (bench.length > DEFAULT_CONFIG.maxBench) {
    const droppable = bench.filter((id) => id !== starterId && players[id]?.position !== 'GK');
    const weakest = droppable.sort((x, y) => players[x].strength - players[y].strength)[0];
    if (!weakest) break;
    bench = bench.filter((id) => id !== weakest);
  }
  const penaltyTakerId = lineup.penaltyTakerId === starterId ? null : lineup.penaltyTakerId;
  return { ...lineup, starters, bench, penaltyTakerId };
}

function setTactics(lineup        , tactics                                        )         {
  return { ...lineup, style: tactics.style ?? lineup.style, behavior: tactics.behavior ?? lineup.behavior };
}

function setPenaltyTaker(lineup        , playerId               )         {
  if (playerId !== null && !isStarter(lineup, playerId)) throw new LineupEditError('NOT_STARTER', 'o batedor de pênalti precisa ser titular');
  return { ...lineup, penaltyTakerId: playerId };
}

/** Nova formação: o jogo remonta o melhor time disponível nela, mantendo estilo, comportamento e batedor (se ainda titular). */
function applyFormation(club      , players                        , lineup        , formation           )         {
  const auto = autoLineup(club, players, { formation, style: lineup.style, behavior: lineup.behavior });
  const keep = lineup.penaltyTakerId !== null && auto.starters.some((s) => s.playerId === lineup.penaltyTakerId);
  return { ...auto, penaltyTakerId: keep ? lineup.penaltyTakerId : null };
}

/** O melhor time disponível na formação atual (botão MELHOR TIME). */
function bestLineup(club      , players                        , lineup        )         {
  return applyFormation(club, players, lineup, formationOf(lineup.starters));
}

const {

  isRoundFinished,

// Sessão de jogo (seções 23 e 26). Fica ENTRE o engine e a interface:
//   ENGINE  →  GAME (esta camada)  →  INTERFACE (futura)
//
// A sessão decide QUANDO chamar stepRound. É só isso que a velocidade faz.
// O engine não conhece velocidade, relógio real, pausa de interface nem telas.
//
// Determinismo: mesma seed + mesmos dados + mesmas decisões do jogador = mesmo resultado,
// em qualquer velocidade, com qualquer número de pausas.

// ---------- Velocidades ----------

/** Identificadores em inglês no código; o rótulo em português é o que a interface mostra. */
                                                                           

                            
                
                                                                                                            
                     
 

const SPEEDS                             = {
  SLOW: { label: 'LENTA', intervalMs: 1000 },
  NORMAL: { label: 'NORMAL', intervalMs: 500 },
  FAST: { label: 'RÁPIDA', intervalMs: 250 },
  VERY_FAST: { label: 'MUITO RÁPIDA', intervalMs: 100 },
  INSTANT: { label: 'INSTANTÂNEA', intervalMs: 0 },
};

const SPEED_ORDER            = ['SLOW', 'NORMAL', 'FAST', 'VERY_FAST', 'INSTANT'];

// ---------- Temporizador injetável ----------

                            
                                                        
                                      
 

/** Temporizador real. Nos testes, injete um temporizador falso que avança o tempo à mão. */
const systemScheduler            = {
  setTimeout: (callback, ms) => globalThis.setTimeout(callback, ms),
  clearTimeout: (handle) => globalThis.clearTimeout(handle                                            ),
};

// ---------- Estado ----------

                           
                        
                                                
             
                                                     
                                                                 
                     

/**
 * Por que a rodada está parada, do ponto de vista da interface. Decisões obrigatórias não entram aqui: vêm do engine.
 * HALFTIME e EVENT só existem com a opção stopOnEvents: intervalo, pênalti, lesão e expulsão na partida do clube
 * controlado sempre param a rodada (quando o próprio engine não abriu uma decisão para o lance).
 */
                                                                  

/** Lances que param a partida do clube controlado. */
const STOP_EVENTS                                = ['PENALTY_AWARDED', 'INJURY', 'RED_CARD'];

                              
                             
                  
                    
 

                                  
                  
                     
 

                                  
                        
                           
                                  
                 
                        
                                  
                                                                             
                           
 

                                  
                  
               
                               
                                   
 

                              
                                 
                           
                
                      
 

class SessionError extends Error {
  code        ;
  constructor(code        , message        ) {
    super(message);
    this.name = 'SessionError';
    this.code = code;
  }
}

                          
                              
                                                                       
                                           
               
                
                 
                    
                     
                                 
                                                                          
                       
                                                                               
                                                                   
                                                                                     
                                                                                  
                                                                                  
                                                                                                
                                            
                           
                  
 

                                 
                        
                  
                                                                                                                       
                         
 

// Nunca chega perto disso: 90 minutos + acréscimos (máx. 8 + 8) + extensões de pênalti.
const MAX_STEPS = 1000;

function createSession(options                 = {})          {
  const scheduler = options.scheduler ?? systemScheduler;
  let speed          = options.speed ?? 'NORMAL';
  let round                    = null;
  let controlledClubId                = null;
  let playing = false;
  const pauses = new Set             ();
  let timer          = null;
  let commandSeq = 0;
  let disposed = false;
  const stopOnEvents = options.stopOnEvents ?? false;
  /** quantos eventos da partida controlada já foram examinados */
  let seen = 0;
  let stop                     = null;
  const queue                = [];
  const listeners = new Set                                     ();

  // ----- leitura -----

  function pendingDecision()                         {
    if (!round) return null;
    const match = awaitingMatch(round);
    return match && match.decision ? { matchId: match.matchId, decision: match.decision } : null;
  }

  function statusOf()                {
    if (!round) return 'IDLE';
    if (isRoundFinished(round)) return 'ROUND_FINISHED';
    if (awaitingMatch(round)) return 'AWAITING_DECISION';
    if (pauses.size > 0) return 'PAUSED';
    return playing ? 'PLAYING' : 'READY';
  }

  function snapshot()                  {
    return { status: statusOf(), round, controlledClubId, speed, pauses: [...pauses], pending: pendingDecision(), stop };
  }

  function emit()       {
    if (disposed) return;
    const snap = snapshot();
    for (const listener of [...listeners]) listener(snap);
  }

  // ----- o laço de avanço: a única coisa que a velocidade controla -----

  function canAdvance()          {
    return !disposed && round !== null && playing && pauses.size === 0 && !isRoundFinished(round) && !awaitingMatch(round);
  }

  function cancelTimer()       {
    if (timer !== null) {
      scheduler.clearTimeout(timer);
      timer = null;
    }
  }

  /** Examina os eventos novos da partida controlada e para a rodada no intervalo e nos lances importantes. */
  function checkStops()       {
    if (!stopOnEvents || !round || !controlledClubId) return;
    const m = round.matches.find((x) => x.home.clubId === controlledClubId || x.away.clubId === controlledClubId);
    if (!m) return;
    const fresh = m.events.slice(seen);
    seen = m.events.length;
    for (const e of fresh) {
      if (e.type === 'HALF_TIME') queue.push({ kind: 'HALFTIME', matchId: m.matchId, event: e });
      else if (STOP_EVENTS.includes(e.type)) {
        // o engine já abriu uma decisão do jogador para este lance (pênalti a favor, lesão ou expulsão no time dele):
        // o pop-up da decisão é a parada; não empilha outra
        const ownDecision = e.side !== null && m[e.side].clubId === controlledClubId && (m.decision !== null || m.decisionQueue.length > 0);
        if (!ownDecision) queue.push({ kind: 'EVENT', matchId: m.matchId, event: e });

    if (!stop && queue.length) {
      stop = queue.shift()               ;
      pauses.add(stop.kind);
    }
  }

  function tick()       {
    timer = null;
    if (!canAdvance()) return;
    round = stepRound(round              );
    checkStops();
    emit();
    scheduleNext();
  }

  /** INSTANTÂNEA: sem espera. Avança até a próxima decisão, pausa ou o fim, e avisa uma única vez. */
  function runWithoutWaiting()       {
    let stepped = 0;
    while (canAdvance()) {
      if (++stepped > MAX_STEPS) throw new SessionError('RUNAWAY', 'a rodada não terminou');
      round = stepRound(round              );
      checkStops();
    }
    if (stepped > 0) emit();
  }

  function scheduleNext()       {

    if (!canAdvance()) return;
    if (SPEEDS[speed].intervalMs === 0) runWithoutWaiting();

  // ----- comandos -----

  function nextCommandId(matchId        , override         )         {
    return override ?? `${matchId}:c${++commandSeq}`;
  }

  function requireRound()             {
    if (!round) throw new SessionError('NO_ROUND', 'não há rodada em andamento');
    return round;
  }

  function controlledMatchId()         {
    const r = requireRound();
    if (!controlledClubId) throw new SessionError('NO_CONTROLLED_CLUB', 'não há clube controlado nesta rodada');
    const match = r.matches.find((m) => m.home.clubId === controlledClubId || m.away.clubId === controlledClubId);
    if (!match) throw new SessionError('UNKNOWN_CLUB', `o clube controlado não joga esta rodada: ${controlledClubId}`);
    return match.matchId;
  }

  function dispatch(command         )                {
    const r = requireRound();
    const match = r.matches.find((m) => m.home.clubId === command.clubId || m.away.clubId === command.clubId);
    if (!match) throw new SessionError('UNKNOWN_CLUB', `o clube ${command.clubId} não joga esta rodada`);

    round = applied.round;
    emit();
    scheduleNext(); // se a decisão foi resolvida e a rodada estava em andamento, volta a andar
    return applied.result;
  }

  function pendingOfType(...types                    )                  {
    const pending = pendingDecision();
    if (!pending) throw new SessionError('NO_DECISION', 'não há decisão pendente');
    if (!types.includes(pending.decision.type)) {
      throw new SessionError('WRONG_DECISION', `a decisão pendente é ${pending.decision.type}`);
    }
    return pending;
  }

  return {
    getState: snapshot,

    subscribe(listener) {
      listeners.add(listener);
      return () => {
        listeners.delete(listener);
      };
    },

    startRound(input) {
      if (round && !isRoundFinished(round)) throw new SessionError('ROUND_IN_PROGRESS', 'a rodada anterior ainda não terminou');
      cancelTimer();
      controlledClubId = input.controlledClubId ?? null;
      round = createRound(input.roundId, input.seed, input.fixtures, controlledClubId);
      playing = false;
      pauses.clear();
      commandSeq = 0;
      seen = 0;
      stop = null;
      queue.length = 0;
      emit();
    },

    play() {
      requireRound();
      playing = true;
      emit();
      scheduleNext();
    },

    pause() {
      pauses.add('USER');
      cancelTimer();
      emit();
    },

    resume() {
      pauses.delete('USER');
      emit();
      scheduleNext();
    },

    openClubs() {
      pauses.add('CLUBS');
      cancelTimer();
      emit();
    },

    closeClubs() {
      pauses.delete('CLUBS');
      emit();
      scheduleNext();
    },

    continueStop() {
      if (!stop) return;
      pauses.delete(stop.kind);
      stop = null;
      if (queue.length) {
        stop = queue.shift()               ;
        pauses.add(stop.kind);
      }
      emit();
      scheduleNext();
    },

    setSpeed(next) {
      if (!(next in SPEEDS)) throw new SessionError('INVALID_SPEED', `velocidade desconhecida: ${String(next)}`);
      speed = next;
      emit();
      scheduleNext(); // reprograma com o novo intervalo; nada do jogo muda

    openTeamAdjustment(opts) {
      const matchId = controlledMatchId();
      return dispatch({ type: 'OPEN_TEAM_ADJUSTMENT', commandId: nextCommandId(matchId, opts?.commandId), clubId: controlledClubId           });
    },

    choosePenaltyTaker(playerId, opts) {
      const { matchId, decision } = pendingOfType('PENALTY_TAKER');
      return dispatch({
        type: 'CHOOSE_PENALTY_TAKER',
        commandId: nextCommandId(matchId, opts?.commandId),
        clubId: decision.clubId,
        decisionId: decision.id,
        playerId,
      });
    },

    adjustTeam(changes = {}, opts) {
      const { matchId, decision } = pendingOfType('INJURY_SUBSTITUTION', 'RED_CARD_ADJUSTMENT', 'TEAM_ADJUSTMENT');
      return dispatch({
        type: 'ADJUST_TEAM',
        commandId: nextCommandId(matchId, opts?.commandId),
        clubId: decision.clubId,
        decisionId: decision.id,
        substitutions: changes.substitutions ?? [],

// Utilitários mínimos de DOM (sem framework: o ambiente de build não tem npm). Nenhuma regra de futebol mora aqui.

                                                                                
                                                   

/** Cria um elemento. Propriedades: class, on<Evento>, data-*, aria-*, disabled/checked/value e demais atributos. */
function h(tag        , props        , ...children         )              {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') el.className = String(value);
    else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2).toLowerCase(), value                 );
    else if (key === 'value') (el                    ).value = String(value);
    else if (value === true) el.setAttribute(key, '');
    else el.setAttribute(key, String(value));
  }
  append(el, children);
  return el;
}

function append(parent      , children         )       {
  for (const c of children) {
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) append(parent, c);
    else parent.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
}

/** Troca o conteúdo de root, preservando a rolagem dos elementos marcados com data-keep="nome". */
function render(root             , ...children         )       {
  const kept = new Map                ();
  root.querySelectorAll             ('[data-keep]').forEach((e) => kept.set(e.dataset.keep          , e.scrollTop));
  root.replaceChildren();
  append(root, children);
  root.querySelectorAll             ('[data-keep]').forEach((e) => {
    const top = kept.get(e.dataset.keep          );
    if (top !== undefined) e.scrollTop = top;
  });
}

__exports["h"] = h;
__exports["render"] = render;
};

// Textos e formatos em português do Brasil. Os identificadores do código ficam em inglês; a interface mostra estes rótulos.

const nf = new Intl.NumberFormat('pt-BR');

const num = (n        )         => nf.format(Math.round(n));

/** Dinheiro em R$, compacto: R$ 1,2 mi · R$ 350 mil · R$ 980. */
function money(n        )         {
  const sign = n < 0 ? '−' : '';
  const v = Math.abs(n);
  if (v >= 1_000_000) return `${sign}R$ ${(v / 1_000_000).toFixed(v >= 10_000_000 ? 1 : 2).replace('.', ',')} mi`;
  if (v >= 10_000) return `${sign}R$ ${Math.round(v / 1000)} mil`;
  return `${sign}R$ ${num(v)}`;
}

const signedMoney = (n        )         => (n > 0 ? '+' : '') + money(n);

const POSITION_LABEL                           = { GK: 'GOL', DEF: 'DEF', MID: 'MEI', ATT: 'ATA' };
const POSITION_NAME                           = { GK: 'Goleiro', DEF: 'Defensor', MID: 'Meia', ATT: 'Atacante' };
const STYLE_LABEL                        = { DEFENSIVE: 'Defensivo', BALANCED: 'Equilibrado', OFFENSIVE: 'Ofensivo' };
const BEHAVIOR_LABEL                           = { NORMAL: 'Normal', AGGRESSIVE: 'Agressivo', REACTIVE: 'Reativo' };
const STYLES          = ['DEFENSIVE', 'BALANCED', 'OFFENSIVE'];
const BEHAVIORS             = ['NORMAL', 'AGGRESSIVE', 'REACTIVE'];
const FORMATIONS = ['4-4-2', '4-3-3', '3-5-2', '5-3-2', '4-5-1', '3-4-3', '5-4-1', '4-2-4'];

/** Força vinda das consultas pode ser decimal (média); a tela sempre mostra inteiro. */
const strengthLabel = (n                           )         => (n === null || n === undefined ? '—' : String(Math.round(n)));

// Nomes de jogador. Mundo de universo de dados (World.nameStyle = 'display', ver data/to-world.ts): o nome já é o
// displayName oficial e aparece INTEIRO ("Felipe Anderson", "João Pedro"). Mundo fictício da V1 (sem a marca):
// abreviado como sempre ("Thiago Pacheco Lopes" → "T. Lopes"). A tela informa o mundo atual a cada desenho (shell.ts).
let displayNames = false;
const useNamesOf = (world                           )          => {
  displayNames = !!world && (world                           ).nameStyle === 'display';
  return displayNames;
};

const shortName = (full        )         => {
  if (displayNames) return full;
  const parts = full.trim().split(/\s+/);
  return parts.length <= 1 ? full : `${parts[0][0]}. ${parts[parts.length - 1]}`;
};

const initials = (name        )         =>
  name
    .split(/\s+/)
    .filter((w) => w.length > 2)
    .slice(0, 2)
    .map((w) => w[0].toUpperCase())
    .join('') || name.slice(0, 2).toUpperCase();

const plural = (n        , one        , many        )         => `${n} ${n === 1 ? one : many}`;

__exports["money"] = money;
__exports["num"] = num;
__exports["signedMoney"] = signedMoney;
__exports["POSITION_LABEL"] = POSITION_LABEL;
__exports["POSITION_NAME"] = POSITION_NAME;

__exports["BEHAVIOR_LABEL"] = BEHAVIOR_LABEL;
__exports["STYLES"] = STYLES;
__exports["BEHAVIORS"] = BEHAVIORS;
__exports["FORMATIONS"] = FORMATIONS;
__exports["strengthLabel"] = strengthLabel;
__exports["useNamesOf"] = useNamesOf;
__exports["shortName"] = shortName;
__exports["initials"] = initials;
__exports["plural"] = plural;
};

/** Opções da decisão de goleiro, ou null se a decisão não é de goleiro (ou é lesão com goleiro reserva no banco). */
function goalkeeperOptions(team           , decision          , maxSubs = DEFAULT_CONFIG.maxSubs)                           {
  if (decision.type !== 'INJURY_SUBSTITUTION' && decision.type !== 'RED_CARD_ADJUSTMENT') return null;
  const vacated = decision.playerId ? team.vacated[decision.playerId] : undefined;

  const canSub = team.subsUsed < maxSubs && team.bench.length > 0;
  const reserveGks = canSub ? team.bench.filter((id) => team.players[id].position === 'GK') : [];

  if (decision.type === 'RED_CARD_ADJUSTMENT') return { ...base, mode: reserveGks.length > 0 ? 'RESERVE_GK' : 'OUTFIELD_TO_GOAL' };

  return reserveGks.length > 0 ? null : { ...base, mode: 'INJURY_NO_RESERVE_GK' };

  const cmd = suggestedCommand(match, decision);

    const { reserveIn, out } = choice;

    const { toGoal } = choice;

  const m = snap.round.matches.find((x) => x.matchId === stop.matchId);
  if (!m) return null;
  const uid = ctrl.state.career?.userClubId ?? null;
  const mine       = m.home.clubId === uid ? 'home' : 'away';
  if (stop.kind === 'HALFTIME') return halftime(ctrl, m, mine);
  const e = stop.event;
  const who = e.side && e.playerId && m[e.side].players[e.playerId] ? shortName(m[e.side].players[e.playerId].name) : 'Jogador';
  const team = e.side ? m[e.side].name : '';
  const ours = e.side === mine;
  let title = 'LANCE';
  let text = '';
  if (e.type === 'PENALTY_AWARDED') {
    title = ours ? 'PÊNALTI A FAVOR' : 'PÊNALTI CONTRA';
    text = `Pênalti marcado para o ${team}. A cobrança sai em seguida.`;
  } else if (e.type === 'INJURY') {
    title = ours ? 'LESÃO NO SEU TIME' : 'LESÃO NO ADVERSÁRIO';
    text = `${who} (${team}) se machucou.${ours ? '' : ' O adversário faz a troca.'}`;
  } else if (e.type === 'RED_CARD') {
    title = ours ? 'EXPULSÃO NO SEU TIME' : 'EXPULSÃO NO ADVERSÁRIO';
